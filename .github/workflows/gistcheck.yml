name: gistcheck
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          out=$(curl -s https://api.github.com/gists/b45c054b37ad15b84adaa04489ed81a0 | jq -c '{updated_at, files: [.files[] | "\(.filename) \(.size) \(.truncated)"], notas: ((.files["a-cartera-para-claude.txt"].content // "") | test("Notas"))}')
          echo "::notice::$out"

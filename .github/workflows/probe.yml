name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          a=$(curl -s "https://www.alphavantage.co/query?function=OVERVIEW&symbol=IBM&apikey=demo" | jq -c '{ForwardPE,PEGRatio,TrailingPE,AnalystTargetPrice,AnalystRatingStrongBuy,QuarterlyEarningsGrowthYOY,LatestQuarter}')
          echo "::notice title=AV overview::$a"
          b=$(curl -s "https://www.alphavantage.co/query?function=EARNINGS_ESTIMATES&symbol=IBM&apikey=demo" | jq -c '{keys: keys, first: (.estimates // .annualEstimates // [])[0:3]}' | head -c 1800)
          echo "::notice title=AV estimates::$b"
      - run: |
          npm i -s yahoo-finance2@2 >/dev/null 2>&1
          cat > y.mjs <<'JS'
          import yf from 'yahoo-finance2';
          try { const r = await yf.quoteSummary('MSFT', { modules: ['earningsTrend', 'defaultKeyStatistics'] }, { validateResult: false });
            const t = (r.earningsTrend?.trend || []).map(x => ({ p: x.period, g: x.growth, eps: x.earningsEstimate?.avg, n: x.earningsEstimate?.numberOfAnalysts }));
            console.log('::notice title=Yahoo::' + JSON.stringify({ t, peg: r.defaultKeyStatistics?.pegRatio, fpe: r.defaultKeyStatistics?.forwardPE }));
          } catch (e) { console.log('::notice title=Yahoo ERR::' + e.message.slice(0, 300)); }
          JS
          node y.mjs
      - run: |
          c=$(curl -s -o f.html -w "%{http_code}" -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/128 Safari/537.36" "https://finviz.com/quote.ashx?t=MSFT")
          echo "::notice title=Finviz::status $c $(grep -o 'EPS next 5Y[^%]*%' f.html | head -1 | sed 's/<[^>]*>/ /g' | tr -s ' ' | head -c 200)"

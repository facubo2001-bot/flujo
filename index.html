<style>
/* OLED: un solo tema, negro puro (píxeles apagados) */
:root{
  color-scheme:dark;
  --bg:#000000; --surface:#0A0A0B; --surface-2:#111113; --surface-3:#1A1A1D;
  --ink:#F5F5F7; --ink-2:#A6A6AD; --ink-3:#68686F; --line:#1B1B1E; --line-2:#2A2A2E;
  --accent:#4FC3D6; --accent-ink:#8EDCE8; --accent-soft:#0B2429; --accent-soft-2:#12363E;
  --amber:#E0A648; --amber-soft:#241A08;
  --good:#30C85E; --good-text:#4ADE80; --warn:#F5B72E; --warn-text:#F5B72E; --serious:#EC835A; --crit:#E5484D; --crit-text:#F07373;
  --s1:#4C95EB; --s2:#E06A38; --s3:#26AD7E; --s4:#D99C1E; --s5:#DE6B95; --s6:#5CA82E; --s7:#9C90F2; --s8:#E66767;
  --seq1:#14324F; --seq2:#1E568C; --seq3:#3987E5; --seq4:#6DA7EC; --seq5:#B7D3F6;
  --grid:#151518; --axis:#2C2C31;
  --shadow:none;
  --shadow-lg:0 24px 60px -16px rgba(0,0,0,.9);
  --r:16px; --r-sm:10px;
  --font-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Instrument Sans",system-ui,"Segoe UI",sans-serif;
  --font-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;overscroll-behavior:none}
button,a,.nav-btn,.tabbar button{touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent-ink)}
h1,h2,h3,h4{margin:0;font-family:var(--font-display);font-weight:600;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:26px;line-height:1.15}
h2{font-size:18px}
h3{font-size:15px}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:.92em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.rail{position:sticky;top:0;height:100vh;padding:20px 14px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px}

.brand .name{font-family:var(--font-display);font-weight:700;font-size:20px;letter-spacing:-.02em}
.brand .sub{font-size:11px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
.nav-btn{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border:0;border-radius:10px;background:transparent;color:var(--ink-2);font-weight:500;text-align:left;transition:background .12s}
.nav-btn svg{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-btn:hover{background:var(--surface-2);color:var(--ink)}
.nav-btn.active{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.rail .spacer{flex:1}
.rail .save-state{font-size:12px;color:var(--ink-3);padding:8px 12px;display:flex;align-items:center;gap:8px}
.save-dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.save-dot.ok{background:var(--good)} .save-dot.busy{background:var(--warn)} .save-dot.local{background:var(--s1)} .save-dot.err{background:var(--crit)}
.main{min-width:0;padding:22px 28px 90px}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.topbar .title small{display:block;color:var(--ink-3);font-size:13px;margin-top:3px;font-family:var(--font-ui);font-weight:500}
.topbar .tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.month-nav{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.month-nav button{border:0;background:transparent;padding:8px 10px;color:var(--ink-2)}
.month-nav button:hover{background:var(--surface-2)}
.month-nav .label{padding:0 6px;font-weight:600;min-width:122px;text-align:center;font-family:var(--font-display);text-transform:capitalize}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 11px;border-radius:7px;color:var(--ink-2);font-weight:600;font-size:13px}
.seg button.on{background:var(--accent);color:#fff}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;color:var(--ink-2)}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon-btn:hover{background:var(--surface-2)}

/* ---------- mobile shell ---------- */
.mobile-head{display:none}
.tabbar{display:none}
.fab{position:fixed;right:20px;bottom:24px;width:58px;height:58px;border-radius:18px;border:0;background:var(--accent);color:#fff;box-shadow:var(--shadow-lg);display:grid;place-items:center;z-index:30}
.fab svg{width:26px;height:26px;stroke:#fff;stroke-width:2.4;fill:none;stroke-linecap:round}
@media (min-width:901px){.fab{display:none}}
@media (max-width:900px){
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  .app{grid-template-columns:1fr;height:100dvh;min-height:0}
  .rail{display:none}
  .main{height:100dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding:calc(14px + env(safe-area-inset-top)) 14px calc(110px + env(safe-area-inset-bottom))}
  .mobile-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .mobile-head .brand{padding:0}
  .tabbar{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:25}
  .tabbar button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--ink-3);padding:4px 0;font-weight:500}
  .tabbar button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .tabbar button.active{color:var(--accent-ink)}
  .fab{bottom:78px;right:16px;width:54px;height:54px}
  .topbar{margin-bottom:14px}
  h1{font-size:22px}
}

/* ---------- cards & grid ---------- */
.grid{display:grid;gap:14px}
.g-kpi{grid-template-columns:repeat(4,1fr)}
.g-2{grid-template-columns:1fr 1fr}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-21{grid-template-columns:2fr 1fr}
.g-12{grid-template-columns:1fr 2fr}
@media (max-width:1180px){.g-kpi{grid-template-columns:repeat(2,1fr)}.g-3{grid-template-columns:1fr 1fr}}
@media (max-width:900px){.g-2,.g-3,.g-21,.g-12{grid-template-columns:1fr}}
@media (max-width:520px){.g-kpi{grid-template-columns:1fr 1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow);min-width:0}
.card.tight{padding:14px 16px}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-head h2,.card-head h3{font-size:15.5px}
.card-head .hint{font-size:12.5px;color:var(--ink-3)}
.section{margin-top:14px}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}

/* KPI tiles */
.kpi{display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.kpi .label{font-size:12.5px;color:var(--ink-2);font-weight:500}
@media (min-width:1181px){.kpi.hero .label{padding-right:90px}}
.kpi .delta .pill{white-space:normal;line-height:1.35}
.kpi .value{font-family:var(--font-display);font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.1;white-space:nowrap}
.kpi .delta{font-size:12.5px;color:var(--ink-3);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.kpi .delta b{font-weight:600}
.kpi .delta .up{color:var(--crit-text)} .kpi .delta .down{color:var(--good-text)} .kpi .delta .neutral{color:var(--ink-2)}
.kpi .spark{position:absolute;right:12px;top:14px;width:84px;height:34px;opacity:.9}
.kpi.hero .value{font-size:32px}
@media (max-width:1180px){.kpi .value{font-size:24px}.kpi.hero .value{font-size:26px}.kpi .spark{display:none}}
@media (max-width:520px){.kpi .value{font-size:21px}.kpi.hero .value{font-size:23px}}
.kpi.accent{background:linear-gradient(140deg,var(--accent-soft),var(--surface) 70%)}
.kpi.amber{background:linear-gradient(140deg,var(--amber-soft),var(--surface) 70%)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;line-height:1.5;border:1px solid transparent;white-space:nowrap}
.pill.good{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good-text)}
.pill.warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn-text)}
.pill.crit{background:color-mix(in srgb,var(--crit) 14%,transparent);color:var(--crit-text)}
.pill.neutral{background:var(--surface-3);color:var(--ink-2)}
.pill.accent{background:var(--accent-soft);color:var(--accent-ink)}
.pill.amber{background:var(--amber-soft);color:var(--amber)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor}

/* meter */
.meter{height:8px;border-radius:4px;background:var(--surface-3);overflow:hidden;position:relative}
.meter > i{display:block;height:100%;border-radius:4px;background:var(--accent);transition:width .4s}
.meter.warn > i{background:var(--warn)} .meter.crit > i{background:var(--crit)}
.meter .mark{position:absolute;top:-3px;width:2px;height:14px;background:var(--ink);opacity:.5}
.meter-row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;font-size:13px;padding:7px 0;border-bottom:1px solid var(--line)}
.meter-row:last-child{border-bottom:0}
.meter-row .meter{grid-column:1/-1}
.meter-row .l{display:flex;align-items:center;gap:8px;min-width:0}
.meter-row .l span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meter-row .v{color:var(--ink-2);white-space:nowrap}
.swatch{width:10px;height:10px;border-radius:3px;flex:none;display:inline-block}
.dl{display:grid;grid-template-columns:auto 1fr auto;gap:7px 8px;align-items:center;font-size:12.5px;flex:1;min-width:0}
.dl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dl b{font-weight:500}

/* ---------- charts ---------- */
.chart{width:100%;position:relative}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--font-ui);font-size:11px;fill:var(--ink-3)}
.chart .grid line{stroke:var(--grid);stroke-width:1}
.chart .axis line{stroke:var(--axis);stroke-width:1}
.chart .lbl{font-size:11px;fill:var(--ink-2)}
.chart .lbl.strong{fill:var(--ink);font-weight:600}
.chart .hit{fill:transparent}
.chart .hit:hover{fill:color-mix(in srgb,var(--ink) 4%,transparent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend i.line{height:3px;width:14px;border-radius:2px}
.legend i.dash{height:0;width:14px;border-top:2px dashed;background:none!important}
#tooltip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);padding:8px 11px;border-radius:9px;font-size:12px;line-height:1.4;box-shadow:var(--shadow-lg);max-width:260px;opacity:0;transition:opacity .1s;transform:translate(-50%,calc(-100% - 12px))}
#tooltip.show{opacity:1}
#tooltip b{font-weight:600}
#tooltip .row{display:flex;justify-content:space-between;gap:14px}
#tooltip .row i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:6px}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.heat .d{aspect-ratio:1;border-radius:5px;background:var(--surface-3);display:grid;place-items:center;font-size:10.5px;color:var(--ink-3);position:relative;cursor:default}
.heat .d.h1{background:var(--seq1)} .heat .d.h2{background:var(--seq2)} .heat .d.h3{background:var(--seq3);color:#fff} .heat .d.h4{background:var(--seq4);color:#fff} .heat .d.h5{background:var(--seq5);color:#fff}
.heat .d.today{outline:2px solid var(--accent);outline-offset:-2px}
.heat .d.future{opacity:.45}

<script>
/* ===================== FLUJO — core: utils, store, persistence ===================== */
'use strict';

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sum = arr => arr.reduce((a, b) => a + b, 0);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad2 = n => String(n).padStart(2, '0');

/* ---------- dates (all local, ISO strings) ---------- */
const D = {
  today() { const d = new Date(); return D.iso(d); },
  iso(d) { return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; },
  parse(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d || 1); },
  ym(s) { return s.slice(0, 7); },
  ymOf(d) { return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`; },
  thisMonth() { return D.ym(D.today()); },
  addMonths(ym, n) { const [y, m] = ym.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return D.ymOf(d); },
  diffMonths(a, b) { const [ya, ma] = a.split('-').map(Number); const [yb, mb] = b.split('-').map(Number); return (yb - ya) * 12 + (mb - ma); },
  daysIn(ym) { const [y, m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); },
  dateIn(ym, day) { return `${ym}-${pad2(Math.min(day, D.daysIn(ym)))}`; },
  addDays(s, n) { const d = D.parse(s); d.setDate(d.getDate() + n); return D.iso(d); },
  daysBetween(a, b) { return Math.round((D.parse(b) - D.parse(a)) / 86400000); },
  dow(s) { return D.parse(s).getDay(); },
  monthName(ym, short = false) {
    const [y, m] = ym.split('-').map(Number);
    const names = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
    const n = names[m - 1];
    return short ? `${n.slice(0, 3)} ${String(y).slice(2)}` : `${n} ${y}`;
  },
  fmt(s, opts = {}) {
    if (!s) return '';
    const d = D.parse(s);
    const names = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
    if (opts.long) return `${d.getDate()} de ${['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'][d.getMonth()]}`;
    return `${d.getDate()} ${names[d.getMonth()]}${opts.year ? ' ' + String(d.getFullYear()).slice(2) : ''}`;
  },
  range(fromYm, n) { return Array.from({ length: n }, (_, i) => D.addMonths(fromYm, i)); },
};

/* ---------- money ---------- */
const fmtARS = new Intl.NumberFormat('es-AR', { maximumFractionDigits: 0 });
const fmtUSD = new Intl.NumberFormat('es-AR', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
const fmtUSD2 = new Intl.NumberFormat('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const M = {
  tc() { return Number(state.settings.tc) || 1; },
  toARS(monto, moneda) { return moneda === 'USD' ? monto * M.tc() : monto; },
  toUSD(ars) { return ars / M.tc(); },
  /** format an ARS amount in the display currency */
  f(ars, opts = {}) {
    const cur = opts.cur || ui.cur;
    if (cur === 'USD') {
      const v = M.toUSD(ars);
      const s = Math.abs(v) < 100 && !opts.int ? fmtUSD2.format(v) : fmtUSD.format(v);
      return `US$ ${s}`;
    }
    return `$ ${fmtARS.format(Math.round(ars))}`;
  },
  /** compact for tiles: $ 1,2 M / $ 850 k */
  c(ars, opts = {}) {
    const cur = opts.cur || ui.cur;
    if (cur === 'USD') return M.f(ars, opts);
    const a = Math.abs(ars);
    if (a >= 1e6) return `${ars < 0 ? '-' : ''}$ ${(a / 1e6).toLocaleString('es-AR', { maximumFractionDigits: a >= 1e7 ? 1 : 2 })} M`;
    if (a >= 1e4) return `${ars < 0 ? '-' : ''}$ ${(a / 1e3).toLocaleString('es-AR', { maximumFractionDigits: 0 })} k`;
    return M.f(ars, opts);
  },
  pct(v, d = 0) { return `${(v * 100).toLocaleString('es-AR', { maximumFractionDigits: d })} %`; },
  /** original currency formatting for a movement */
  orig(m) { return m.moneda === 'USD' ? `US$ ${fmtUSD2.format(m.monto)}` : `$ ${fmtARS.format(m.monto)}`; },
  parse(str) {
    if (typeof str === 'number') return str;
    let s = String(str || '').trim().replace(/[^\d,.\-]/g, '');
    if (!s) return 0;
    // es-AR: 1.234.567,89 ; also accept 1234567.89
    if (s.includes(',') && s.includes('.')) s = s.replace(/\./g, '').replace(',', '.');
    else if (s.includes(',')) s = s.replace(',', '.');
    else if ((s.match(/\./g) || []).length > 1) s = s.replace(/\./g, '');
    else if (/\.\d{3}$/.test(s)) s = s.replace('.', '');
    return Number(s) || 0;
  },
};

/* ---------- default data ---------- */
const GRUPOS = [

const DEFAULT_CATS = [

  ['auto',       'Auto (seguro, service, patente)', 'auto', 'fijo'],

  ['servicios',  'Luz, gas, agua, internet, celu', 'servicios', 'fijo'],
  ['subs',       'Suscripciones',       'servicios', 'fijo'],
  ['salidas',    'Salidas y bares',     'ocio', 'variable'],
  ['viajes',     'Viajes',              'ocio', 'variable'],
  ['deporte',    'Deporte y gimnasio',  'salud', 'fijo'],
  ['salud',      'Salud y farmacia',    'salud', 'variable'],
  ['educacion',  'Educación y libros',  'salud', 'variable'],
  ['mascotas',   'Mascotas',            'hogar', 'variable'],
  ['personal',   'Cuidado personal',    'salud', 'variable'],
  ['ropa',       'Ropa y calzado',      'compras', 'variable'],
  ['compras_otros', 'Compras online (ML y otros)', 'compras', 'variable'],
  ['tech',       'Tecnología',          'compras', 'variable'],
  ['regalos',    'Regalos',             'compras', 'variable'],
  ['impuestos',  'Impuestos y bancos',  'otros', 'fijo'],
  ['otros',      'Otros',               'otros', 'variable'],
].map(([id, nombre, grupo, tipo]) => ({ id, nombre, grupo, tipo, presupuesto: 0 }));

const NECESIDAD = { 1: 'Necesario', 2: 'Útil', 3: 'Innecesario' };
const MEDIOS = { tarjeta: 'Tarjeta de crédito', debito: 'Débito', efectivo: 'Efectivo', transferencia: 'Transferencia / MP' };

function defaultState() {
  return {
    v: 1, updatedAt: Date.now(),
    settings: { ingreso: 0, presupuesto: 0, diaCobro: 1, tc: 1300, alertaCuotasPct: 60, nombre: '' },
    tarjetas: [],
    cuentas: [],
    categorias: DEFAULT_CATS.map(c => ({ ...c })),
    movimientos: [],
    recurrentes: [],
    ingresos: [],
    inversiones: [],
    pagos: [],
    aprendido: {},
  };
}
const BUILD = '202609142245';
let state = defaultState();
const ui = { view: 'resumen', mes: D.thisMonth(), cur: 'ARS', sort: { key: 'fecha', dir: -1 }, filtros: {}, trendRange: 6 };

/* ---------- lookups ---------- */
const L = {
  cat(id) { return state.categorias.find(c => c.id === id) || state.categorias[state.categorias.length - 1]; },
  grupo(id) { return GRUPOS.find(g => g.id === id) || GRUPOS[7]; },
  grupoDeCat(catId) { return L.grupo(L.cat(catId).grupo); },
  slotColor(slot) { return `var(--s${slot})`; },
  catColor(catId) { return L.slotColor(L.grupoDeCat(catId).slot); },
  tarjeta(id) { return state.tarjetas.find(t => t.id === id); },
  cuenta(id) { return state.cuentas.find(c => c.id === id); },
};

/* ---------- persistence ---------- */
const LS_KEY = 'flujo.v1';
const Persist = {
  status: 'idle', mode: 'unknown', artifact: undefined, timer: null, dirty: false, lastError: '',
  async init() {
    let candidates = [];
    try { const raw = localStorage.getItem(LS_KEY); if (raw) candidates.push({ src: 'local', data: JSON.parse(raw) }); } catch (e) {}
    try { const emb = JSON.parse($('#flujo-data').textContent); if (emb && emb.v) candidates.push({ src: 'embed', data: emb }); } catch (e) {}
    try {
      const url = new URL('data/flujo.json', location.href).href;
      const r = await fetch(url, { cache: 'no-store' });
      if (r.ok) { const j = await r.json(); if (j && j.v) candidates.push({ src: 'cloud', data: j }); }
    } catch (e) {}
    candidates.sort((a, b) => (b.data.updatedAt || 0) - (a.data.updatedAt || 0));
    if (candidates.length) { state = Persist.migrate(candidates[0].data); Persist.mode = candidates[0].src; }
    Persist.setStatus(candidates.length ? (candidates[0].src === 'local' ? 'local' : 'ok') : 'idle');
    if (Persist.applyPreset()) { state.updatedAt = Date.now(); Persist.local(); Persist.schedule(1500); }
    // resolve capability in background (never block first paint)
    Persist.capPromise = (async () => {
      if (window.claude && typeof window.claude.use === 'function') {
        try { Persist.artifact = await window.claude.use('artifact'); } catch (e) { Persist.artifact = null; }
      } else Persist.artifact = null;
      if (Persist.artifact && candidates.length && candidates[0].src === 'local') Persist.schedule(300); // push local-only edits to cloud
      else if (!Persist.artifact && Persist.status === 'ok') Persist.setStatus('local');
    })();
  },
  /** Merge a data preset embedded by Claude (idempotent: applied once per preset id) */
  applyPreset() {
    let list = null; try { list = JSON.parse($('#flujo-preset').textContent); } catch (e) { return false; }
    if (!list) return false; if (!Array.isArray(list)) list = [list];
    state = Persist.migrate(state);
    let changed = false;
    for (const p of list) if (p && p.id && !state.presets.includes(p.id)) { Persist.applyOne(p); changed = true; }
    return changed;
  },
  applyOne(p) {
    const byId = arr => new Set(arr.map(x => x.id));
    for (const c of p.categorias || []) if (!byId(state.categorias).has(c.id)) state.categorias.splice(Math.max(0, state.categorias.length - 1), 0, c);
    for (const t of p.tarjetas || []) if (!byId(state.tarjetas).has(t.id) && !state.tarjetas.find(x => norm(x.nombre) === norm(t.nombre))) state.tarjetas.push(t);
    for (const c of p.cuentas || []) if (!byId(state.cuentas).has(c.id) && !state.cuentas.find(x => norm(x.nombre) === norm(c.nombre))) state.cuentas.push(c);
    for (const r of p.recurrentes || []) if (!byId(state.recurrentes).has(r.id)) state.recurrentes.push(r);
    const previos = state.movimientos.slice();
    const dup = (m) => previos.some(x => x.tarjetaId === m.tarjetaId && Math.abs(M.toARS(Number(x.monto) || 0, x.moneda) - M.toARS(Number(m.monto) || 0, m.moneda)) < 1 && Math.abs(D.daysBetween(x.fecha, m.fecha)) <= 4);
    const ids = byId(state.movimientos);
    for (const m of p.movimientos || []) if (!ids.has(m.id) && !dup(m)) state.movimientos.push(m);
    for (const id of p.remove || []) state.movimientos = state.movimientos.filter(x => x.id !== id);
    for (const u of p.updateTarjetas || []) { const t = state.tarjetas.find(x => x.id === u.id); if (t) Object.assign(t, u); }
    for (const u of p.updateRecurrentes || []) { const r = state.recurrentes.find(x => x.id === u.id); if (r) Object.assign(r, u); }
    for (const id of p.removeRecurrentes || []) state.recurrentes = state.recurrentes.filter(x => x.id !== id);
    for (const term of p.scrub || []) { const t = norm(term); state.movimientos = state.movimientos.filter(x => !norm(x.desc).includes(t)); state.recurrentes = state.recurrentes.filter(x => !norm(x.desc).includes(t)); for (const k of Object.keys(state.aprendido)) if (k.includes(t)) delete state.aprendido[k]; }
    for (const g of p.pagos || []) if (!state.pagos.find(x => x.tarjetaId === g.tarjetaId && x.mes === g.mes)) state.pagos.push(g);
    if (p.limpiarInversionesExcepto) { const keep = p.limpiarInversionesExcepto.map(norm); state.inversiones = state.inversiones.filter(i => keep.some(t => norm(i.desc || '').includes(t) || norm(i.destino || '').includes(t))); }
    for (const i of p.inversiones || []) if (!byId(state.inversiones).has(i.id)) state.inversiones.push(i);
    if (p.settings) for (const [k, v] of Object.entries(p.settings)) if (p.forceSettings || !state.settings[k]) state.settings[k] = v;
    for (const u of p.updates || []) { const m = state.movimientos.find(x => x.id === u.id); if (m) Object.assign(m, u); }
    state.presets.push(p.id);
  },
  migrate(d) {
    const base = defaultState();
    const s = { ...base, ...d, settings: { ...base.settings, ...(d.settings || {}) } };
    if (!s.categorias || !s.categorias.length) s.categorias = base.categorias;
    for (const k of ['tarjetas','cuentas','movimientos','recurrentes','ingresos','inversiones','pagos']) if (!Array.isArray(s[k])) s[k] = [];
    if (!s.aprendido) s.aprendido = {};
    if (!Array.isArray(s.presets)) s.presets = [];
    if (!s.settings.presupuesto && s.settings.ingreso) s.settings.presupuesto = Math.max(0, Math.round(s.settings.ingreso * (1 - (Number(s.settings.metaInversionPct) || 0) / 100) - (Number(s.settings.colchon) || 0)));
    for (const c of DEFAULT_CATS) if (!s.categorias.find(k => k.id === c.id)) s.categorias.splice(Math.max(0, s.categorias.length - 1), 0, { ...c });
    return s;
  },
  setStatus(st, msg) {
    Persist.status = st;
    const map = { idle: ['', 'Sin datos guardados'], busy: ['busy', 'Guardando…'], ok: ['ok', Gist.cfg() && !Persist.artifact ? 'Sincronizado con tu GitHub' : 'Guardado en la nube'], local: ['local', 'Guardado en este dispositivo'], err: ['err', msg || 'No se pudo guardar'] };
    const [cls, text] = map[st] || map.idle;
    for (const id of ['#save-state', '#save-state-m']) {
      const el = $(id); if (!el) continue;
      el.querySelector('.save-dot').className = 'save-dot ' + cls;
      const t = el.querySelectorAll('span')[1]; if (t) t.textContent = text;
      el.title = text;
    }
  },
  save() { state.updatedAt = Date.now(); Persist.local(); Persist.schedule(); },
  local() { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {} },
  schedule(ms = 1800) { Persist.dirty = true; clearTimeout(Persist.timer); Persist.timer = setTimeout(Persist.flush, ms); Persist.setStatus('busy'); },
  async flush() {
    Persist.dirty = false;
    if (Persist.artifact === undefined && Persist.capPromise) await Persist.capPromise;
    if (!Persist.artifact && Gist.cfg()) {
      try { await Gist.push(); Persist.setStatus('ok'); } catch (e) { Persist.setStatus(e && e.status === 401 ? 'err' : 'local', e && e.status === 401 ? 'Token de GitHub inválido' : ''); }
      return;
    }
    if (!Persist.artifact) { Persist.setStatus('local'); return; }
    const json = JSON.stringify(state);
    try {
      await Persist.artifact.publish({ 'data/flujo.json': { content: json, contentType: 'application/json' } });
      Persist.setStatus('ok');
    } catch (e) {
      const code = e && e.code;
      if (code === 'capability_disabled' || code === 'read_only_path' || code === 'capability_removed' || code === 'transform_error') {
        // fallback: republish whole page with embedded data
        try {
          const r = await fetch(location.href, { cache: 'no-store' });
          let html = await r.text();
          const re = /<script type="application\/json" id="flujo-data">[\s\S]*?<\/script>/;
          if (!re.test(html) || !/^\s*<!doctype html>/i.test(html)) throw new Error('no-template');
          html = html.replace(re, `<script type="application/json" id="flujo-data">${json.replace(/<\//g, '<\\/')}<\/script>`);
          sessionStorage.setItem('flujo.ui', JSON.stringify({ view: ui.view, mes: ui.mes, cur: ui.cur }));
          await Persist.artifact.publish(html);
          Persist.setStatus('ok');
        } catch (e2) { Persist.setStatus(e2 && e2.code === 'conflict' ? 'ok' : 'local'); }
      } else if (code === 'conflict') { Persist.setStatus('ok'); }
      else if (code === 'not_granted' || code === 'not_writer' || code === 'not_declared') { Persist.artifact = null; Persist.setStatus('local'); }
      else if (code === 'rate_limited') { Persist.setStatus('busy'); Persist.schedule(15000); }
      else { Persist.lastError = (e && e.message) || String(e); Persist.setStatus('err'); }
    }
  },
};

/* ---------- sincronización vía Gist privado de GitHub (la config vive en ESTE dispositivo) ---------- */
const Gist = {
  FILE: 'gestor-gastos-datos.json', lastPull: 0,
  cfg() { try { return JSON.parse(localStorage.getItem('flujo.gist') || 'null'); } catch (e) { return null; } },
  guardar(c) { try { localStorage.setItem('flujo.gist', JSON.stringify(c)); } catch (e) {} },
  clear() { try { localStorage.removeItem('flujo.gist'); } catch (e) {} },
  hdr(t) { return { 'Authorization': 'Bearer ' + t, 'Accept': 'application/vnd.github+json' }; },
  async conectar(token) {
    const r = await fetch('https://api.github.com/gists?per_page=100', { headers: Gist.hdr(token) });
    if (r.status === 401) throw new Error('El token no es válido. Fijate que sea un token clásico con permiso "gist".');
    if (!r.ok) throw new Error('GitHub respondió ' + r.status);
    const list = await r.json();
    let g = Array.isArray(list) ? list.find(x => x.files && x.files[Gist.FILE]) : null;
    if (!g) {
      const c = await fetch('https://api.github.com/gists', { method: 'POST', headers: Gist.hdr(token), body: JSON.stringify({ description: 'Gestor de gastos — datos (privado)', public: false, files: { [Gist.FILE]: { content: JSON.stringify(state) } } }) });
      if (!c.ok) throw new Error('No pude crear el archivo en GitHub (' + c.status + '). ¿El token tiene permiso "gist"?');
      g = await c.json();
    }
    Gist.guardar({ token, id: g.id });
    return g.id;
  },
  async pull() {
    const c = Gist.cfg(); if (!c) return null;
    const r = await fetch('https://api.github.com/gists/' + c.id, { headers: Gist.hdr(c.token), cache: 'no-store' });
    if (!r.ok) { const e = new Error('gist ' + r.status); e.status = r.status; throw e; }
    const g = await r.json(); const f = g.files && g.files[Gist.FILE]; if (!f) return null;
    let content = f.content;
    if (f.truncated && f.raw_url) { const rr = await fetch(f.raw_url); content = await rr.text(); }
    return JSON.parse(content);
  },
  async push() {
    const c = Gist.cfg(); if (!c) return false;
    const r = await fetch('https://api.github.com/gists/' + c.id, { method: 'PATCH', headers: Gist.hdr(c.token), body: JSON.stringify({ files: { [Gist.FILE]: { content: JSON.stringify(state) } } }) });
    if (!r.ok) { const e = new Error('gist ' + r.status); e.status = r.status; throw e; }
    return true;
  },
  /** trae del gist si hay algo más nuevo; devuelve true si cambió el estado local */
  async refrescar(force = false) {
    if (!Gist.cfg()) return false;
    if (!force && Date.now() - Gist.lastPull < 60000) return false;
    Gist.lastPull = Date.now();
    try {
      const remote = await Gist.pull();
      if (remote && remote.v && (remote.updatedAt || 0) > (state.updatedAt || 0)) { state = Persist.migrate(remote); if (Persist.applyPreset()) { state.updatedAt = Date.now(); Persist.schedule(1500); } Persist.local(); Persist.setStatus('ok'); return true; }
      if (remote && (state.updatedAt || 0) > (remote.updatedAt || 0)) Persist.schedule(800);
      Persist.setStatus('ok');
    } catch (e) { if (e && e.status === 401) Persist.setStatus('err', 'Token de GitHub inválido'); }
    return false;
  },
};

/* ===================== FLUJO — engine: cycles, cuotas, aggregation ===================== */

const E = {
  /** Closing date that falls in month ym (exact per-cycle date if loaded, else the usual day) */
  cierreDe(t, ym) { return (t.cierres && t.cierres[ym]) || D.dateIn(ym, clamp(Number(t.cierre) || 27, 1, 31)); },
  /** For a card + purchase date → closing date, due date, payment month.
      If the purchase falls between two closing dates loaded explicitly (≤ 45 días entre sí), usa la siguiente exacta —
      esto banca ciclos irregulares como un cierre 27-ago seguido de 1-oct. */
  cycle(tarjeta, fecha) {
    const exactas = Object.values(tarjeta.cierres || {}).sort();
    const next = exactas.find(d => d >= fecha);
    const prev = exactas.filter(d => d < fecha).pop();
    if (next && prev && D.daysBetween(prev, next) <= 45) {
      const venc0 = clamp(Number(tarjeta.vencimiento) || 5, 1, 31);
      let vy = D.ym(next); let vd = D.dateIn(vy, venc0);
      while (vd <= next) { vy = D.addMonths(vy, 1); vd = D.dateIn(vy, venc0); }
      return { cierre: next, vencimiento: vd, mesPago: vy };
    }
    let ym = D.ym(fecha); let cierreDate = E.cierreDe(tarjeta, ym);
    if (fecha > cierreDate) { ym = D.addMonths(ym, 1); cierreDate = E.cierreDe(tarjeta, ym); }
    if (next && next < cierreDate) cierreDate = next, ym = D.ym(next);
    const venc = clamp(Number(tarjeta.vencimiento) || 5, 1, 31);
    let vencYm = ym; let vencDate = D.dateIn(vencYm, venc);
    while (vencDate <= cierreDate) { vencYm = D.addMonths(vencYm, 1); vencDate = D.dateIn(vencYm, venc); }
    return { cierre: cierreDate, vencimiento: vencDate, mesPago: vencYm };
  },
  /** Next closing / due dates for a card relative to today */
  cardNow(tarjeta, hoy = D.today()) {
    const c = E.cycle(tarjeta, hoy);
    // period start = day after previous closing
    const exactas = Object.values(tarjeta.cierres || {}).sort();
    const prevCierre = exactas.filter(d => d < c.cierre).pop();
    const periodoDesde = D.addDays(prevCierre && D.daysBetween(prevCierre, c.cierre) <= 45 ? prevCierre : E.cierreDe(tarjeta, D.addMonths(D.ym(c.cierre), -1)), 1);
    return { ...c, periodoDesde, periodoHasta: c.cierre, diasAlCierre: D.daysBetween(hoy, c.cierre), diasAlVenc: D.daysBetween(hoy, c.vencimiento) };
  },
  /** Next statement to pay (earliest whose due date is today or later) */
  proximoPago(tarjeta, hoy = D.today()) {
    const now = E.cardNow(tarjeta, hoy);
    for (const ym of [D.addMonths(now.mesPago, -1), now.mesPago]) { const f = D.dateIn(ym, tarjeta.vencimiento); if (f >= hoy) return { ym, fecha: f, dias: D.daysBetween(hoy, f), ...E.resumen(tarjeta.id, ym) }; }
    return { ym: now.mesPago, fecha: now.vencimiento, dias: now.diasAlVenc, ...E.resumen(tarjeta.id, now.mesPago) };
  },
  /** payment month for a movement's first installment */
  primerPago(m) {
    if (m.primerPago) return m.primerPago;
    if (m.medio === 'tarjeta') { const t = L.tarjeta(m.tarjetaId); if (t) return E.cycle(t, m.fecha).mesPago; }
    return D.ym(m.fecha);
  },
  /** Month the first installment is "spent" in (accrual): purchase month, unless an explicit first statement was set */
  baseMes(m) {

const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim();
const Smart = {
  suggest(desc) {
    const d = norm(desc); if (!d || d.length < 2) return null;
    // 1) learned from history: exact/prefix match of normalized description
    const hist = state.movimientos.filter(m => { const n = norm(m.desc); return n === d || n.startsWith(d) || d.startsWith(n) && n.length >= 3; });
    if (hist.length) {
      const count = {}; for (const m of hist) { const k = [m.catId, m.necesidad || 1, m.medio, m.tarjetaId || ''].join('|'); count[k] = (count[k] || 0) + 1; }
      const best = Object.entries(count).sort((a, b) => b[1] - a[1])[0][0].split('|');
      const last = hist.sort((a, b) => b.fecha.localeCompare(a.fecha))[0];
      return { catId: best[0], necesidad: Number(best[1]), medio: best[2], tarjetaId: best[3] || undefined, monto: last.monto, moneda: last.moneda, src: 'historial', n: hist.length };
    }
    if (state.aprendido[d]) return { ...state.aprendido[d], src: 'aprendido' };
    // 2) dictionary
    for (const [re, cat, nec] of DICT) if (re.test(' ' + d + ' ') || re.test(d)) { if (state.categorias.find(c => c.id === cat)) return { catId: cat, necesidad: nec, src: 'diccionario' }; }
    return null;
  },
  learn(m) { const d = norm(m.desc); if (d.length >= 3) state.aprendido[d] = { catId: m.catId, necesidad: m.necesidad, medio: m.medio, tarjetaId: m.tarjetaId }; },
  /** detect possible recurring expenses among non-recurrent movements */
  detectarRecurrentes() {
    const groups = {};
    for (const m of state.movimientos) { if (m.recId) continue; const k = norm(m.desc).replace(/\d+/g, '').trim(); if (k.length < 3) continue; (groups[k] = groups[k] || []).push(m); }
    const out = [];
    for (const [k, arr] of Object.entries(groups)) {
      const months = [...new Set(arr.map(m => D.ym(m.fecha)))].sort();
      if (months.length < 3) continue;
      let consec = 1, best = 1;
      for (let i = 1; i < months.length; i++) { consec = D.diffMonths(months[i - 1], months[i]) === 1 ? consec + 1 : 1; best = Math.max(best, consec); }
      if (best < 3 || arr.length > months.length * 1.3) continue;

};

function niceMax(v, ticks = 4) {

}

    let g = '<g class="grid">';

    g += '</g>';
    const every = Math.max(1, Math.ceil(30 / (n > 1 ? iw / (n - 1) : iw)));

    for (const s of series) {
      let d = '', started = false, lastIdx = -1;
      s.values.forEach((v, i) => { if (v == null) { started = false; return; } d += (started ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1); started = true; lastIdx = i; });
      if (s.area && d) { const first = s.values.findIndex(v => v != null); paths += `<path d="${d} L${x(lastIdx)} ${y(0)} L${x(first)} ${y(0)} Z" fill="${s.color}" opacity=".1"/>`; }
      paths += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.strong ? 2.5 : 2}" stroke-linecap="round" stroke-linejoin="round" ${s.dashed ? 'stroke-dasharray="5 5"' : ''}/>`;
      if (marker && lastIdx >= 0 && !s.dashed) dots += `<circle cx="${x(lastIdx)}" cy="${y(s.values[lastIdx])}" r="4.5" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`;
    }
    let ref = '';
    if (refY != null) ref = `<line x1="${padL}" x2="${w - padR}" y1="${y(refY)}" y2="${y(refY)}" stroke="var(--ink-3)" stroke-width="1" stroke-dasharray="3 4"/><text x="${w - padR}" y="${y(refY) - 4}" text-anchor="end" class="lbl">${esc(refLabel)}</text>`;
    let hits = '';
    const bw = n > 1 ? iw / (n - 1) : iw;
    labels.forEach((l, i) => {
      const rows = series.filter(s => s.values[i] != null).map(s => tipRow(s.color, s.name, tipFmt(s.values[i], s))).join('');
      hits += `<rect class="hit" x="${x(i) - bw / 2}" y="${padT}" width="${bw}" height="${ih}" data-tip="${esc(`<b>${esc(tipTitle(i))}</b>${rows}`)}"/>`;
    });
    const guide = `<line class="guide" x1="0" x2="0" y1="${padT}" y2="${padT + ih}" stroke="var(--ink-3)" stroke-width="1" opacity="0"/>`;
    return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">${g}<g class="axis"><line x1="${padL}" x2="${w - padR}" y1="${y(0)}" y2="${y(0)}"/></g>${ref}${paths}${dots}${xl}${hits}</svg>`;
  },

  /** Stacked columns. series: [{name,color,values}] ; optional line overlay {name,values,color} on the SAME axis */
  stacked({ w = 640, series, labels, h = 240, line = null, yFmt = axisFmt, tipTitle = i => labels[i], tipFmt = v => M.f(v), highlight = -1, thresholdPct = null }) {
    const padL = 44, padR = 12, padT = 14, padB = 26;
    const iw = w - padL - padR, ih = h - padT - padB; const n = labels.length;
    const totals = labels.map((_, i) => sum(series.map(s => s.values[i] || 0)));
    const all = totals.slice(); if (line) all.push(...line.values.filter(v => v != null));
    const { max, step } = niceMax(Math.max(...all, 1));
    const slot = iw / n; const bw = Math.min(24, slot * 0.6); const x = i => padL + slot * i + slot / 2; const y = v => padT + ih - v / max * ih;
    let g = '<g class="grid">';
    for (let v = 0; v <= max + 1e-9; v += step) g += `<line x1="${padL}" x2="${w - padR}" y1="${y(v)}" y2="${y(v)}"/><text x="${padL - 6}" y="${y(v) + 4}" text-anchor="end">${yFmt(v)}</text>`;
    g += '</g>';
    const every = Math.max(1, Math.ceil(44 / slot));
    let xl = ''; labels.forEach((l, i) => { if (i % every === 0) xl += `<text x="${x(i)}" y="${h - 8}" text-anchor="middle" ${i === highlight ? 'class="lbl strong"' : ''}>${esc(l)}</text>`; });
    let bars = '', hits = '';
    labels.forEach((_, i) => {
      let acc = 0;
      series.forEach((s, si) => {
        const v = s.values[i] || 0; if (v <= 0) return;
        const y1 = y(acc + v), y0 = y(acc); const hh = Math.max(0, y0 - y1 - (acc > 0 ? 2 : 0));
        const top = acc + v >= totals[i] - 1e-9;
        const r = top ? 4 : 0;
        const xx = x(i) - bw / 2;
        bars += r ? `<path d="M${xx} ${y0}V${y1 + r}q0 -${r} ${r} -${r}h${bw - 2 * r}q${r} 0 ${r} ${r}V${y0}Z" fill="${s.color}" />` : `<rect x="${xx}" y="${y1}" width="${bw}" height="${hh}" fill="${s.color}" />`;
        acc += v;
      });
      const rows = series.filter(s => (s.values[i] || 0) > 0).map(s => tipRow(s.color, s.name, tipFmt(s.values[i]))).join('');
      const tot = totals[i] ? tipRow('', 'Total', tipFmt(totals[i])) : '';
      const ln = line && line.values[i] != null ? tipRow('', line.name, tipFmt(line.values[i])) : '';
      hits += `<rect class="hit" x="${padL + slot * i}" y="${padT}" width="${slot}" height="${ih}" data-tip="${esc(`<b>${esc(tipTitle(i))}</b>${rows}${tot}${ln}`)}"/>`;
    });
    let lp = '';
    if (line) { let d = ''; line.values.forEach((v, i) => { if (v == null) return; d += (d ? 'L' : 'M') + x(i) + ' ' + y(v); }); lp = `<path d="${d}" fill="none" stroke="${line.color || 'var(--ink)'}" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round"/>`; }
    let th = '';
    if (thresholdPct != null && line) { let d = ''; line.values.forEach((v, i) => { if (v == null) return; d += (d ? 'L' : 'M') + x(i) + ' ' + y(v * thresholdPct); }); th = `<path d="${d}" fill="none" stroke="var(--warn)" stroke-width="1.5" stroke-dasharray="2 4"/>`; }
    return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">${g}<g class="axis"><line x1="${padL}" x2="${w - padR}" y1="${y(0)}" y2="${y(0)}"/></g>${bars}${th}${lp}${xl}${hits}</svg>`;
  },

  donut({ slices, size = 180, thick = 26, center = '' }) {
    const total = sum(slices.map(s => s.value)) || 1; const r = size / 2 - 4; const c = size / 2; const ri = r - thick;
    let a0 = -Math.PI / 2, paths = '';
    for (const s of slices) {
      if (s.value <= 0) continue;
      const a1 = a0 + s.value / total * Math.PI * 2; const gap = slices.length > 1 ? 0.02 : 0;
      const p = (a, rr) => [c + rr * Math.cos(a), c + rr * Math.sin(a)];
      const [x0, y0] = p(a0 + gap, r), [x1, y1] = p(a1 - gap, r), [x2, y2] = p(a1 - gap, ri), [x3, y3] = p(a0 + gap, ri);
      const large = a1 - a0 > Math.PI ? 1 : 0;
      paths += `<path d="M${x0} ${y0}A${r} ${r} 0 ${large} 1 ${x1} ${y1}L${x2} ${y2}A${ri} ${ri} 0 ${large} 0 ${x3} ${y3}Z" fill="${s.color}" class="hit" data-tip="${esc(`<b>${esc(s.name)}</b>${tipRow('', 'Monto', M.f(s.value))}${tipRow('', 'Participación', M.pct(s.value / total))}`)}"/>`;
      a0 = a1;
    }
    return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" style="flex:none">${paths}<text x="${c}" y="${c - 4}" text-anchor="middle" style="font-size:11px;fill:var(--ink-3)">${esc(center.split('|')[0] || '')}</text><text x="${c}" y="${c + 14}" text-anchor="middle" style="font-family:var(--font-display);font-size:15px;font-weight:600;fill:var(--ink)">${esc(center.split('|')[1] || '')}</text></svg>`;
  },

  spark(values, color = 'var(--accent)', w = 84, h = 34) {
    const vals = values.filter(v => v != null); if (vals.length < 2) return '';
    const max = Math.max(...vals, 1), min = 0; const n = values.length;
    const x = i => 2 + i / (n - 1) * (w - 4); const y = v => h - 3 - (v - min) / (max - min || 1) * (h - 6);
    let d = ''; values.forEach((v, i) => { if (v == null) return; d += (d ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1); });
    const li = values.length - 1;
    return `<svg class="spark" viewBox="0 0 ${w} ${h}"><path d="${d} L${x(li)} ${h} L${x(0)} ${h} Z" fill="${color}" opacity=".12"/><path d="${d}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round"/><circle cx="${x(li)}" cy="${y(values[li])}" r="3" fill="${color}"/></svg>`;
  },

  /** calendar heatmap for a month; byDay: {day: amount} */
  heat(ym, byDay, maxRef) {
    const days = D.daysIn(ym); const first = D.dow(ym + '-01'); const offset = (first + 6) % 7; // monday first
    const vals = Object.values(byDay); const max = maxRef || Math.max(...vals, 1);
    const hoy = D.today(); const isCur = D.ym(hoy) === ym;
    let h = ['L','M','X','J','V','S','D'].map(d => `<div class="wd">${d}</div>`).join('');
    for (let i = 0; i < offset; i++) h += '<div></div>';
    for (let d = 1; d <= days; d++) {
      const v = byDay[d] || 0; const lvl = v <= 0 ? 0 : Math.min(5, Math.ceil(v / max * 5));
      const date = D.dateIn(ym, d); const fut = date > hoy;
      h += `<div class="d h${lvl} ${isCur && Number(hoy.slice(8, 10)) === d ? 'today' : ''} ${fut ? 'future' : ''}" data-tip="${esc(`<b>${D.fmt(date, { long: true })}</b>${tipRow('', 'Gastado', M.f(v))}`)}">${d}</div>`;
    }
    return `<div class="heat">${h}</div>`;
  },

  legend(items) { return `<div class="legend">${items.map(i => `<span><i class="${i.kind || ''}" style="background:${i.color};border-color:${i.color}"></i>${esc(i.name)}</span>`).join('')}</div>`; },
};

/* tooltip delegation */
(function () {
  const tip = $('#tooltip');
  let lastTouch = 0; document.addEventListener('touchstart', () => { lastTouch = Date.now(); }, { passive: true });
  const show = (e) => { if (Date.now() - lastTouch < 800) return; const t = e.target.closest('[data-tip]'); if (!t) { tip.classList.remove('show'); return; } tip.innerHTML = t.dataset.tip; tip.classList.add('show'); move(e); };
  const move = (e) => { const x = e.clientX, y = e.clientY; tip.style.left = clamp(x, 130, window.innerWidth - 130) + 'px'; tip.style.top = (y < 90 ? y + 90 : y) + 'px'; };
  document.addEventListener('mouseover', show); document.addEventListener('mousemove', e => { if (tip.classList.contains('show')) move(e); });
  document.addEventListener('mouseout', e => { if (e.target.closest && e.target.closest('[data-tip]')) tip.classList.remove('show'); });
  let ts = null;
  document.addEventListener('touchstart', e => { const t = e.target.closest && e.target.closest('[data-tip]'); ts = t ? { t, x: e.touches[0].clientX, y: e.touches[0].clientY } : null; }, { passive: true });
  document.addEventListener('touchend', e => { if (!ts) return; const c = e.changedTouches[0]; const moved = Math.abs(c.clientX - ts.x) + Math.abs(c.clientY - ts.y); const t = ts.t; ts = null; if (moved > 8) return; tip.innerHTML = t.dataset.tip; tip.classList.add('show'); const r = t.getBoundingClientRect(); tip.style.left = clamp(r.left + r.width / 2, 130, window.innerWidth - 130) + 'px'; tip.style.top = (r.top < 90 ? r.bottom + 90 : r.top) + 'px'; setTimeout(() => tip.classList.remove('show'), 2500); }, { passive: true });
  document.addEventListener('touchmove', () => { if (tip.classList.contains('show')) tip.classList.remove('show'); }, { passive: true });
})();

/* chart mounting: charts render against the real container width */
const ChartQ = { list: [], reg(fn, h) { const id = ChartQ.list.push(fn) - 1; return `<div class="chart" data-cid="${id}" style="min-height:${h || 200}px"></div>`; }, reset() { ChartQ.list = []; },
  mount() { for (const el of $$('[data-cid]')) { const fn = ChartQ.list[Number(el.dataset.cid)]; if (!fn) continue; const w = Math.max(280, Math.floor(el.clientWidth || el.parentElement.clientWidth || 640)); el.innerHTML = fn(w); el.style.minHeight = ''; } } };


/* ===================== FLUJO — insights (rule-based analysis) ===================== */

const Insights = {
  /** returns list of {level, icon, title, text, view?} for the selected month */
  build(ym) {
    const out = [];
    const c = E.consumo(ym), prev = E.consumo(D.addMonths(ym, -1)), ing = E.ingreso(ym).total; const mg = E.margen(ym);
    const isCur = ym === D.thisMonth(); const proj = E.proyeccion(ym);
    const nextYm = D.addMonths(ym, 1); const ingNext = E.ingreso(nextYm).total;
    const hz = E.horizonte(D.thisMonth(), 12); const alerta = (Number(state.settings.alertaCuotasPct) || 60) / 100;
    if (!c.count) return [{ level: 'info', icon: 'spark', title: 'Todavía no hay movimientos en este mes', text: 'Cargá tus gastos con el botón + y acá vas a ver alertas, tendencias y sugerencias calculadas sobre tus datos.' }];

    // 1. projection vs income / vs previous month
    const pres = mg.presupuesto;
    if (isCur && pres) {
      const ratio = proj.total / pres;
      if (ratio > 1) out.push({ level: 'crit', icon: 'alert', title: `Proyección: te pasás ${M.pct(ratio - 1)} del presupuesto`, text: `Al ritmo actual cerrás ${D.monthName(ym)} con ${M.f(proj.total)} contra un presupuesto de ${M.f(pres)}. Los ${proj.restantes} días que quedan necesitan un freno: cada día de compras promedia ${M.f(proj.pace)}.` });
      else if (ratio > 0.85) out.push({ level: 'warn', icon: 'alert', title: `Proyección ajustada: ${M.pct(ratio)} del presupuesto`, text: `Vas a cerrar el mes cerca de ${M.f(proj.total)}. Queda poco margen si no bajás las compras (${M.f(proj.pace)} por día).` });
      else out.push({ level: 'good', icon: 'check', title: `Proyección de cierre: ${M.f(proj.total)} (${M.pct(ratio)} del presupuesto)`, text: `Si mantenés el ritmo, te sobran ${M.f(mg.quedaProj)} del presupuesto, además de los ${M.f(mg.ahorro)} que ya separás para invertir.` });
    }
    // 2. vs previous month
    if (prev.count && c.count) {
      const d = (c.total - prev.total) / (prev.total || 1);
      const cmp = isCur ? `Comparado con el mismo punto del mes pasado` : `Contra ${D.monthName(D.addMonths(ym, -1))}`;
      let prevToDate = prev.total;
      if (isCur) { const dia = Number(D.today().slice(8, 10)); prevToDate = sum(Object.entries(prev.byDay).filter(([k]) => Number(k) <= dia).map(([, v]) => v)); }
      const dd = (c.total - prevToDate) / (prevToDate || 1);
      if (Math.abs(dd) > 0.12 && prevToDate > 0) out.push({ level: dd > 0 ? 'warn' : 'good', icon: dd > 0 ? 'trend' : 'down', title: `${dd > 0 ? '+' : ''}${M.pct(dd)} vs el mes pasado`, text: `${cmp}: ${M.f(c.total)} contra ${M.f(prevToDate)}. ${dd > 0 ? 'Fijate en qué categorías está la diferencia (abajo).' : 'Buen ritmo, sostenelo.'}` });
    }
    // 3. category jumps
    const jumps = [];
    for (const [catId, v] of Object.entries(c.byCat)) {
      const avg = E.promedioCat(catId, ym, 3);
      if (avg > 0 && v > avg * 1.4 && v - avg > ing * 0.02 && v > 20000) jumps.push({ cat: L.cat(catId), v, avg });
    }
    jumps.sort((a, b) => (b.v - b.avg) - (a.v - a.avg)).slice(0, 2).forEach(j => out.push({ level: 'warn', icon: 'trend', title: `${j.cat.nombre}: ${M.pct(j.v / j.avg - 1)} arriba de tu promedio`, text: `Llevás ${M.f(j.v)} en ${D.monthName(ym)} contra un promedio de ${M.f(j.avg)} en los últimos 3 meses.` }));
    // 4. budgets
    for (const cat of state.categorias) {
      if (!cat.presupuesto) continue; const v = c.byCat[cat.id] || 0; const r = v / M.toARS(cat.presupuesto, 'ARS');
      if (r >= 1) out.push({ level: 'crit', icon: 'alert', title: `Presupuesto de ${cat.nombre} superado (${M.pct(r)})`, text: `Gastaste ${M.f(v)} de los ${M.f(cat.presupuesto)} que definiste.` });
      else if (r >= 0.8 && isCur && proj.restantes > 5) out.push({ level: 'warn', icon: 'clock', title: `${cat.nombre} al ${M.pct(r)} del presupuesto`, text: `Quedan ${M.f(cat.presupuesto - v)} para ${proj.restantes} días.` });
    }
    // 5. unnecessary share
    if (c.total > 0) {
      const share = c.innecesario / c.total;
      const prevShare = prev.total ? prev.byNec[3] / prev.total : null;
      if (share > 0.2) out.push({ level: 'warn', icon: 'alert', title: `${M.pct(share)} de lo gastado lo marcaste como innecesario`, text: `Son ${M.f(c.innecesario)}. ${prevShare != null ? `El mes pasado fue ${M.pct(prevShare)}. ` : ''}Eso equivale a ${M.pct(c.innecesario / (pres || c.total))} de tu presupuesto que podría ir a inversión.` });
      else if (share < 0.08 && c.count > 5) out.push({ level: 'good', icon: 'check', title: `Solo ${M.pct(share)} de gasto innecesario`, text: `Gasto disciplinado: ${M.f(c.innecesario)} en caprichos sobre ${M.f(c.total)}.` });
    }
    // 6. installment load next months
    const heavy = hz.filter(h => h.presupuesto && h.pct > alerta);
    if (heavy.length) {
      const worst = heavy.sort((a, b) => b.pct - a.pct)[0];
      out.push({ level: worst.pct > 0.5 ? 'crit' : 'warn', icon: 'cuotas', title: `${heavy.length === 1 ? 'Un mes' : heavy.length >= 6 ? 'Casi todos los próximos meses' : heavy.length + ' meses'} con más de ${M.pct(alerta)} del presupuesto ya comprometido`, text: `El peor es ${D.monthName(worst.ym)}: ${M.f(worst.comprometido)} entre fijos y cuotas (${M.pct(worst.pct)} del presupuesto). Evitá sumar cuotas nuevas que caigan ahí.`, view: 'cuotas' });
    } else if (hz[1] && hz[1].presupuesto) {
      out.push({ level: 'info', icon: 'cuotas', title: `Ya comprometido para ${D.monthName(nextYm)}: ${M.f(hz[1].comprometido)}`, text: `${M.pct(hz[1].pct)} del presupuesto entre fijos (${M.f(hz[1].fijos)}) y cuotas (${M.f(hz[1].cuotas)}). Te quedan ${M.f(hz[1].libre)} para compras.`, view: 'cuotas' });
    }
    // 7. cuotas finishing soon
    const act = E.cuotasActivas(ym); const ending = act.filter(a => a.last === ym || a.last === nextYm);
    if (ending.length) out.push({ level: 'good', icon: 'check', title: `Se terminan ${ending.length} plan${ending.length > 1 ? 'es' : ''} de cuotas`, text: `${ending.map(a => `${a.m.desc} (${M.f(a.cuota)}/mes)`).join(', ')}. Se liberan ${M.f(sum(ending.map(a => a.cuota)))} mensuales desde ${D.monthName(D.addMonths(ending.sort((a, b) => b.last.localeCompare(a.last))[0].last, 1))}.` });
    // 8. subscriptions annualized
    const subs = state.recurrentes.filter(r => r.activo !== false && L.cat(r.catId).id === 'subs');
    if (subs.length >= 3) { const tot = sum(subs.map(r => M.toARS(r.monto, r.moneda))); out.push({ level: 'info', icon: 'repeat', title: `${subs.length} suscripciones: ${M.f(tot)} por mes`, text: `Anualizado son ${M.f(tot * 12)}. Revisá si usás todas: ${subs.map(s => s.desc).join(', ')}.` }); }
    // 9. hormiga
    const small = c.movs.filter(m => !m.recId && !m.cuotaRow && M.toARS(m.monto, m.moneda) < 8000);
    if (small.length >= 12) { const t = sum(small.map(m => M.toARS(m.monto, m.moneda))); out.push({ level: 'info', icon: 'wallet', title: `Gasto hormiga: ${small.length} compras chicas suman ${M.f(t)}`, text: `Compras de menos de $ 8.000 que individualmente no se notan pero juntas son ${M.pct(t / (c.total || 1))} del mes.` }); }
    // 10. recurring detection
    const det = Smart.detectarRecurrentes();
    if (det.length) out.push({ level: 'info', icon: 'repeat', title: `Detecté ${det.length} gasto${det.length > 1 ? 's' : ''} que se repite${det.length > 1 ? 'n' : ''} todos los meses`, text: `${det.slice(0, 3).map(d => `${d.desc} (~${M.f(d.avg)})`).join(', ')}. Convertilos en fijos para que el pronóstico los tenga en cuenta.`, action: 'detectar' });
    // 11. investment
    const inv = E.invertido(ym);
    if (ing && !isCur && ym <= D.thisMonth()) {
      const libre = ing - c.total; const meta = mg.ahorro;
      if (inv >= meta && meta > 0) out.push({ level: 'good', icon: 'invest', title: `Invertiste ${M.f(inv)}: ${M.pct(inv / ing)} del sueldo`, text: `Cumpliste el objetivo de ${M.f(meta)}.` });
      else if (libre > meta * 0.5 && inv < meta) out.push({ level: 'info', icon: 'invest', title: `Te sobraron ${M.f(libre)} en ${D.monthName(ym)}`, text: `Invertiste ${M.f(inv)}. Registrá lo que aportaste a Balanz/BTC para seguir tu tasa de ahorro real.`, view: 'plan' });
    }
    // 12. weekend pattern
    const wk = { fin: 0, sem: 0 };
    for (const m of c.movs) { if (m.recId || m.cuotaRow) continue; const d = D.dow(m.fecha); wk[d === 0 || d === 6 ? 'fin' : 'sem'] += E.rowAmount(m); }
    if (wk.fin > wk.sem && wk.fin > 0) out.push({ level: 'info', icon: 'clock', title: 'Gastás más los fines de semana que en toda la semana', text: `${M.f(wk.fin)} sábados y domingos contra ${M.f(wk.sem)} de lunes a viernes.` });
    // 13. card closing soon
    if (isCur) for (const t of state.tarjetas) { const now = E.cardNow(t); if (now.diasAlCierre >= 0 && now.diasAlCierre <= 3) out.push({ level: 'info', icon: 'tarjetas', title: `${t.nombre} cierra ${now.diasAlCierre === 0 ? 'hoy' : now.diasAlCierre === 1 ? 'mañana' : 'en ' + now.diasAlCierre + ' días'}`, text: `Lo que compres después del ${D.fmt(now.cierre)} recién lo pagás el ${D.fmt(D.dateIn(D.addMonths(now.mesPago, 1), t.vencimiento))}. Si podés esperar, esperá.` }); }
    // 14. backup reminder (only outside claude.ai)
    if (!window.claude && state.movimientos.length > 20) { const last = state.settings.lastBackup; if (!last || D.daysBetween(last, D.today()) > 30) out.push({ level: 'info', icon: 'download', title: 'Hacé un respaldo', text: `${last ? 'Hace más de un mes que no exportás' : 'Nunca exportaste'} tus datos. Viven solo en este teléfono: Configuración → Exportar → Guardar en Archivos.`, view: 'config' }); }
    const order = { crit: 0, warn: 1, good: 2, info: 3 };
    return out.sort((a, b) => order[a.level] - order[b.level]).slice(0, 8);
  },

  /** Text summary to paste into a Claude chat */
  resumenTexto(ym) {
    const c = E.consumo(ym), ing = E.ingreso(ym); const mg = E.margen(ym);
    const lines = [];
    lines.push(`# Resumen financiero ${D.monthName(ym)} (generado por Gestor de gastos)`);
    lines.push(`Tipo de cambio usado: ${state.settings.tc} ARS/USD. Ingreso: ${M.f(ing.total, { cur: 'ARS' })} (${M.f(ing.total, { cur: 'USD' })}).`);
    lines.push(`Gastos del mes: ${M.f(c.total, { cur: 'ARS' })} — fijos ${M.f(c.fijo, { cur: 'ARS' })}, cuotas de compras anteriores ${M.f(c.cuotas, { cur: 'ARS' })}, compras ${M.f(c.compras, { cur: 'ARS' })}. Innecesario: ${M.f(c.innecesario, { cur: 'ARS' })} (${M.pct(c.innecesario / (c.total || 1))}).`);
    lines.push(`Presupuesto mensual: ${M.f(mg.presupuesto, { cur: 'ARS' })} (el resto, ${M.f(mg.ahorro, { cur: 'ARS' })}, va a inversión). Queda para gastar: ${M.f(mg.queda, { cur: 'ARS' })}.`);
    lines.push(`Invertido: ${M.f(E.invertido(ym), { cur: 'ARS' })}.`);
    lines.push('\n## Por categoría');
    Object.entries(c.byCat).sort((a, b) => b[1] - a[1]).forEach(([k, v]) => lines.push(`- ${L.cat(k).nombre}: ${M.f(v, { cur: 'ARS' })} (${M.pct(v / (c.total || 1))})`));
    lines.push('\n## Próximos 6 meses (comprometido: fijos + cuotas)');
    E.horizonte(D.thisMonth(), 6).forEach(h => lines.push(`- ${D.monthName(h.ym, true)}: fijos + cuotas ${M.f(h.comprometido, { cur: 'ARS' })} de un presupuesto de ${M.f(h.presupuesto, { cur: 'ARS' })} (${M.pct(h.pct)}), libre para compras ${M.f(h.libre, { cur: 'ARS' })}`));
    const act = E.cuotasActivas(ym);
    if (act.length) { lines.push('\n## Cuotas activas'); act.forEach(a => lines.push(`- ${a.m.desc}: cuota ${a.idx}/${a.n} de ${M.f(a.cuota, { cur: 'ARS' })}, termina ${D.monthName(a.last, true)}`)); }
    lines.push('\n## Movimientos del mes');
    c.movs.sort((a, b) => a.fecha.localeCompare(b.fecha)).forEach(m => lines.push(`- ${m.fecha} | ${m.desc} | ${M.f(E.rowAmount(m), { cur: 'ARS' })}${m.cuotaRow ? ` (cuota ${m.cuotaIdx}/${m.cuotaN})` : (m.cuotas || 1) > 1 ? ` (1/${m.cuotas} cuotas, total ${M.orig(m)})` : ''} | ${L.cat(m.catId).nombre} | ${NECESIDAD[m.necesidad || 1]} | ${MEDIOS[m.medio] || m.medio}${m.recId ? ' | fijo' : ''}`));
    lines.push('\nAnalizá tendencias, señalá gastos evitables y decime cuánto podría invertir el mes que viene sin quedarme corto.');
    return lines.join('\n');
  },
};

const catChip = (catId) => { const c = L.cat(catId); return `<span class="cat-chip"><i style="background:${L.catColor(catId)}"></i>${esc(c.nombre)}</span>`; };
const necBadge = (n) => `<span class="nec nec-${n || 1}" title="${NECESIDAD[n || 1]}">${n || 1}</span>`;

const deltaPill = (cur, prev, invert = false) => { if (!prev) return ''; const d = (cur - prev) / prev; const up = d > 0; const good = invert ? up : !up; return `<b class="${Math.abs(d) < 0.02 ? 'neutral' : good ? 'down' : 'up'}">${up ? '+' : ''}${M.pct(d)}</b>`; };
const kpi = ({ label, value, sub = '', cls = '', spark = '' }) => `<div class="card kpi ${cls}"><div class="label">${label}</div><div class="value">${value}</div><div class="delta">${sub}</div>${spark}</div>`;

/* ---------- RESUMEN ---------- */
function renderCierreBanner() {
  if (ui.cierreDismiss) return '';
  const hoy = D.today();
  for (const t of state.tarjetas) {
    const cy = E.cycle(t, hoy); const ym = D.ym(cy.cierre);
    if (t.cierres && t.cierres[ym]) continue;
    return `<div class="callout amber" style="margin-bottom:14px"><b>¿Cuándo cierra ${esc(t.nombre)} este período?</b><br><span class="small muted">Estoy estimando el ${D.fmt(cy.cierre, { year: true })}. La fecha exacta cambia un poco cada mes; con la real, cada compra cae en el resumen justo.</span><div class="row" style="margin-top:10px;gap:8px"><button class="btn sm primary" data-act="cierre-ok" data-id="${t.id}|${ym}|${cy.cierre}">Es el ${D.fmt(cy.cierre)}</button><button class="btn sm" data-act="cierre-edit" data-id="${t.id}|${ym}|${cy.cierre}">Otra fecha</button><button class="btn sm ghost" data-act="cierre-later">Después</button></div></div>`;
  }
  return '';
}

function viewResumen() {
  const ym = ui.mes; const isCur = ym === D.thisMonth();
  const c = E.consumo(ym), prev = E.consumo(D.addMonths(ym, -1)), ing = E.ingreso(ym), proj = E.proyeccion(ym);
  if (!state.settings.ingreso && !state.movimientos.length && !state.recurrentes.length) return viewOnboarding();
  const dia = Number(D.today().slice(8, 10));
  const avg = E.promedioAcumulado(ym);
  const avgToDate = avg.vals ? avg.vals[(isCur ? dia : D.daysIn(ym)) - 1] : null;
  const last6 = D.range(D.addMonths(ym, -5), 6).map(m => E.consumo(m).total);
  const margen = E.margen(ym); const mesN = D.monthName(ym).split(' ')[0];
  const projPct = margen.presupuesto ? proj.total / margen.presupuesto : 0; const pres = margen.presupuesto; const comp = margen.fijos + c.cuotas;

  let html = renderCierreBanner();
  html += `<div class="grid g-kpi">`;
  html += kpi({ label: `Gastos de ${mesN}`, value: M.f(c.total), sub: `${avgToDate ? deltaPill(c.total, avgToDate) : ''} <span>${avgToDate ? `vs promedio${isCur ? ' al mismo día' : ''} (${avg.n} ${avg.n === 1 ? 'mes' : 'meses'})` : ''} · compras ${M.c(c.compras)}</span>`, spark: Charts.spark(last6), cls: 'hero' });
  html += kpi({ label: isCur ? 'Proyección de cierre' : ym > D.thisMonth() ? 'Estimado (promedio 3 meses)' : 'Cerró el mes en', value: M.f(proj.total), sub: pres ? `<span class="pill ${projPct > 1 ? 'crit' : projPct > 0.85 ? 'warn' : 'good'}">${M.pct(projPct)} del presupuesto</span>${isCur ? `<span>${M.f(proj.pace || 0)}/día · ${proj.restantes} días</span>` : ''}` : '<span>Cargá tu presupuesto en Configuración</span>' });
  html += kpi({ label: `Fijos + cuotas de ${mesN}`, value: M.f(comp), sub: `<span>Fijos ${M.c(margen.fijos)} · ${c.nCuotas} cuota${c.nCuotas === 1 ? '' : 's'} ${M.c(c.cuotas)}</span>${pres ? `<span class="pill ${comp / pres > 0.6 ? 'crit' : comp / pres > 0.4 ? 'warn' : 'neutral'}">${M.pct(comp / pres)} del presupuesto</span>` : ''}`, cls: 'amber' });
  html += kpi({ label: isCur ? 'Te queda para gastar' : ym < D.thisMonth() ? 'Te quedó sin gastar' : 'Quedará para gastar', value: M.f(margen.queda), sub: pres ? `<span class="pill ${margen.queda < 0 ? 'crit' : margen.queda < pres * 0.1 ? 'warn' : 'good'}">${margen.queda < 0 ? 'te pasaste del presupuesto' : 'presupuesto ' + M.c(pres)}</span>${isCur && margen.restantes ? `<span>${M.f(Math.max(0, margen.queda) / margen.restantes)}/día por ${margen.restantes} días</span>` : ''}` : '<span>Cargá tu presupuesto en Configuración</span>', cls: 'accent' });
  html += `</div>`;

  // ritmo + margen
  const days = D.daysIn(ym); const labels = Array.from({ length: days }, (_, i) => String(i + 1));
  const cum = (agg, upto) => { let a = 0; return labels.map((_, i) => { if (i + 1 > upto) return null; a += (agg.byDay[i + 1] || 0); return a; }); };
  const curVals = cum(c, isCur ? dia : days);
  const avgVals = avg.vals ? avg.vals.slice(0, days) : labels.map(() => null);
  let projVals = labels.map(() => null);
  if (isCur && proj.pace != null) { const base = curVals[dia - 1] || 0; const fijosRest = Math.max(0, proj.fijo - c.fijo); for (let i = dia - 1; i < days; i++) projVals[i] = base + (proj.pace + fijosRest / Math.max(1, proj.restantes)) * (i + 1 - dia); }
  html += `<div class="grid g-21 section">
    <div class="card"><div class="card-head"><h2>Ritmo del mes</h2><span class="hint">Acumulado por día de compra</span></div>
      ${ChartQ.reg(w => Charts.line({ w, labels, h: 230, tipTitle: i => `Día ${labels[i]}`, refY: margen.presupuesto || null, refLabel: margen.presupuesto ? 'Presupuesto' : '', series: [
        ...(avg.vals ? [{ name: `Promedio ${avg.n} ${avg.n === 1 ? 'mes' : 'meses'}`, color: 'var(--line-2)', values: avgVals }] : []),
        { name: D.monthName(ym).split(' ')[0], color: 'var(--accent)', values: curVals, area: true, strong: true },
        ...(isCur ? [{ name: 'Proyección', color: 'var(--accent)', values: projVals, dashed: true }] : []),
      ] }), 230)}
      ${Charts.legend([{ name: 'Este mes', color: 'var(--accent)', kind: 'line' }, ...(avg.vals ? [{ name: `Promedio (${avg.n} ${avg.n === 1 ? 'mes' : 'meses'})`, color: 'var(--line-2)', kind: 'line' }] : []), ...(isCur ? [{ name: 'Proyección', color: 'var(--accent)', kind: 'dash' }] : [])])}
    </div>
    <div class="card"><div class="card-head"><h2>Cuánto me queda</h2><span class="hint">${D.monthName(ym)}</span></div>${renderMargen(margen, proj)}</div>
  </div>`;

  // insights + donut
  const ins = Insights.build(ym);
  const grupos = Object.entries(c.byGrupo).map(([g, v]) => ({ name: L.grupo(g).nombre, value: v, color: L.slotColor(L.grupo(g).slot), id: g })).sort((a, b) => b.value - a.value);
  html += `<div class="grid g-21 section">
    <div class="card"><div class="card-head"><h2>Lectura del mes</h2><span class="hint">Alertas y patrones calculados sobre tus datos</span></div>${renderInsights(ins)}</div>
    <div class="card"><div class="card-head"><h2>Dónde se fue</h2><span class="hint">${D.monthName(ym)}</span></div>
      ${grupos.length ? `<div class="row" style="align-items:flex-start;gap:16px">${Charts.donut({ slices: grupos, size: 150, thick: 22, center: `Total|${M.c(c.total)}` })}<div class="dl">${grupos.map(g => `<i class="swatch" style="background:${g.color}"></i><span>${esc(g.name)}</span><b class="mono">${M.pct(g.value / c.total)}</b>`).join('')}</div></div>` : '<div class="empty">Sin gastos este mes</div>'}
    </div>
  </div>`;

  // categorías + horizonte
  const cats = Object.entries(c.byCat).map(([id, v]) => ({ cat: L.cat(id), v, avg: E.promedioCat(id, ym, 3) })).sort((a, b) => b.v - a.v);
  const hz = E.horizonte(D.thisMonth(), 12); const alerta = (Number(state.settings.alertaCuotasPct) || 60) / 100;
  html += `<div class="grid g-2 section">
    <div class="card"><div class="card-head"><h2>Por categoría</h2><span class="hint">Barra = vs presupuesto o promedio 3 meses</span></div>
      ${cats.length ? cats.slice(0, 9).map(({ cat, v, avg }) => { const ref = cat.presupuesto || avg || v; const r = v / (ref || 1); return `<div class="meter-row"><div class="l"><i class="swatch" style="background:${L.catColor(cat.id)}"></i><span>${esc(cat.nombre)}</span>${cat.presupuesto ? `<span class="pill ${r > 1 ? 'crit' : r > .8 ? 'warn' : 'neutral'}" style="font-size:10.5px">${M.pct(r)}</span>` : ''}</div><div class="v"><b class="mono">${M.f(v)}</b>${cat.presupuesto ? ` <span class="muted">/ ${M.c(cat.presupuesto)}</span>` : avg ? ` <span class="muted">prom. ${M.c(avg)}</span>` : ''}</div><div class="meter ${cat.presupuesto && r > 1 ? 'crit' : cat.presupuesto && r > .8 ? 'warn' : ''}"><i style="width:${clamp(r * 100, 2, 100)}%;background:${cat.presupuesto ? '' : L.catColor(cat.id)}"></i>${!cat.presupuesto && avg ? `<span class="mark" style="left:${clamp(avg / Math.max(v, avg) * 100, 0, 100)}%"></span>` : ''}</div></div>`; }).join('') : '<div class="empty">Sin gastos este mes</div>'}
    </div>
    <div class="card"><div class="card-head"><h2>Próximos 12 meses</h2><span class="hint">Fijos + cuotas ya comprometidos vs presupuesto</span></div>
      ${ChartQ.reg(w => Charts.stacked({ w, h: 230, labels: hz.map(h => D.monthName(h.ym, true)), series: [{ name: 'Fijos', color: 'var(--s1)', values: hz.map(h => h.fijos) }, { name: 'Cuotas', color: 'var(--s4)', values: hz.map(h => h.cuotas) }], line: { name: 'Presupuesto', color: 'var(--ink-2)', values: hz.map(h => h.presupuesto || null) }, thresholdPct: alerta }), 230)}
      ${Charts.legend([{ name: 'Fijos', color: 'var(--s1)' }, { name: 'Cuotas', color: 'var(--s4)' }, { name: 'Presupuesto', color: 'var(--ink-2)', kind: 'dash' }, { name: `Alerta ${M.pct(alerta)}`, color: 'var(--warn)', kind: 'dash' }])}
    </div>
  </div>`;

  // últimas compras (solo lo cargado a mano en el mes visto: sin fijos ni cuotas)
  const last = state.movimientos.filter(m => !m.recId && m.fecha.startsWith(ym)).slice().sort((a, b) => b.fecha.localeCompare(a.fecha) || (b.id > a.id ? 1 : -1));
  html += `<div class="card section"><div class="card-head"><h2>Últimas compras</h2><div class="row" style="gap:8px"><span class="hint">Sin fijos ni cuotas</span><button class="btn ghost sm" data-go="movimientos">Ver todo el mes →</button></div></div>${renderMovTable(last, { compact: true })}</div>`;
  return html;
}

function renderMargen(mg, proj) {
  if (!mg.presupuesto) return `<div class="empty">Cargá en Configuración cuánto querés gastar por mes (tu presupuesto) para ver cuánto te queda.</div>`;
  const isCur = mg.ym === D.thisMonth();
  const rows = [
    ['Presupuesto del mes', mg.presupuesto, 'in'],
    ['Fijos', -mg.fijos, 'var(--s1)'],
    ['Cuotas del mes', -mg.cuotas, 'var(--s4)'],
    [isCur ? 'Compras hasta hoy' : 'Compras', -mg.compras, 'var(--s2)'],
  ];
  let acc = 0; const maxV = Math.max(mg.presupuesto, mg.fijos + mg.cuotas + mg.compras, 1);
  const wf = rows.map(([l, v, color]) => { let left, width; if (color === 'in') { left = 0; width = v / maxV * 100; acc = v; } else { const from = acc; acc += v; left = Math.max(0, acc) / maxV * 100; width = (Math.max(from, 0) - Math.max(acc, 0)) / maxV * 100; } return `<div class="wf"><span>${l}</span><div class="bar"><i style="left:${left}%;width:${width}%;background:${color === 'in' ? 'var(--line-2)' : color}"></i></div><span class="n">${v < 0 ? '−' : ''}${M.f(Math.abs(v))}</span></div>`; }).join('');
  return `<div style="font-family:var(--font-display);font-size:30px;font-weight:600;letter-spacing:-.02em;color:${mg.queda < 0 ? 'var(--crit-text)' : 'var(--ink)'}">${M.f(mg.queda)}</div>
    <p class="small muted" style="margin:2px 0 12px">${mg.queda < 0 ? 'Ya te pasaste del presupuesto del mes.' : isCur ? `Podés gastar hasta ahí en lo que queda de ${D.monthName(mg.ym).split(' ')[0]}.` : 'Lo que quedó del presupuesto después de fijos, cuotas y compras.'}</p>
    <div class="waterfall">${wf}<div class="wf total"><span>Queda</span><div class="bar"><i style="left:0;width:${clamp(Math.max(0, mg.queda) / maxV * 100, 0, 100)}%;background:var(--accent)"></i></div><span class="n">${M.f(mg.queda)}</span></div></div>
    ${isCur && proj && proj.pace != null ? `<div class="callout ${mg.quedaProj < 0 ? 'crit' : ''}" style="margin-top:12px">Al ritmo actual (${M.f(proj.pace)}/día en compras) cerrás el mes ${mg.quedaProj < 0 ? `<b>${M.f(-mg.quedaProj)}</b> por encima del presupuesto.` : `con <b>${M.f(mg.quedaProj)}</b> sin usar.`}</div>` : ''}
    ${mg.ingreso ? `<p class="small muted" style="margin-top:10px">Sueldo ${M.f(mg.ingreso)} − presupuesto ${M.f(mg.presupuesto)} = <b>${M.f(mg.ahorro)}</b> para invertir / ahorrar.</p>` : ''}`;
}

function renderInsights(list) {

}

/* ---------- MOVIMIENTOS ---------- */
function renderMovTable(movs, opts = {}) {
  if (!movs.length) return '<div class="empty">No hay movimientos con estos filtros.</div>';
  const s = ui.sort; const key = s.key;
  const val = m => key === 'monto' ? E.rowAmount(m) : key === 'cat' ? L.cat(m.catId).nombre : key === 'nec' ? (m.necesidad || 1) : key === 'desc' ? norm(m.desc) : m.fecha + (m.id || '');
  const rows = opts.compact ? movs : movs.slice().sort((a, b) => { const va = val(a), vb = val(b); return (va > vb ? 1 : va < vb ? -1 : 0) * s.dir; });
  const th = (k, label, cls = '') => opts.compact ? `<th class="${cls}">${label}</th>` : `<th class="${cls} ${key === k ? 'sorted' : ''}" data-sort="${k}">${label}${key === k ? (s.dir > 0 ? ' ↑' : ' ↓') : ''}</th>`;
  return `<div class="table-wrap"><table class="responsive ${!opts.compact && key === 'fecha' ? 'grouped' : ''}"><thead><tr>${th('fecha', 'Fecha')}${th('desc', 'Descripción')}${th('cat', 'Categoría')}<th>Medio</th>${th('nec', 'Nec.')}${th('monto', 'Monto', 'r')}<th></th></tr></thead><tbody>
  ${rows.map((m, i) => { const ars = E.rowAmount(m); const dayHead = !opts.compact && key === 'fecha' && (i === 0 || rows[i - 1].fecha !== m.fecha) ? `<tr class="day"><td colspan="7">${['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'][D.dow(m.fecha)]} ${D.fmt(m.fecha)}<span>${M.f(sum(rows.filter(x => x.fecha === m.fecha).map(E.rowAmount)))}</span></td></tr>` : ''; const total = M.toARS(m.monto, m.moneda); const cuotas = (m.cuotas || 1) > 1; const t = L.tarjeta(m.tarjetaId); const pago = m.medio === 'tarjeta' && t && !m.cuotaRow ? E.primerPago(m) : null;
    return dayHead + `<tr class="${m.virtual ? 'virtual' : ''} ${m.cuotaRow ? 'cuota' : ''}" data-id="${m.id}">
      <td class="keep mono muted fecha" style="white-space:nowrap">${D.fmt(m.fecha)}</td>

}

function viewMovimientos() {
  const ym = ui.mes; const f = ui.filtros; const c = E.consumo(ym);
  let movs = c.movs;
  if (f.q) { const q = norm(f.q); movs = movs.filter(m => norm(m.desc).includes(q) || norm(m.notas || '').includes(q)); }
  if (f.cat) movs = movs.filter(m => m.catId === f.cat);
  if (f.grupo) movs = movs.filter(m => L.cat(m.catId).grupo === f.grupo);
  if (f.medio) movs = movs.filter(m => f.medio.startsWith('t:') ? m.tarjetaId === f.medio.slice(2) : m.medio === f.medio);
  if (f.nec) movs = movs.filter(m => String(m.necesidad || 1) === f.nec);
  if (f.tipo === 'fijos') movs = movs.filter(m => m.recId); else if (f.tipo === 'variables') movs = movs.filter(m => !m.recId && !m.cuotaRow); else if (f.tipo === 'cuotas') movs = movs.filter(m => m.cuotaRow || (m.cuotas || 1) > 1);
  const total = sum(movs.map(E.rowAmount)); const innec = sum(movs.filter(m => (m.necesidad || 1) === 3).map(E.rowAmount));
  const sel = (id, opts, cur, ph) => `<select class="input sm" data-filter="${id}"><option value="">${ph}</option>${opts.map(o => `<option value="${o[0]}" ${cur === o[0] ? 'selected' : ''}>${esc(o[1])}</option>`).join('')}</select>`;
  return `<div class="card">
    <div class="filters">
      <input class="input sm" style="min-width:180px;flex:1" placeholder="Buscar…" data-filter="q" value="${esc(f.q || '')}">
      ${sel('cat', state.categorias.map(c => [c.id, c.nombre]), f.cat, 'Todas las categorías')}
      ${sel('medio', [['tarjeta', 'Tarjeta (todas)'], ...state.tarjetas.map(t => ['t:' + t.id, t.nombre]), ['debito', 'Débito'], ['efectivo', 'Efectivo'], ['transferencia', 'Transferencia / MP']], f.medio, 'Todos los medios')}
      ${sel('nec', [['1', 'Necesario'], ['2', 'Útil'], ['3', 'Innecesario']], f.nec, 'Necesidad')}
      ${sel('tipo', [['variables', 'Solo compras'], ['fijos', 'Solo fijos'], ['cuotas', 'Solo cuotas']], f.tipo, 'Todo (compras, fijos, cuotas)')}
      ${Object.values(f).some(Boolean) ? '<button class="btn ghost sm" data-act="clear-filters">Limpiar</button>' : ''}
    </div>
    <div class="row between small muted" style="margin-bottom:8px"><span>${movs.length} movimientos · <b class="mono" style="color:var(--ink)">${M.f(total)}</b></span><span>Innecesario: <b class="mono">${M.f(innec)}</b> (${M.pct(innec / (total || 1))})</span></div>
    ${renderMovTable(movs)}
    <p class="small muted" style="margin-top:10px">Cada mes muestra sus compras, sus fijos y las cuotas de compras anteriores que caen en él (monto de la cuota, no el total). Las filas con borde ámbar son fijos estimados: tocá <b>Confirmar</b> para cargar el monto real. <kbd>N</kbd> abre un gasto nuevo.</p>
  </div>`;
}

/* ---------- CUOTAS Y FIJOS ---------- */

    ${ChartQ.reg(w => Charts.stacked({ w, h: 250, labels: hz.map(h => D.monthName(h.ym, true)), series: [{ name: 'Fijos', color: 'var(--s1)', values: hz.map(h => h.fijos) }, { name: 'Cuotas', color: 'var(--s4)', values: hz.map(h => h.cuotas) }, { name: 'Compras', color: 'var(--line-2)', values: hz.map(h => h.nuevo) }], line: { name: 'Presupuesto', color: 'var(--ink-2)', values: hz.map(h => h.presupuesto || null) }, thresholdPct: alerta }), 250)}
    ${Charts.legend([{ name: 'Fijos', color: 'var(--s1)' }, { name: 'Cuotas', color: 'var(--s4)' }, { name: 'Compras del mes', color: 'var(--line-2)' }, { name: 'Presupuesto', color: 'var(--ink-2)', kind: 'dash' }, { name: `Umbral ${M.pct(alerta)}`, color: 'var(--warn)', kind: 'dash' }])}
    <div class="table-wrap" style="margin-top:12px"><table><thead><tr><th>Mes</th><th class="r">Fijos</th><th class="r">Cuotas</th><th class="r">Fijos + cuotas</th><th class="r">% presup.</th><th class="r">Libre para compras</th></tr></thead><tbody>
      ${hz.map(h => `<tr><td style="text-transform:capitalize">${D.monthName(h.ym)}</td><td class="amount r">${M.f(h.fijos)}</td><td class="amount r">${M.f(h.cuotas)}</td><td class="amount r"><b>${M.f(h.comprometido)}</b></td><td class="r">${h.presupuesto ? `<span class="pill ${h.pct > 0.5 ? 'crit' : h.pct > alerta ? 'warn' : 'good'}">${M.pct(h.pct)}</span>` : '—'}</td><td class="amount r">${h.presupuesto ? M.f(h.libre) : '—'}</td></tr>`).join('')}
    </tbody></table></div></div>`;
  html += `<div class="grid g-2 section">
    <div class="card"><div class="card-head"><h2>Cuotas en curso</h2><span class="hint">${act.length} planes</span></div>
      ${act.length ? act.map(a => `<div class="cuota-row"><div><b style="font-weight:500">${esc(a.m.desc)}</b> <span class="progress-pill">${a.idxPeriodo}/${a.n}</span></div><div class="amt">${M.f(a.cuota)}<span class="muted"> /mes</span></div><div class="sub">${L.cat(a.m.catId).nombre} · ${medioLabel(a.m)}${a.cierre && a.idxPeriodo <= a.n ? ` · la ${a.idxPeriodo}/${a.n} cierra el ${D.fmt(a.cierre)}` : ''} · termina ${D.monthName(a.last, true)} · faltan ${M.f(a.restante)}</div><div class="meter"><i style="width:${a.idxPeriodo / a.n * 100}%;background:var(--s4)"></i></div></div>`).join('') : '<div class="empty">No tenés compras en cuotas activas.</div>'}

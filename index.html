/* ===================== FLUJO — views B: tarjetas, plan, tendencias, config ===================== */

const CARD_COLORS = ['#1F4E79', '#5B2C6F', '#7A3E1D', '#1E5E4A', '#3B3B6B', '#7A1F3D'];
/** Los colores de tarjeta se eligieron para un degrade de fondo; como punto de 8 px sobre negro
 *  no se ven. Cada uno tiene su equivalente luminoso para el punto y el swatch. */
const CARD_DOT = { '#1F4E79': '#2F6FD0', '#5B2C6F': '#8E5BD0', '#7A3E1D': '#D07A3A', '#1E5E4A': '#2FA98A', '#3B3B6B': '#6C63C7', '#7A1F3D': '#D0446F' };
const cardDot = c => CARD_DOT[String(c || '').toUpperCase()] || c || 'var(--ink-3)';

/* ---------- TARJETAS Y PAGOS ---------- */
function viewTarjetas() {
  const hoy = D.today(); const ym = ui.mes;
  if (!state.tarjetas.length) return `<div class="card">${empty({ kind: 'setup', icon: 'card', head: 'Todavía no cargaste tarjetas', sub: 'Agregá la primera y Gastos calcula solo el cierre, las cuotas y cuánto pagás cada mes.', btn: 'Agregar tarjeta', action: 'new-card' })}</div>`;
  const kARS = v => `$ ${abrevARS(v)}`;
  const sinCuotas = d => String(d || '').replace(/,\s*\d+\s*cuotas?\)/i, ')').replace(/\s*\(\s*\d+\s*cuotas?\s*\)\s*$/i, '');
  // --- tarjetas: mismo formato que las de Cartera (numero grande + tres filas + pie)
  let html = `<div class="grid g-kpi">`;
  state.tarjetas.forEach((t, i) => {
    const now = E.cardNow(t, hoy);
    const consumoPeriodo = sum(E.data().pieces.filter(p => p.m.medio === 'tarjeta' && p.m.tarjetaId === t.id && p.mesPago === now.mesPago && p.idx === 1 && !p.m.recId).map(p => p.montoARS));
    const prox = E.proximoPago(t, hoy);
    const cerrando = E.resumen(t.id, now.mesPago);
    const lim = Number(t.limite) || 0; const uso = lim ? (prox.ym === now.mesPago ? cerrando.total : prox.total + cerrando.total) / lim : 0;
    const stats = [{ k: 'Nuevo', v: kARS(consumoPeriodo) }, { k: 'Cuotas', v: kARS(cerrando.total - consumoPeriodo) }];
    if (prox.ym !== now.mesPago) stats.push({ k: `Pag\u00e1s ${D.fmt(prox.fecha)}`, v: kARS(prox.total), cls: 'mid' });
    if (lim) stats.push({ k: 'L\u00edmite', v: M.pct(uso, 0), cls: uso >= 0.85 ? 'neg' : uso >= 0.6 ? 'mid' : 'pos' });
    const esSel = (ui.resCard || state.tarjetas[0].id) === t.id;
    html += `<div class="card kpi tap ${esSel ? 'sel' : ''}" data-act="tj-sel" data-id="${t.id}"><div class="label"><i class="bankdot" style="background:${cardDot(t.color || CARD_COLORS[i % CARD_COLORS.length])}"></i>${esc(t.nombre)}</div><div class="value">${M.f(cerrando.total)}</div>
      <div class="mini">${stats.map(x => `<div><span class="k">${x.k}</span><b class="${x.cls || ''}">${x.v}</b></div>`).join('')}</div>
      <div class="foot">cierra en ${now.diasAlCierre} d\u00eda${now.diasAlCierre === 1 ? '' : 's'} \u00b7 vence ${D.fmt(cerrando.fecha)}</div></div>`;
  });
  html += `</div><button class="tj-add" data-act="new-card">${ICONS.plus} Agregar tarjeta</button>`;

  // --- solo lo que va en cada tarjeta (Facu: plan de pago y cuentas no hacen falta). Tocar una tarjeta la elige.
  const tSel = state.tarjetas.find(t => t.id === ui.resCard) || state.tarjetas[0];
  const mSel = ui.resMes || E.cardNow(tSel, hoy).mesPago;
  html += `<div class="card section"><div class="card-head"><h2>Qu\u00e9 va en ${esc(tSel.nombre)}</h2><button class="btn sm ghost" data-act="edit-card" data-id="${tSel.id}">${ICONS.edit} Editar</button></div>
    <div class="tp-sels"><select class="tp-sel" id="res-mes">${D.range(D.addMonths(ym, -2), 8).map(m => `<option value="${m}" ${mSel === m ? 'selected' : ''}>cierre ${D.fmt(E.fechaCierre(tSel.id, m))}</option>`).join('')}</select></div>
    <div id="res-detalle">${renderResumenDetalle(tSel.id, mSel)}</div>
  </div>`;
  return html;
}

function renderResumenDetalle(tarjetaId, ym) {
  const r = E.resumen(tarjetaId, ym);
  if (!r.pieces.length) return empty({ kind: 'periodo', icon: 'cal', head: 'Sin consumos en este resumen', sub: 'Los que hagas antes del cierre aparecen ac\u00e1.' });
  const rows = r.pieces.slice().sort((a, b) => a.m.fecha.localeCompare(b.m.fecha));
  const cuotas = sum(rows.filter(p => p.idx > 1).map(p => p.montoARS));
  const sinCuotas = d => String(d || '').replace(/,\s*\d+\s*cuotas?\)/i, ')').replace(/\s*\(\s*\d+\s*cuotas?\s*\)\s*$/i, '');
  return `<div class="tp-sum">vence ${D.fmt(r.fecha)} \u00b7 ${rows.length} \u00edtems \u00b7 cuotas anteriores ${M.f(cuotas)}</div>
    <div class="mlist">${rows.map(p => `<div class="mv"><div style="min-width:0"><div class="m1"><b>${esc(sinCuotas(p.m.desc))}</b></div><div class="m2">${['compra ' + D.fmt(p.m.fecha), p.n > 1 ? `cuota ${p.idx}/${p.n}` : '', p.m.recId ? 'fijo' : ''].filter(Boolean).join(' \u00b7 ')}</div></div><div class="mm">${M.f(p.montoARS)}</div></div>`).join('')}</div>`;
}

/* ---------- PLAN: presupuesto e inversión ---------- */
function viewPlan() {
  const ym = ui.mes; const ing = E.ingreso(ym), c = E.consumo(ym), inv = E.invertido(ym); const mg = E.margen(ym);
  const meta = mg.ahorro;
  const libre = ing.total - c.total;
  const steps = [
    { l: 'Ingreso', v: ing.total, color: 'var(--c2)', kind: 'in' },
    { l: 'Fijos', v: -mg.fijos, color: 'var(--c3)' },
    { l: 'Cuotas del mes', v: -c.cuotas, color: 'var(--c5)' },
    { l: 'Compras', v: -c.compras, color: 'var(--c7)' },
    { l: 'Libre', v: libre, color: 'var(--accent)', kind: 'total' },
  ];
  const maxV = Math.max(ing.total, c.total, 1);
  let acc = 0;
  const wf = steps.map(s => { let left, width; if (s.kind === 'in' || s.kind === 'total') { left = 0; width = Math.max(0, s.v) / maxV * 100; } else { const start = acc + s.v; left = Math.max(0, start) / maxV * 100; width = Math.abs(s.v) / maxV * 100; } if (s.kind !== 'total') acc += s.v; return `<div class="wf ${s.kind === 'total' ? 'total' : ''}"><span>${s.l}</span><div class="bar"><i style="left:${left}%;width:${width}%;background:${s.color}"></i></div><span class="n">${s.v < 0 ? '−' : ''}${M.f(Math.abs(s.v))}</span></div>`; }).join('');

  const hz12 = D.range(D.addMonths(D.thisMonth(), -11), 12).map(m => { const cc = E.consumo(m); const ii = E.ingreso(m).total; return { ym: m, gasto: cc.total, inv: E.invertido(m), ingreso: ii, tasa: ii ? E.invertido(m) / ii : null }; });
  const tasa3 = hz12.slice(-3).filter(h => h.ingreso); const tasaProm = tasa3.length ? sum(tasa3.map(h => h.tasa)) / tasa3.length : 0;
  let html = `<div class="grid g-kpi">
    ${kpi({ label: `Libre en ${D.monthName(ym).split(' ')[0]}`, value: M.f(libre), sub: `<span>Ingreso ${M.f(ing.total)} − gastos ${M.f(c.total)}</span>`, cls: 'accent' })}
    ${kpi({ label: 'Para invertir / ahorrar', value: M.f(meta), sub: `<span>sueldo − presupuesto de ${M.c(mg.presupuesto)}</span>` })}
    ${kpi({ label: 'Invertido este mes', value: M.f(inv), sub: ing.total ? `<span class="pill ${inv >= meta && meta ? 'good' : inv > 0 ? 'warn' : 'neutral'}">${M.pct(inv / ing.total)} del sueldo</span>` : '' })}
    ${kpi({ label: 'Tasa de inversión (3 meses)', value: M.pct(tasaProm), sub: `<span>promedio invertido / ingreso</span>` })}
  </div>`;
  html += `<div class="grid g-2 section">
    <div class="card"><div class="card-head"><h2>Cascada del mes</h2><span class="hint">Del sueldo salen los fijos, después las cuotas y las compras; lo que queda es libre</span></div><div class="waterfall">${wf}</div>
      <div class="divider"></div>
      <div class="row between"><div><div class="small muted">${ym < D.thisMonth() ? 'Quedó para invertir' : 'Podés invertir'}</div><div style="font-family:var(--font-display);font-size:22px;font-weight:900;letter-spacing:-.03em;font-variant-numeric:tabular-nums">${M.f(Math.max(0, libre))}</div><div class="small muted">objetivo ${M.f(meta)}${libre > meta ? ` · sobran ${M.f(libre - meta)} del presupuesto` : libre < meta ? ` · faltan ${M.f(meta - libre)}` : ''}</div></div><button class="btn primary sm" data-act="new-inv">${ICONS.invest} Registrar inversión</button></div>
    </div>
    <div class="card"><div class="card-head"><h2>Ingreso, gasto e inversión</h2><span class="hint">Últimos 12 meses</span></div>
      ${ChartQ.reg(w => Charts.stacked({ w, h: 230, labels: hz12.map(h => D.monthName(h.ym, true)), series: [{ name: 'Gastos del mes', color: 'var(--c1)', values: hz12.map(h => h.gasto) }, { name: 'Invertido', color: 'var(--c4)', values: hz12.map(h => h.inv) }], line: { name: 'Ingreso', color: 'var(--ink-2)', values: hz12.map(h => h.ingreso || null) } }), 230)}
      ${Charts.legend([{ name: 'Gasto', color: 'var(--c1)' }, { name: 'Invertido', color: 'var(--c4)' }, { name: 'Ingreso', color: 'var(--ink-2)', kind: 'dash' }])}
    </div>
  </div>`;
  // sueldo: historial de cobros (lo que la app pregunta cada día de cobro)
  const suTodos = D.range(D.addMonths(ym, -5), 6).map(m => ({ ym: m, s: E.sueldo(m) })); const suPrimero = Object.keys(state.sueldos || {}).sort()[0];
  const suMeses = suTodos.filter(h => h.s.registrado || h.ym >= (suPrimero && suPrimero < ym ? suPrimero : ym));
  const suRow = (h, i) => { const ant = i ? suMeses[i - 1].s.monto : null; const d = ant && h.s.registrado ? h.s.monto / ant - 1 : null; return `<div class="list-item" data-act="sueldo-edit" data-id="${h.ym}" style="cursor:pointer"><div><b style="font-weight:500">${D.monthName(h.ym, true)}</b><span class="sub small muted">${h.s.registrado ? `cobrado el ${D.fmt(h.s.fecha)}` : 'estimado'}</span></div><div class="row" style="gap:8px;flex-wrap:nowrap">${d != null && Math.abs(d) >= 0.001 ? `<span class="pill ${d > 0 ? 'good' : 'warn'}">${d > 0 ? '+' : ''}${M.pct(d, 1)}</span>` : ''}<span class="mono ${h.s.registrado ? '' : 'muted'}">${M.f(h.s.monto)}</span></div></div>`; };
  const pendCobro = E.cobroPendiente();
  html += `<div class="card section"><div class="card-head"><h2>Sueldo</h2><div class="row" style="gap:8px"><span class="hint">cobrás el ${Number(state.settings.diaCobro) >= 28 ? 'último día del mes' : 'día ' + (Number(state.settings.diaCobro) || 1)}</span><button class="btn sm ${pendCobro.length ? 'primary' : ''}" data-act="cobro-cargar" data-id="${pendCobro.length ? pendCobro[pendCobro.length - 1] : ym}">${ICONS.plus} Cobro</button></div></div>
    ${suMeses.map(suRow).join('')}
  </div>`;
  // presupuestos
  const cats = state.categorias.slice().sort((a, b) => (c.byCat[b.id] || 0) - (c.byCat[a.id] || 0));
  html += `<div class="grid g-2 section">
    <div class="card"><div class="card-head"><h2>Presupuesto por categoría</h2><span class="hint">Dejá en blanco las que no querés limitar</span></div>
      <div class="table-wrap"><table><thead><tr><th>Categoría</th><th class="r">Este mes</th><th class="r">Prom. 3m</th><th class="r">Presupuesto</th></tr></thead><tbody>
      ${cats.map(cat => { const v = c.byCat[cat.id] || 0; const avg = E.promedioCat(cat.id, ym, 3); const r = cat.presupuesto ? v / cat.presupuesto : 0; return `<tr><td><span class="row nowrap" style="gap:6px;flex-wrap:nowrap"><i class="swatch" style="background:${L.catColor(cat.id)}"></i>${esc(cat.nombre)}</span>${cat.presupuesto ? `<div class="meter ${r > 1 ? 'crit' : r > .8 ? 'warn' : ''}" style="height:4px;margin-top:4px;max-width:160px"><i style="width:${clamp(r * 100, 0, 100)}%"></i></div>` : ''}</td><td class="amount r">${v ? M.f(v) : '<span class="muted">—</span>'}</td><td class="amount r muted">${avg ? M.f(avg) : '—'}</td><td class="r"><input class="input sm mono" style="width:120px;text-align:right" inputmode="numeric" data-budget="${cat.id}" value="${cat.presupuesto ? fmtARS.format(cat.presupuesto) : ''}" placeholder="—"></td></tr>`; }).join('')}
      </tbody></table></div>
      <p class="small muted" style="margin-top:8px">Total presupuestado: <b class="mono">${M.f(sum(state.categorias.map(c => Number(c.presupuesto) || 0)))}</b> · fijos estimados: <b class="mono">${M.f(E.fijosEstimados(ym))}</b></p>
    </div>
    <div class="card"><div class="card-head"><h2>Portfolio · inversiones</h2><span class="hint">todo lo registrado</span></div>
      ${(() => { const list = state.inversiones.slice().sort((a, b) => M.toARS(b.monto, b.moneda) - M.toARS(a.monto, a.moneda)); if (!list.length) return empty({ kind: 'setup', icon: 'chart', head: 'Todavía no registrás aportes', sub: 'Cargá lo que ponés en Balanz, BTC o plazo fijo y Gastos calcula tu tasa de ahorro real.', btn: 'Registrar aporte', action: 'new-inv' }); const tot = sum(list.map(i => M.toARS(i.monto, i.moneda))); return list.map(i => `<div class="list-item"><div><b style="font-weight:500">${esc(i.destino || i.desc || 'Inversión')}</b><span class="sub small muted">${esc(i.desc && i.destino ? i.desc : D.fmt(i.fecha))}</span></div><div class="row" style="gap:4px"><span class="mono">${i.moneda === 'USD' ? 'US$ ' + (Number(i.monto) || 0).toLocaleString('es-AR', { maximumFractionDigits: 0 }) : M.f(i.monto)}</span><button class="mini-btn" data-act="del-inv" data-id="${i.id}">${ICONS.trash}</button></div></div>`).join('') + `<div class="list-item" style="border-top:1px solid var(--line)"><b>Total invertido</b><b class="mono">${M.f(tot)}</b></div>`; })()}
      <div class="divider"></div>
      <div class="card-head"><h3>Ingresos extra</h3><button class="btn sm" data-act="new-ing">${ICONS.plus} Ingreso</button></div>
      ${(() => { const list = state.ingresos.filter(i => D.ym(i.fecha) === ym); return list.length ? list.map(i => `<div class="list-item"><div><b style="font-weight:500">${esc(i.desc || 'Ingreso')}</b><span class="sub small muted">${D.fmt(i.fecha)}</span></div><div class="row" style="gap:4px"><span class="mono">${M.f(M.toARS(i.monto, i.moneda))}</span><button class="mini-btn" data-act="del-ing" data-id="${i.id}">${ICONS.trash}</button></div></div>`).join('') : `<p class="small muted">Sueldo base: <b class="mono">${M.f(ing.base)}</b>. Aguinaldo, freelance o ventas van acá.</p>`; })()}
    </div>
  </div>`;
  return html;
}

/* ---------- TENDENCIAS ---------- */
function viewTendencias() {
  const n = ui.trendRange || 6; const ym = ui.mes;
  const months = D.range(D.addMonths(ym, -(n - 1)), n);
  const cons = months.map(m => E.consumo(m));
  const labels = months.map(m => D.monthName(m, true));
  const gruposUsados = GRUPOS.filter(g => cons.some(c => c.byGrupo[g.id]));
  let html = `<div class="row between" style="margin-bottom:14px"><div class="seg">${[3, 6, 12].map(k => `<button class="${n === k ? 'on' : ''}" data-range="${k}">${k} meses</button>`).join('')}</div><span class="small muted">Hasta ${D.monthName(ym)}</span></div>`;
  html += `<div class="card"><div class="card-head"><h2>Evolución por grupo</h2><span class="hint">Consumo por fecha de compra</span></div>
    ${ChartQ.reg(w => Charts.stacked({ w, h: 260, labels, highlight: n - 1, series: gruposUsados.map(g => ({ name: g.nombre, color: L.slotColor(g.slot), values: cons.map(c => c.byGrupo[g.id] || 0) })), line: state.settings.ingreso ? { name: 'Ingreso', color: 'var(--ink-2)', values: months.map(m => E.ingreso(m).total) } : null }), 260)}
    ${Charts.legend(gruposUsados.map(g => ({ name: g.nombre, color: L.slotColor(g.slot) })))}
  </div>`;
  // necesidad + medio
  const necSeries = [1, 2, 3].map(k => ({ name: NECESIDAD[k], color: k === 1 ? 'var(--c1)' : k === 2 ? 'var(--c4)' : 'var(--c7)', values: cons.map(c => c.byNec[k]) }));
  const innecPct = cons.map(c => c.total ? c.byNec[3] / c.total : null);
  html += `<div class="grid g-2 section">
    <div class="card"><div class="card-head"><h2>Necesario vs innecesario</h2><span class="hint">Según cómo lo marcaste</span></div>
      ${ChartQ.reg(w => Charts.stacked({ w, h: 220, labels, series: necSeries }), 220)}${Charts.legend(necSeries.map(s => ({ name: s.name, color: s.color })))}
      <div class="row between small" style="margin-top:8px"><span class="muted">Innecesario, % del total:</span><span class="mono">${innecPct.map((p, i) => `${labels[i].split(' ')[0]} ${p == null ? '—' : M.pct(p)}`).join(' · ')}</span></div>
    </div>
    <div class="card"><div class="card-head"><h2>Total, compras, fijos y cuotas</h2></div>
      ${ChartQ.reg(w => Charts.line({ w, h: 220, labels, series: [{ name: 'Total', color: 'var(--accent)', values: cons.map(c => c.total || null), strong: true, area: true }, { name: 'Compras', color: 'var(--c2)', values: cons.map(c => c.count ? c.compras : null) }, { name: 'Fijos', color: 'var(--c4)', values: cons.map(c => c.count ? c.fijo : null) }, { name: 'Cuotas', color: 'var(--c6)', values: cons.map(c => c.count ? c.cuotas : null) }], refY: state.settings.ingreso || null, refLabel: 'Ingreso' }), 220)}
      ${Charts.legend([{ name: 'Total', color: 'var(--accent)', kind: 'line' }, { name: 'Compras', color: 'var(--c2)', kind: 'line' }, { name: 'Fijos', color: 'var(--c4)', kind: 'line' }, { name: 'Cuotas', color: 'var(--c6)', kind: 'line' }])}
    </div>
  </div>`;
  // tabla categorías mes vs anterior vs prom
  const cur = cons[n - 1], prev = cons[n - 2] || { byCat: {} };
  const catRows = state.categorias.map(cat => ({ cat, v: cur.byCat[cat.id] || 0, p: prev.byCat[cat.id] || 0, avg: E.promedioCat(cat.id, ym, 3) })).filter(r => r.v || r.p || r.avg).sort((a, b) => b.v - a.v);
  // top comercios
  const all = cons.flatMap(c => c.movs).filter(m => !m.recId);
  const byDesc = {}; for (const m of all) { if (m.cuotaRow) continue; const k = norm(m.desc); if (!byDesc[k]) byDesc[k] = { desc: m.desc, n: 0, total: 0, cat: m.catId }; byDesc[k].n++; byDesc[k].total += M.toARS(m.monto, m.moneda); }
  const top = Object.values(byDesc).sort((a, b) => b.total - a.total).slice(0, 10);
  html += `<div class="grid g-2 section">
    <div class="card"><div class="card-head"><h2>Categorías: mes a mes</h2></div>
      <div class="table-wrap"><table><thead><tr><th>Categoría</th><th class="r">${labels[n - 1]}</th><th class="r">${labels[n - 2] || 'Ant.'}</th><th class="r">Prom. 3m</th><th class="r">Dif. vs prom.</th></tr></thead><tbody>
      ${catRows.map(r => { const d = r.avg ? (r.v - r.avg) / r.avg : null; return `<tr><td><span class="row nowrap" style="gap:6px;flex-wrap:nowrap"><i class="swatch" style="background:${L.catColor(r.cat.id)}"></i>${esc(r.cat.nombre)}</span></td><td class="amount r">${M.f(r.v)}</td><td class="amount r muted">${M.f(r.p)}</td><td class="amount r muted">${M.f(r.avg)}</td><td class="r">${d == null ? '—' : `<span class="pill ${d > 0.25 ? 'crit' : d > 0.1 ? 'warn' : d < -0.1 ? 'good' : 'neutral'}">${d > 0 ? '+' : ''}${M.pct(d)}</span>`}</td></tr>`; }).join('')}
      </tbody></table></div></div>
    <div class="card"><div class="card-head"><h2>Dónde gastás más</h2><span class="hint">Top comercios, ${n} meses, sin fijos (compras a valor total)</span></div>
      <div class="table-wrap"><table><thead><tr><th>Comercio</th><th class="r">Veces</th><th class="r">Total</th><th class="r">Promedio</th></tr></thead><tbody>
      ${top.map(t => `<tr><td><b style="font-weight:500">${esc(t.desc)}</b><span class="sub">${L.cat(t.cat).nombre}</span></td><td class="mono r">${t.n}</td><td class="amount r">${M.f(t.total)}</td><td class="amount r muted">${M.f(t.total / t.n)}</td></tr>`).join('') || `<tr><td colspan="4" style="padding:0">${empty({ kind: 'periodo bare-top', icon: 'chart', head: 'Todavía no hay suficiente historia', sub: 'Con dos meses cargados ya vas a ver tendencias.' })}</td></tr>`}
      </tbody></table></div></div>
  </div>`;
  // heat + weekday
  const wd = [0, 0, 0, 0, 0, 0, 0], wn = [0, 0, 0, 0, 0, 0, 0];
  for (const m of all) { if (m.cuotaRow) continue; const d = (D.dow(m.fecha) + 6) % 7; wd[d] += E.rowAmount(m); wn[d]++; }
  const wdMax = Math.max(...wd, 1);
  const medios = Object.entries(cur.byMedio).map(([k, v]) => ({ name: k === 'tarjeta' ? 'Tarjeta' : MEDIOS[k] || k, value: v })).sort((a, b) => b.value - a.value);
  html += `<div class="grid g-3 section">
    <div class="card"><div class="card-head"><h2>Calendario</h2><span class="hint">${D.monthName(ym)}</span></div>${Charts.heat(ym, cur.byDay)}</div>
    <div class="card"><div class="card-head"><h2>Por día de la semana</h2><span class="hint">Total en ${n} meses</span></div>
      ${['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'].map((d, i) => `<div class="meter-row"><div class="l"><span>${d}</span></div><div class="v"><b class="mono">${M.f(wd[i])}</b> <span class="muted">· ${wn[i]}</span></div><div class="meter"><i style="width:${wd[i] / wdMax * 100}%;background:var(--c4)"></i></div></div>`).join('')}
    </div>
    <div class="card"><div class="card-head"><h2>Medio de pago</h2><span class="hint">${D.monthName(ym, true)}</span></div>
      ${medios.length ? medios.map((m, i) => `<div class="meter-row"><div class="l"><span>${esc(m.name)}</span></div><div class="v"><b class="mono">${M.f(m.value)}</b> <span class="muted">${M.pct(m.value / cur.total)}</span></div><div class="meter"><i style="width:${m.value / cur.total * 100}%;background:var(--c4)"></i></div></div>`).join('') : empty({ kind: 'periodo', icon: 'chart', head: 'Todavía no hay suficiente historia', sub: 'Con dos meses cargados ya vas a ver tendencias.' })}
      ${state.tarjetas.length > 1 ? `<div class="divider"></div>${state.tarjetas.map(t => { const v = sum(cur.movs.filter(m => m.tarjetaId === t.id).map(m => M.toARS(m.monto, m.moneda))); return `<div class="row between small"><span>${esc(t.nombre)}</span><b class="mono">${M.f(v)}</b></div>`; }).join('')}` : ''}
    </div>
  </div>`;
  return html;
}

/* ---------- CONFIG ---------- */
function viewConfig() {
  const s = state.settings;
  const inp = (id, label, val, extra = '', help = '') => `<div class="field"><label>${label}</label><input class="input" data-setting="${id}" value="${esc(val ?? '')}" ${extra}>${help ? `<span class="help">${help}</span>` : ''}</div>`;
  let html = `<div class="grid g-2">
    <div class="card"><div class="card-head"><h2>Perfil</h2></div><div class="form-grid">
      ${inp('nombre', 'Nombre', s.nombre, 'placeholder="Tu nombre"')}
      ${inp('ingreso', 'Sueldo neto mensual (ARS)', s.ingreso ? fmtARS.format(s.ingreso) : '', 'inputmode="numeric"')}
      ${inp('diaCobro', 'Día de cobro', s.diaCobro, 'inputmode="numeric"', '31 = último día del mes. Ese día la app te pregunta cuánto cobraste y recalcula todo.')}
      ${inp('ccl', 'Dólar CCL (ARS por USD)', s.ccl || '', 'inputmode="numeric"', 'Para valuar los CEDEARs en pesos. Se actualiza junto con el MEP.')}
      ${inp('finnhubKey', 'Clave de Finnhub (precios de acciones)', s.finnhubKey || '', 'placeholder="pegá tu API key" autocomplete="off"', 'Gratis en finnhub.io, botón Get free API key. Con esto la Cartera trae los precios al abrir la app. <a href="#" data-act="precios-update">Actualizar precios ahora</a>')}
      ${inp('tc', 'Dólar MEP (ARS por USD)', s.tc, 'inputmode="numeric"', `${s.tcFecha ? `Actualizado ${D.fmt(s.tcFecha, { year: true })}${s.tcFuente ? ' · ' + esc(s.tcFuente) : ''}. ` : ''}Se usa para la vista en USD y para gastos en dólares. <a href="#" data-act="tc-update">Actualizar desde dolarapi.com</a>`)}
      ${inp('presupuesto', 'Presupuesto mensual de gasto (ARS)', s.presupuesto ? fmtARS.format(s.presupuesto) : '', 'inputmode="numeric"', `Lo que decidís gastar por mes (fijos + cuotas + compras). El resto del sueldo${s.ingreso && s.presupuesto ? ` (${M.f(s.ingreso - s.presupuesto)})` : ''} es para invertir.`)}
      ${inp('alertaCuotasPct', 'Alerta de cuotas (% del presupuesto)', s.alertaCuotasPct, 'inputmode="numeric"', 'Te aviso cuando fijos + cuotas superan esto')}
    </div></div>
    <div class="card"><div class="card-head"><h2>Tarjetas</h2><button class="btn sm" data-act="new-card">${ICONS.plus} Tarjeta</button></div>
      ${state.tarjetas.length ? state.tarjetas.map((t, i) => `<div class="list-item"><div class="row" style="gap:10px"><i class="swatch" style="width:28px;height:18px;border-radius:4px;background:${cardDot(t.color) || CARD_COLORS[i % CARD_COLORS.length]}"></i><div><b style="font-weight:500">${esc(t.nombre)}</b> <span class="muted small">${esc(t.banco || '')}</span><span class="sub small muted">Cierra el ${t.cierre} · vence el ${t.vencimiento}${t.limite ? ` · límite ${M.c(t.limite)}` : ''}</span></div></div><div class="row" style="gap:2px"><button class="mini-btn" data-act="edit-card" data-id="${t.id}">${ICONS.edit}</button><button class="mini-btn" data-act="del-card" data-id="${t.id}">${ICONS.trash}</button></div></div>`).join('') : emptyInline('Ninguna tarjeta cargada', 'Agregar', 'new-card')}
      <div class="divider"></div>
      <div class="card-head"><h3>Cuentas</h3><button class="btn sm" data-act="new-cuenta">${ICONS.plus} Cuenta</button></div>
      ${state.cuentas.length ? state.cuentas.map(c => `<div class="list-item"><div><b style="font-weight:500">${esc(c.nombre)}</b><span class="sub small muted">${esc(c.tipo || '')} · ${c.moneda}${c.esSueldo ? ' · cobro el sueldo acá' : ''}</span></div><div class="row" style="gap:2px"><span class="mono">${M.f(M.toARS(Number(c.saldo) || 0, c.moneda))}</span><button class="mini-btn" data-act="edit-cuenta" data-id="${c.id}">${ICONS.edit}</button><button class="mini-btn" data-act="del-cuenta" data-id="${c.id}">${ICONS.trash}</button></div></div>`).join('') : emptyInline('Ninguna cuenta cargada', 'Agregar', 'new-cuenta')}
    </div>
  </div>`;
  html += `<div class="grid g-2 section">
    <div class="card"><div class="card-head"><h2>Categorías</h2><button class="btn sm" data-act="new-cat">${ICONS.plus} Categoría</button></div>
      <div class="table-wrap"><table><thead><tr><th>Nombre</th><th>Grupo</th><th>Tipo</th><th></th></tr></thead><tbody>${state.categorias.map(c => { const used = state.movimientos.some(m => m.catId === c.id) || state.recurrentes.some(r => r.catId === c.id); return `<tr><td><span class="row nowrap" style="gap:6px;flex-wrap:nowrap"><i class="swatch" style="background:${L.catColor(c.id)}"></i>${esc(c.nombre)}</span></td><td class="small">${esc(L.grupo(c.grupo).nombre)}</td><td class="small">${c.tipo}</td><td class="r" style="white-space:nowrap"><button class="mini-btn" data-act="edit-cat" data-id="${c.id}">${ICONS.edit}</button>${!used && c.id !== 'otros' ? `<button class="mini-btn" data-act="del-cat" data-id="${c.id}">${ICONS.trash}</button>` : ''}</td></tr>`; }).join('')}</tbody></table></div>
    </div>
    <div class="card"><div class="card-head"><h2>Datos</h2></div>
      <div class="stack">
        ${(() => { const g = Gist.cfg(); return g

 *  Nueve bloques en tres filas (alto de cada fila = peso de la fila, ancho de cada bloque = su peso)

 *  verde y rojo compite con el semáforo del resto de la app. */
/** Mapa de bloques proporcionales: el area es el dato, asi que no hace falta leyenda.
 *  Hasta nueve bloques en tres filas (alto de la fila = peso de la fila, ancho del bloque = su peso)
 *  y una franja para el resto. Sirve igual para posiciones de cartera que para grupos de gasto:
 *  el color es solo jerarquia, que es lo unico que una rampa secuencial sabe hacer.
 *  items: [{ label, peso (0..1), der, act, id }] — `der` es la cifra chica de la derecha.
 *  otras: { n, peso } o null. */
function mapaBloques(items, otras = null, todas = false) {
  const top = todas ? items.slice() : items.slice(0, 9); if (!top.length) return '';
  const TK = [17, 15, 13], NM = [12, 11, 10], PD = [10, 9, 8];
  // flex-grow reparte el espacio libre solo hasta donde suman los factores: con pesos de 0 a 1
  // la suma queda por debajo de 1 y los bloques no llegan a llenar la fila. Se escalan.
  const G = 1000, grow = x => Math.max(x * G, 0.01);
  // con pocos items no tiene sentido forzar tres filas: quedan tiras de 20 px ilegibles
  const porFila = 3, nFilas = top.length <= 3 ? 1 : top.length <= 6 ? 2 : Math.ceil(top.length / porFila);
  const filas = Array.from({ length: nFilas }, (_, r) => top.slice(r * porFila, (r + 1) * porFila)).filter(f => f.length).map((fila, r) => {
    const bs = fila.map(it => {
      const i = top.indexOf(it);
      // rampa de cian por opacidad: por debajo de alfa 0,62 el texto oscuro ya no se lee
      const attrs = it.act ? ` data-act="${it.act}" data-id="${esc(it.id)}" style="cursor:pointer;` : ' style="';
      return `<div class="cmap-b"${attrs}flex-grow:${grow(it.peso)};background:var(--c${Math.min(i, 8) + 1});color:${i < 3 ? 'var(--on-fill)' : '#FFFFFF'};padding:${PD[Math.min(r, 2)]}px">
        <b style="font-size:${TK[Math.min(r, 2)]}px">${esc(it.label)}</b>
        <span class="n" style="font-size:${NM[Math.min(r, 2)]}px"><i>${M.pct(it.peso, 1)}</i><em>${it.der || ''}</em></span>
      </div>`;
    }).join('');
    return `<div class="cmap-row" style="flex-grow:${grow(sum(fila.map(x => x.peso)))}">${bs}</div>`;
  }).join('');
  // la franja del resto se toca: abre el mapa con todas las posiciones (y vuelve)
  const franja = otras && otras.n ? `<div class="cmap-otras"${otras.act ? ` data-act="${otras.act}" role="button" style="cursor:pointer"` : ''}><span>${esc(otras.label)}</span><span>${otras.der != null ? otras.der : M.pct(otras.peso, 1)}</span></div>` : '';
  // con todas, el alto crece con las filas: 210 px para tres, ~52 por fila de ahi en mas
  return `<div class="cmap"${nFilas > 3 ? ` style="height:${Math.max(210, nFilas * 52)}px"` : ''}>${filas}${franja}</div>`;
}

function mapaCartera(k) {
  const top = k.posiciones.slice(0, 9); if (!top.length) return '';
  const resto = k.posiciones.slice(9);
  // sin color a proposito: si el mapa se pinta de verde y rojo compite con el semaforo del resto
  const dpTxt = p => p.dp == null ? '\u00B1x,xx %' : `${p.dp > 0 ? '+' : ''}${MENOS(p.dp.toLocaleString('es-AR', { maximumFractionDigits: 2 }))} %`;
  // el resto no entra al mapa: con pesos de 1-4 % el area deja de leerse (una sola en la ultima fila
  // quedaba mas grande que MELI). Se abre debajo como lista, con la barra relativa a la mayor del resto.
  const todas = !!ui.cmapTodas && resto.length > 0;
  const pesoResto = sum(resto.map(p => p.peso));
  const franja = resto.length ? { n: resto.length, peso: pesoResto, label: todas ? `Otras ${resto.length} \u00b7 ocultar` : `Otras ${resto.length} ${resto.length === 1 ? 'posici\u00f3n' : 'posiciones'} \u00b7 ver`, act: 'cmap-todas' } : null;
  const mx = Math.max(...resto.map(p => p.peso || 0), 0.0001);
  const lista = todas ? `<div class="cmap-lista">${resto.map(p => `<div class="cl-r" data-act="pos" data-id="${esc(p.ticker)}"><b>${esc(p.ticker)}</b><span class="cl-bar"><i style="width:${Math.max(2, Math.round((p.peso || 0) / mx * 100))}%"></i></span><span class="cl-p">${M.pct(p.peso, 1)}</span><span class="cl-d">${dpTxt(p)}</span></div>`).join('')}</div>` : '';
  return mapaBloques(top.map(p => ({ label: p.ticker, peso: p.peso, der: dpTxt(p), act: 'pos', id: p.ticker })), franja) + lista;
}

function renderEvolucion(k, seg) {
  const modo = ui.carteraVentana && k.ventanas[ui.carteraVentana] ? ui.carteraVentana : (k.ventanas.anio.disponible ? 'anio' : 'inicio');
  const v = k.ventanas[modo];
  const rangos = `<div class="seg rangos">${E.VENTANAS.map(([m, l]) => `<button class="${m === modo ? 'on' : ''} ${k.ventanas[m].disponible ? '' : 'off'}" data-act="cartera-ventana" data-id="${m}">${l}</button>`).join('')}</div>`;
  if (!v || !v.disponible) return `<div class="card"><div class="card-head"><h2>vs S&P 500</h2>${seg}</div>${rangos}${empty({ kind: 'periodo', icon: 'cal', head: v && v.motivo || 'Sin datos para esta ventana', sub: 'Probá con un período más largo.' })}</div>`;
  const r = v.rend; const alfaOk = r.alfa != null && r.alfa >= 0;
  const serie = E.carteraSerie(k, modo);
  let chart = '';
  if (serie && serie.fechas.length > 2) {
    // en ventanas cortas (≤ 45 días) el eje va por día en vez de por mes: 1 M con un solo "sep" no dice nada
    const diaLabels = (w) => { const cada = w < 520 ? 7 : 5; return serie.fechas.map((f, i) => (i % cada === 0 && i < serie.fechas.length - 2) ? String(Number(f.slice(8, 10))) : ''); };
    const corta = serie.fechas.length && D.daysBetween(serie.fechas[0], serie.fechas[serie.fechas.length - 1]) <= 45;
    const mesLabels = (w) => { if (corta) return diaLabels(w); const meses = serie.fechas.length > 260 ? 3 : (w < 520 ? 2 : 1); let n = -1; return serie.fechas.map((f, i) => { const ym = D.ym(f); const prev = i ? D.ym(serie.fechas[i - 1]) : null; if (i === 0 || ym === prev || i > serie.fechas.length - 4) return ''; n++; return n % meses === 0 ? (serie.fechas.length > 260 ? D.monthName(ym, true) : D.monthName(ym, true).split(' ')[0]) : ''; }); };
    const yFmt = x => MENOS(Math.abs(x) >= 1000 ? (x / 1000).toLocaleString('es-AR', { maximumFractionDigits: 1 }) + ' k' : Math.round(x).toString());
    chart = ChartQ.reg(w => Charts.line({ w, labels: mesLabels(w), h: 220, yFmt, xSparse: true, tipFmt: x => fmtU(x, 0), tipTitle: i => D.fmt(serie.fechas[i], { year: true }), series: [
      { name: 'Invertido (neto)', color: 'var(--ink-3)', values: serie.invertido, dashed: true },
      { name: 'Sombra S&P 500', color: 'var(--c4)', values: serie.sombra },
      { name: 'Tu cartera', color: 'var(--accent)', values: serie.real, strong: true },
      { name: 'Tu cartera', color: 'var(--accent)', values: serie.sueltos, dots: true },
    ] }), 220) + Charts.legend([{ name: 'Tu cartera', color: 'var(--accent)', kind: 'line' }, { name: 'Sombra S&P 500', color: 'var(--c4)', kind: 'line' }, { name: 'Invertido neto', color: 'var(--ink-3)', kind: 'dash' }])
      + (serie.haySueltos ? `<div class="i-row">${infoBtn(`${serie.desdeDiario ? `Tu cartera se registra d\u00eda a d\u00eda desde el ${D.fmt(serie.desdeDiario)}` : 'Tu cartera se empieza a registrar d\u00eda a d\u00eda desde hoy'}; antes solo hay puntos sueltos (el arranque y las fotos guardadas). Los n\u00fameros de arriba s\u00ed cuentan todo el per\u00edodo: salen de tus operaciones.`)}</div>` : '');
  }
  // alfa por posición (mismas compras hechas en SPY): quién suma y quién resta
  const conAlfa = [...k.posiciones, ...k.cerradas].filter(p => p.alfaUSD != null).sort((a, b) => b.alfaUSD - a.alfaUSD);
  const top = conAlfa.slice(0, 4), bottom = conAlfa.slice(-4).reverse().filter(p => !top.includes(p));
  const alfaRow = p => `<div class="alfa-row"><span>${esc(p.ticker)}${p.acciones <= 0 ? ' <small class="muted">cerrada</small>' : ''}</span><i><b style="width:${Math.min(100, Math.abs(p.alfaUSD) / Math.max(1, Math.abs(conAlfa[0].alfaUSD), Math.abs(conAlfa[conAlfa.length - 1].alfaUSD)) * 100).toFixed(0)}%;background:${p.alfaUSD >= 0 ? 'var(--good)' : 'var(--crit)'}"></b></i><b class="mono ${p.alfaUSD >= 0 ? 'up' : 'down'}">${p.alfaUSD >= 0 ? '+' : '−'}${fmtU(Math.abs(p.alfaUSD), 0)}</b></div>`;
  const box = (l, v, cls, sub) => `<div class="box"><div class="l">${l}</div><div class="v ${cls}">${v}</div><div class="s">${sub}</div></div>`;
  return `<div class="card"><div class="card-head"><h2>vs S&P 500 <button class="info-btn" data-act="cartera-info" data-id="${modo}" aria-label="Cómo se calcula">${ICONS.info}</button></h2>${seg}</div>
    ${rangos}
    <div class="evo-kpi">
      ${box('Cartera', r.real != null ? pctS(r.real) : '—', r.real != null ? (r.real >= 0 ? 'up' : 'down') : '', k.valor != null ? fmtU(k.valor, 0) : 'sin precios')}
      ${box('Sombra S&P', pctS(r.sombra), r.sombra >= 0 ? 'up' : 'down', fmtU(v.sombraValor, 0))}
      ${box('Alfa', r.alfa != null ? `${r.alfa >= 0 ? '+' : '−'}${(Math.abs(r.alfa) * 100).toLocaleString('es-AR', { maximumFractionDigits: 1 })} pp` : '—', r.alfa != null ? (alfaOk ? 'up' : 'down') : '', r.alfaUSD != null ? `${r.alfaUSD >= 0 ? '+' : '−'}${fmtU(Math.abs(r.alfaUSD), 0)}` : '')}
    </div>
    ${chart}
    ${conAlfa.length ? `<div class="divider"></div><div class="card-head" style="margin-bottom:6px"><h3>Alfa por posición</h3><span class="hint">vs SPY, desde el inicio</span></div>${top.map(alfaRow).join('')}${bottom.length ? `<div class="divider" style="margin:6px 0"></div>${bottom.map(alfaRow).join('')}` : ''}` : ''}
  </div>`;
}

const Cobro = {
  key: 'flujo.cobroPospuesto',
  pospuestoHoy() { try { return localStorage.getItem(Cobro.key) === D.today(); } catch (e) { return false; } },
  posponer() { try { localStorage.setItem(Cobro.key, D.today()); } catch (e) {} },
  /** Resultado de registrar: toast con variación y lo que queda para invertir */
  avisar(ym, r) {
    const mes = D.monthName(ym).split(' ')[0]; const pres = E.presupuesto(ym);
    const delta = r.delta != null && Math.abs(r.delta) >= 0.001 ? ` (${r.delta > 0 ? '+' : ''}${MENOS((r.delta * 100).toLocaleString('es-AR', { maximumFractionDigits: 1 }))} % vs ${r.prevRegistrado ? D.monthName(D.addMonths(ym, -1)).split(' ')[0] : 'el anterior'})` : '';
    toast(`Sueldo de ${mes}: ${M.f(r.monto)}${delta}${pres ? ` · para invertir ${M.f(r.monto - pres)}` : ''}`, 5000);
  },
};
function formCobro(ym = D.thisMonth()) {
  const prevYm = D.addMonths(ym, -1); const prev = E.sueldo(prevYm); const act = E.sueldo(ym);

  </div>`;
  Modal.open({ title: act.registrado || E.fechaCobro(ym) > D.today() ? `Sueldo de ${mes}` : '¿Cuánto cobraste?', body, submit: 'Guardar', extra: act.registrado ? `<button type="button" class="btn danger" data-act="del-sueldo" data-id="${ym}">Borrar</button>` : '', onSubmit: () => {

/* ---------- cartera: operaciones, posiciones, alertas ---------- */
/* ---------- control de calidad de una operación: cada número se contrasta con una fuente independiente antes de guardar ---------- */
const Verif = {
  /** Lee el form de operación y arma la operación candidata (sin validar campos vacíos) */
  candidata(pre = {}) {
    const tipo = Modal.choice('o-tipo') || 'compra'; const ticker = formOpTicker(); const modo = tipo === 'dividendo' ? null : (Modal.choice('o-modo') || 'usd');
    const fRaw = Modal.val('o-fecha') || D.today(); const o = { id: pre.id || null, tipo, ticker, fecha: D.habil(fRaw), fechaRaw: fRaw, modo };
    if (tipo === 'dividendo') o.monto = M.parse(Modal.val('o-monto'));
    else if (modo === 'cedear') { const c = formOpCedear(ticker); o.c = c; o.cedears = M.parse(Modal.val('o-ced')); o.precioCedear = M.parse(Modal.val('o-pxars')); o.ccl = M.parse(Modal.val('o-ccl')); if (c && o.cedears && o.precioCedear && o.ccl) { o.acciones = Cedears.aAcciones(o.cedears, c); o.precio = Cedears.precioUSD(o.precioCedear, c, o.ccl); } }

  },
  /** Chequeos: [{nivel:'ok'|'info'|'warn'|'block', txt}] + trazabilidad de las fuentes usadas */
  evaluar(o, k) {

    const hoy = D.today(); const hoyH = D.habil(hoy); const s = state.settings; const pr = o.ticker ? state.cartera.precios[o.ticker] : null; const spy = state.cartera.precios.SPY;
    const min = t => t ? Math.round((Date.now() - t) / 60000) : null; const hace = m => m == null ? '' : m < 1 ? 'recién' : m < 60 ? `hace ${m} min` : m < 1440 ? `hace ${Math.round(m / 60)} h` : `hace ${Math.round(m / 1440)} d`;
    const traza = { en: new Date().toISOString() };
    if (o.fechaRaw > hoy) add('block', `Fecha futura (${D.fmt(o.fechaRaw, { year: true })}).`);
    else if (o.fecha !== o.fechaRaw) add('info', `${D.fmt(o.fechaRaw)} no es día hábil: se guarda el ${D.fmt(o.fecha, { year: true })}.`);
    if (o.tipo === 'dividendo') {
      const p = k.posiciones.find(x => x.ticker === o.ticker);
      if (!p) add('warn', `No tenés ${o.ticker || 'ese ticker'} en cartera: ¿dividendo de una posición cerrada?`);
      else if (o.monto && p.valor && o.monto > p.valor * 0.1) add('warn', `Dividendo de ${fmtU(o.monto)} = ${M.pct(o.monto / p.valor, 1)} de la posición: inusualmente alto, revisá que sea neto en USD.`);
      return { items, nivel: Verif.nivel(items), traza };
    }
    // ratio
    if (o.modo === 'cedear') {
      if (!o.c) add('block', 'Sin ratio: no puedo convertir CEDEARs a acciones.');
      else if (o.c.manual) { add('warn', `Ratio manual ${Cedears.ratioTxt(o.c)}: verificalo en Balanz o BYMA.`); traza.ratio = { txt: Cedears.ratioTxt(o.c), fuente: 'manual' }; }
      else { add('ok', `Ratio ${Cedears.ratioTxt(o.c)} · tabla BYMA ${D.fmt(Cedears.actualizado(), { year: true })}.`); traza.ratio = { txt: Cedears.ratioTxt(o.c), fuente: `BYMA ${Cedears.actualizado()}` }; }
    }
    // precio en USD vs NY (independiente de lo que tipeaste): el chequeo que atrapa errores de precio, cantidad, ratio o ticker
    if (o.precio) {
      const ny = pr && pr.c ? pr : null;
      if (!ny) add('warn', `Sin precio de ${o.ticker} en NY para contrastar (cargá la clave de Finnhub en Ajustes).`);
      else {
        const gap = o.precio / ny.c - 1; const ag = Math.abs(gap); const pasada = o.fecha < hoyH; const txt = `${fmtU(o.precio)} por acción vs ${fmtU(ny.c)} en NY ${pasada ? 'hoy' : hace(min(ny.t))} (${gap >= 0 ? '+' : ''}${(gap * 100).toFixed(1)} %)`;
        traza.ny = { precio: ny.c, hora: ny.t ? new Date(ny.t).toISOString() : null, gap: Math.round(gap * 10000) / 10000 };
        if (pasada) add(ag > 0.35 ? 'warn' : 'info', `${txt}${ag > 0.35 ? ': muy lejos del precio actual, revisá' : ' · fecha pasada, sin verificación exacta'}.`);
        else if (ag <= 0.03) add('ok', `Precio coherente con NY: ${txt}.`);
        else if (ag <= 0.12) add('warn', `Precio ${txt}: puede ser el premium del CEDEAR o un error de precio, cantidad o ratio.`);
        else add('block', `Precio ${txt}: casi seguro hay un error (precio, cantidad, ratio o ticker).`);
      }
    }

      const el = $('#o-ccl'); const fuente = el && el.dataset.fuente ? el.dataset.fuente : 'mercado'; const edad = s.cclHora ? min(new Date(s.cclHora).getTime()) : null;
      traza.ccl = { valor: o.ccl, fuente, mercado: s.ccl || null, hora: s.cclHora || null };
      if (o.c && pr && pr.c && o.precioCedear) traza.ccl.implicito = Math.round(o.precioCedear * o.c.ratio[0] / o.c.ratio[1] / pr.c);
      if (o.fecha < hoyH) add('info', `CCL $ ${fmtARS.format(o.ccl)} (${fuente === 'manual' ? 'manual' : fuente}) · fecha pasada: tiene que ser el CCL de ese día.`);
      else if (fuente === 'implicito') add('ok', `CCL implícito $ ${fmtARS.format(o.ccl)}: tu precio queda igual al de NY${s.ccl ? ` (mercado $ ${fmtARS.format(s.ccl)})` : ''}.`);
      else if (fuente === 'manual') add('warn', `CCL manual $ ${fmtARS.format(o.ccl)}${s.ccl ? ` · mercado $ ${fmtARS.format(s.ccl)} ${hace(edad)}` : ''}.`);
      else if (edad == null || edad > 30) add('warn', `CCL de mercado $ ${fmtARS.format(o.ccl)} ${edad == null ? 'sin hora' : hace(edad)}: refrescalo antes de guardar.`);
      else add('ok', `CCL de mercado $ ${fmtARS.format(o.ccl)} · dolarapi ${hace(edad)}.`);
    }
    // sombra S&P 500
    if (o.fecha === hoyH) {
      const fresco = spy && spy.c && spy.t && D.iso(new Date(spy.t)) === hoy && (!spy.pc || Math.abs(spy.c / spy.pc - 1) < 0.07);
      if (fresco) { const m = min(spy.t); add('ok', `Sombra: SPY ${m <= 20 ? 'en vivo' : 'del día'} ${fmtU(spy.c)} ${hace(m)}.`); traza.spy = { valor: spy.c, fuente: m <= 20 ? 'vivo' : 'dia', hora: new Date(spy.t).toISOString() }; }
      else { const cl = Spy.at(o.fecha); const fd = Spy.fechaDe(o.fecha); add('warn', `Sin SPY en vivo: la sombra usa el cierre ${fd ? `del ${D.fmt(fd)}` : ''} ${cl ? fmtU(cl) : 's/d'}.`); traza.spy = { valor: cl, fuente: 'cierre', fecha: fd }; }
    } else {
      const fd = Spy.fechaDe(o.fecha); const cl = Spy.at(o.fecha); traza.spy = { valor: cl, fuente: 'cierre', fecha: fd };
      if (!cl) add('warn', 'Sin cierre de SPY para esa fecha: la sombra no puede replicar la operación.');
      else if (fd !== o.fecha) add('warn', `Sin cierre de SPY del ${D.fmt(o.fecha)}: la sombra usa el del ${D.fmt(fd)} (${fmtU(cl)}).`);
      else add('ok', `Sombra: cierre de SPY del ${D.fmt(o.fecha)} ${fmtU(cl)}.`);
    }
    // venta > tenencia
    if (o.tipo === 'venta' && o.acciones) { const p = k.posiciones.find(x => x.ticker === o.ticker); const tengo = p ? p.acciones + (o.id ? (k.ops.find(x => x.id === o.id) || {}).acciones || 0 : 0) : 0; if (tengo + 1e-6 < o.acciones) add('block', `Vendés ${fmtAcc(o.acciones)} acciones y tenés ${fmtAcc(tengo)}.`); }
    // duplicado
    const dup = state.cartera.operaciones.find(x => x.id !== o.id && x.ticker === o.ticker && x.fecha === o.fecha && x.tipo === o.tipo && o.acciones && Math.abs((x.acciones || 0) - o.acciones) < 1e-6);
    if (dup) add('warn', `Ya hay una ${o.tipo} igual de ${o.ticker} el ${D.fmt(o.fecha)}: ¿duplicada?`);
    // monto inusual
    if (o.acciones && o.precio) { const total = o.acciones * o.precio; const prev = state.cartera.operaciones.filter(x => x.id !== o.id && x.tipo !== 'dividendo').map(x => (x.acciones || 0) * (x.precio || 0)); const mx = prev.length ? Math.max(...prev) : 0; if (mx && total > 3 * mx && total > 500) add('warn', `Total ${fmtU(total)}: muy por encima de tu operación más grande (${fmtU(mx)}).`); }
    return { items, nivel: Verif.nivel(items), traza };
  },
  nivel(items) { return items.some(i => i.nivel === 'block') ? 'block' : items.some(i => i.nivel === 'warn') ? 'warn' : 'ok'; },
  html(ev) {
    const ic = { ok: G.ok, info: '·', warn: G.warn, block: G.no };
    return `<ul class="verif">${ev.items.map(i => `<li class="${i.nivel}"><i>${ic[i.nivel]}</i><span>${i.txt}</span></li>`).join('')}</ul>${ev.nivel === 'block' ? `<label class="switch verif-force"><input type="checkbox" id="o-force"><span>Lo revisé, guardar igual</span></label>` : ''}`;
  },
  /** Texto corto de trazabilidad para el detalle de una operación guardada */
  trazaTxt(v) {
    if (!v || !v.traza) return ''; const t = v.traza; const parts = [];
    if (t.ratio) parts.push(`ratio ${t.ratio.txt} (${t.ratio.fuente})`);
    if (t.ccl) parts.push(`CCL $ ${fmtARS.format(t.ccl.valor)} ${t.ccl.fuente === 'implicito' ? 'implícito' : t.ccl.fuente}${t.ccl.implicito && t.ccl.fuente !== 'implicito' ? ` · implícito $ ${fmtARS.format(t.ccl.implicito)}` : ''}${t.ccl.mercado && t.ccl.fuente !== 'mercado' ? ` · mercado $ ${fmtARS.format(t.ccl.mercado)}` : ''}`);
    if (t.ny) parts.push(`NY ${fmtU(t.ny.precio)} (${t.ny.gap >= 0 ? '+' : ''}${(t.ny.gap * 100).toFixed(1)} %)`);

    return `${parts.join(' · ')}${t.en ? ` · guardada ${new Date(t.en).toLocaleString('es-AR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false })}` : ''}`;
  },
};

/* ---------- COMPARAR EMPRESAS ----------
 * Hasta tres tickers de la cartera o la watchlist, las mismas metricas que la ficha, una al lado de la otra.
 * La pregunta aca es "cual es mejor", no "esta es buena": por eso no hay semaforo. Los valores van en gris
 * y el que lidera cada fila va en blanco con un punto. Al pie, en cuantas filas lidera cada una. */
const CMP_MAX = 3;
const cmpPct = v => v == null ? '\u2014' : `${v < 0 ? '\u2212' : ''}${(Math.abs(v) * 100).toLocaleString('es-AR', { maximumFractionDigits: 1 })} %`;
const cmpNum = n => v => v == null ? '\u2014' : MENOS(Number(v).toLocaleString('es-AR', { maximumFractionDigits: n }));
const CMP_FILAS = [
  { sec: 'Calidad del negocio' },
  { k: 'ROIC', v: d => d.roicAct, f: cmpPct, mejor: 1 },
  { k: 'ROIC promedio 5 a\u00f1os', v: d => d.roicProm5, f: cmpPct, mejor: 1 },
  // con recompras fuertes el patrimonio se achica y el ROE se dispara sin que el negocio mejore:
  // arriba de 100 % o con patrimonio negativo se muestra, pero no compite
  { k: 'ROE', v: d => d.roe, f: cmpPct, mejor: 1, valido: (v, d) => v <= 1 && !(d.deudaPat < 0), ns: true },
  { k: 'Margen neto', v: d => d.margenNeto, f: cmpPct, mejor: 1 },
  { k: 'Deuda / patrimonio', v: d => d.deudaPat, f: cmpNum(2), mejor: -1, valido: v => v >= 0, ns: true },
  { k: 'Caja libre / ganancia', v: d => d.fcfSobreNeto, f: v => v == null ? '\u2014' : cmpNum(2)(v) + '\u00d7', mejor: 1 },
  { sec: 'Crecimiento, CAGR 5 a\u00f1os' },
  { k: 'Ventas', v: d => d.cagrVentas5 ?? d.crecVentas5, f: cmpPct, mejor: 1 },
  { k: 'Ganancia neta', v: d => d.cagrNeto5, f: cmpPct, mejor: 1 },
  { k: 'EPS', v: d => d.cagrEps5, f: cmpPct, mejor: 1 },
  { sec: 'Valuaci\u00f3n' },
  { k: 'P/E', v: d => d.pe, f: cmpNum(1), mejor: -1, valido: v => v > 0 },
  // el P/E crudo entre industrias distintas compara poco; contra su propia historia compara mejor
  { k: 'P/E vs su mediana', v: d => d.pe && d.peMediana ? d.pe / d.peMediana - 1 : null, f: v => v == null ? '\u2014' : (v > 0 ? '+' : '') + cmpPct(v), mejor: -1 },
  { k: 'PEG', v: d => d.peg, f: cmpNum(2), mejor: -1, valido: v => v > 0 },
  { k: 'Rango 52 semanas', v: (d, px) => d.min52 != null && d.max52 > d.min52 && px != null ? clamp((px - d.min52) / (d.max52 - d.min52), 0, 1) : null, f: v => v == null ? '\u2014' : `${Math.round(v * 100)} %`, mejor: -1 },
  { k: 'Dividendo', v: d => d.yieldDiv || null, f: cmpPct, mejor: 0 },
  { k: 'Capitalizaci\u00f3n', v: d => d.capUSD || null, f: v => v == null ? '\u2014' : v >= 1e12 ? `${cmpNum(1)(v / 1e12)} bill.` : `${cmpNum(0)(v / 1e9)} mil M`, mejor: 0 },
];

function cmpUniverso() {
  const k = E.cartera();
  const pos = k.posiciones.map(p => p.ticker), watch = k.watch.map(p => p.ticker).filter(t => !pos.includes(t));
  const px = {}; [...k.posiciones, ...k.watch].forEach(p => { if (p.precio != null) px[p.ticker] = { c: p.precio, dp: p.dp, estado: p.estado }; });
  return { tickers: [...pos, ...watch], watch, px };
}

function cmpBody() {
  const sel = ui.cmp || [];
  const { tickers, watch, px } = cmpUniverso();
  const chips = `<div class="chips filtros" style="margin-bottom:4px">${tickers.map(t => `<button type="button" data-act="cmp-toggle" data-id="${esc(t)}" class="${sel.includes(t) ? 'on' : ''}">${esc(t)}${watch.includes(t) ? '<span class="cmp-w">w</span>' : ''}</button>`).join('')}</div>`;
  if (sel.length < 2) return `<div class="hoja">${chips}${empty({ kind: 'periodo bare-top', icon: 'chart', head: sel.length ? 'Eleg\u00ed otra para comparar' : 'Eleg\u00ed dos o tres empresas', sub: 'De tu cartera o de la watchlist. Se comparan con las mismas m\u00e9tricas de la ficha.' })}</div>`;

  const datos = sel.map(t => ({ t, d: Fund.de(t), px: px[t] ? px[t].c : null, dp: px[t] ? px[t].dp : null, estado: px[t] ? px[t].estado : null }));
  const cargando = datos.filter(x => !x.d).map(x => x.t);
  const lidera = Object.fromEntries(sel.map(t => [t, 0])); let filasConLider = 0;

  const filas = CMP_FILAS.map(fila => {
    if (fila.sec) return `<tr class="sec"><td colspan="${sel.length + 1}">${fila.sec}</td></tr>`;
    const crudo = datos.map(x => { const v = x.d ? fila.v(x.d, x.px) : null; return v == null || !Number.isFinite(v) ? null : v; });
    const vals = crudo.map((v, i) => v != null && fila.valido && !fila.valido(v, datos[i].d) ? null : v);
    let lider = -1;
    const validos = vals.filter(v => v != null);
    if (fila.mejor && validos.length >= 2) {
      const obj = fila.mejor > 0 ? Math.max(...validos) : Math.min(...validos);
      // empate es mismo valor a la vista: nadie lidera por un decimal que no se muestra
      const idx = vals.map((v, i) => v != null && fila.f(v) === fila.f(obj) ? i : -1).filter(i => i >= 0);
      if (idx.length === 1) { lider = idx[0]; lidera[sel[lider]]++; filasConLider++; }
    }
    return `<tr><td class="k">${fila.k}</td>${datos.map((x, i) => `<td class="${i === lider ? 'lider' : crudo[i] != null && vals[i] == null && fila.ns ? 'ns' : ''}">${!x.d ? '\u2026' : fila.f(crudo[i])}</td>`).join('')}</tr>`;
  }).join('');

  const maxL = Math.max(...Object.values(lidera));
  const cab = `<tr class="cab"><th></th>${datos.map(x => `<th><b>${esc(x.t)}</b><span>${x.px != null ? fmtU(x.px) : 'US$ x.xxx'}</span>${x.estado ? `<span class="dot ${x.estado === 'urgente' ? 'crit' : 'warn'}" title="en zona de compra"></span>` : ''}</th>`).join('')}</tr>`;
  const score = `<tr class="score"><td class="k">Lidera en</td>${sel.map(t => `<td class="${lidera[t] === maxL && maxL > 0 ? 'top' : ''}">${lidera[t]} de ${filasConLider}</td>`).join('')}</tr>`;
  return `<div class="hoja">${chips}
    <div class="cmp-wrap"><table class="cmp-t"><thead>${cab}</thead><tbody>${filas}${score}</tbody></table></div>
    <div class="f-pie">${cargando.length ? `Trayendo ${cargando.join(', ')} de Finnhub\u2026 \u00b7 ` : ''}Lidera: el mejor valor de la fila entre las elegidas, sin juzgar si es bueno en absoluto; eso lo dice la ficha de cada una. Rango 52 semanas: m\u00e1s bajo es m\u00e1s cerca del m\u00ednimo. Tachado: no compite, por patrimonio negativo o ROE arriba de 100 % (recompras que achican el patrimonio).</div>
  </div>`;
}

/** trae los fundamentales que falten o esten viejos y repinta si el comparador sigue abierto */
async function cmpTraer() {
  const tok = ui.cmpTok = (ui.cmpTok || 0) + 1;
  const viejo = Date.now() - 6 * 86400000;
  for (const t of (ui.cmp || []).slice()) {
    const d = Fund.de(t); if (d && d.at > viejo) continue;
    try { await Fund.traer(t); } catch (e) {}
    if (ui.cmpTok !== tok) return;
    const b = $('#modal .m-body .cmp-host'); if (b) b.innerHTML = cmpBody();
  }
  Persist.save();
}
function cmpToggle(t) {
  const sel = ui.cmp || (ui.cmp = []);
  const i = sel.indexOf(t);
  if (i >= 0) sel.splice(i, 1);
  else if (sel.length >= CMP_MAX) { toast(`Hasta ${CMP_MAX} a la vez: sac\u00e1 una primero`); return; }
  else sel.push(t);
  const b = $('#modal .m-body .cmp-host'); if (b) b.innerHTML = cmpBody();
  cmpTraer();
}
function formComparar(t) {
  ui.cmp = t ? [t] : (ui.cmp || []).slice(0, CMP_MAX);
  Modal.open({ title: 'Comparar empresas', body: `<div class="cmp-host">${cmpBody()}</div>`, submit: 'Listo', onSubmit: () => {} });
  cmpTraer();
}
function formWatch() {

    const t = Modal.val('w-ticker').trim().toUpperCase(); const mirala = M.parse(Modal.val('w-mirala')), urgente = M.parse(Modal.val('w-urgente'));

}

/* ---------- intercambio con Claude: exportar cartera / cargar actualizaciones ---------- */
const Intercambio = {
  FORMATO: 'gestor-gastos-cambios', VERSION: 2,
  /** v2: `desc` (qué hace la empresa, fijo, ≤120) separado de `nota` (tier + tesis, se recalibra). Una nota vieja "qué hace | tesis" se parte. */
  DESC_MAX: 120, NOTA_MAX: 300,
  partirNota(nota) { const t = nota == null ? '' : String(nota); const i = t.indexOf(' | '); return i < 0 ? { desc: null, nota: t.trim() || null } : { desc: t.slice(0, i).trim().slice(0, Intercambio.DESC_MAX) || null, nota: t.slice(i + 3).trim().slice(0, Intercambio.NOTA_MAX) || null }; },
  nombreArchivo() { const d = new Date(); return `cartera-${D.today()}-${pad2(d.getHours())}${pad2(d.getMinutes())}.md`; },
  /** Markdown legible (tablas) + bloque JSON exacto + instrucciones y esquema de respuesta */
  exportar(pendientes = []) {
    const k = E.cartera(); const s = state.settings; const hoy = D.today(); const hora = new Date();
    const n = v => v == null ? '' : Number(v).toFixed(2); const pct = v => v == null ? '' : (v * 100).toFixed(1) + ' %';

  /** extrae el JSON de cambios de un texto pegado (bloque \`\`\`json o primer objeto {...}) */
  parsear(texto) {
    if (!texto) throw new Error('No hay nada para cargar.');
    let t = String(texto);
    const fence = t.match(/```(?:json)?\s*([\s\S]*?)```/g);
    const candidatos = fence ? fence.map(f => f.replace(/```(?:json)?/g, '').trim()) : [];
    candidatos.push(t.trim());
    // último recurso: primer objeto balanceado
    const i = t.indexOf('{'); if (i >= 0) { let d = 0; for (let j = i; j < t.length; j++) { if (t[j] === '{') d++; else if (t[j] === '}') { d--; if (d === 0) { candidatos.push(t.slice(i, j + 1)); break; } } } }
    let obj = null, err = null;
    for (const c of candidatos) { try { const o = JSON.parse(c); if (o && typeof o === 'object' && (o.alertas || o.tipo === Intercambio.FORMATO)) { obj = o; break; } } catch (e) { err = e; } }
    if (!obj) throw new Error('No encontré un bloque JSON válido con "alertas". ' + (err ? 'Error: ' + err.message : ''));
    if (obj.tipo && obj.tipo !== Intercambio.FORMATO) throw new Error(`El archivo es de tipo "${obj.tipo}", esperaba "${Intercambio.FORMATO}".`);
    return obj;
  },
  /** diff contra las alertas actuales */
  diff(obj) {
    const cur = state.cartera.alertas; const k = E.cartera(); const tengo = new Set(k.posiciones.map(p => p.ticker));
    const cambios = [], avisos = [];
    for (const [tk0, v] of Object.entries(obj.alertas || {})) {
      const tk = String(tk0).toUpperCase().trim(); const ced = Cedears.de(tk); const ticker = ced ? Cedears.ticker(ced) : tk;
      if (!ced && !tengo.has(ticker)) avisos.push(`${ticker}: no está en la tabla de CEDEARs de BYMA (se carga igual).`);
      const antes = cur[ticker] || null;
      if (v === null) { if (antes) cambios.push({ ticker, tipo: 'quitar', antes }); continue; }
      if (typeof v !== 'object') { avisos.push(`${ticker}: valor inválido, se ignora.`); continue; }
      const num = x => x == null || x === '' ? null : (Number(x) || null);
      const despues = { mirala: 'mirala' in v ? num(v.mirala) : (antes ? antes.mirala : null), urgente: 'urgente' in v ? num(v.urgente) : (antes ? antes.urgente : null), objetivo: 'objetivo' in v ? num(v.objetivo) : (antes ? antes.objetivo : null), desc: 'desc' in v ? (v.desc ? String(v.desc).trim().slice(0, Intercambio.DESC_MAX) : null) : (antes ? antes.desc || null : null), nota: 'nota' in v ? (v.nota ? String(v.nota).slice(0, Intercambio.NOTA_MAX) : null) : (antes ? antes.nota : null) };
      // nota vieja con " | " (qué hace | tesis): se parte; el desc explícito manda
      if ('nota' in v && despues.nota && despues.nota.includes(' | ')) { const pt = Intercambio.partirNota(despues.nota); despues.nota = pt.nota; if (!('desc' in v)) despues.desc = pt.desc || despues.desc; }
      if (despues.mirala && despues.urgente && despues.urgente > despues.mirala) avisos.push(`${ticker}: "urgente" (${despues.urgente}) es mayor que "mirala" (${despues.mirala}); revisalo.`);
      const igual = antes && ['mirala', 'urgente', 'objetivo', 'desc', 'nota'].every(f => (antes[f] || null) === (despues[f] || null));
      if (!igual) cambios.push({ ticker, tipo: antes ? 'cambiar' : (tengo.has(ticker) ? 'nueva' : 'watchlist'), antes, despues });
    }
    return { cambios, avisos, comentario: obj.comentario || '' };
  },
  aplicar(d) {
    for (const c of d.cambios) { if (c.tipo === 'quitar') delete state.cartera.alertas[c.ticker]; else state.cartera.alertas[c.ticker] = c.despues; }

 * Distinto de "Exportar para Claude" (la revision completa de cartera, con instrucciones y un JSON de vuelta):

function mercadoNY() {
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', weekday: 'short', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).formatToParts(new Date()).map(x => [x.type, x.value]));
  const ymd = `${p.year}-${p.month}-${p.day}`, hm = Number(p.hour) * 60 + Number(p.minute);
  const habil = !['Sat', 'Sun'].includes(p.weekday) && !FERIADOS_NYSE.has(ymd);
  return { abierto: habil && hm >= 570 && hm < 960, hora: `${p.hour}:${p.minute}`, habil };
}

/** actualiza dolar, precios y los fundamentales que falten o tengan mas de 30 dias.
 *  Finnhub gratis permite 60 llamadas por minuto: los precios son una por ticker y cada ficha son cuatro,
 *  asi que se traen hasta 6 fichas por toque y el resto queda anotado. */
/** un precio traido hace menos de esto cuenta como de hoy: si el auto-refresco corrio segundos antes del toque, no es viejo */
const CTX_FRESCO = 10 * 60000;
async function ctxActualizar(paso) {
  paso('Actualizando d\u00f3lar y precios\u2026');
  const t0 = Date.now(); ui.ctxT0 = t0;
  const okPrecios = await Precios.actualizar(true);
  // un 429 de Finnhub saltea el ticker y le deja el precio viejo: se reintenta una vez, de a uno
  const viejos = () => Precios.tickers().filter(t => { const q = state.cartera.precios[t]; return !q || !(q.t >= t0 - CTX_FRESCO); });
  const fallaron = viejos();
  if (fallaron.length) {
    paso(`Reintentando ${fallaron.length} precio${fallaron.length === 1 ? '' : 's'}\u2026`);
    await new Promise(r => setTimeout(r, 2000));
    for (const t of fallaron) { await Precios.quote(t); await new Promise(r => setTimeout(r, 400)); }
  }
  const k = E.cartera();
  const tickers = [...k.posiciones.map(p => p.ticker), ...k.watch.map(p => p.ticker)];
  const corte = Date.now() - 30 * 86400000;
  const faltan = tickers.filter(t => { const d = Fund.de(t); return !d || d.parcial || !(d.at > corte); });
  // si la precarga del arranque esta corriendo, las fichas quedan para ella: juntas se pasan de 60 por minuto
  const ahora = Fund._calentando ? [] : faltan.slice(0, 6);
  for (let i = 0; i < ahora.length; i++) {
    paso(`Fundamentales ${i + 1} de ${ahora.length}: ${ahora[i]}\u2026`);
    try { await Fund.traer(ahora[i]); } catch (e) {}
    await new Promise(r => setTimeout(r, 250));
  }
  Persist.save();
  return { okPrecios, pendientes: faltan.slice(ahora.length), preciosViejos: viejos() };
}

/** cuantas fichas utiles hay (las parciales no cuentan) y cuales faltan */
function ctxCobertura() {
  const k = E.cartera(); const ts = [...k.posiciones, ...k.watch].map(p => p.ticker);
  const faltan = ts.filter(t => { const d = Fund.de(t); return !d || d.parcial; });
  return { total: ts.length, con: ts.length - faltan.length, faltan };
}
function ctxResumenFund() {
  const c = ctxCobertura(); const v = $('#ctx-fund-v'), por = $('#ctx-fund-por'); if (!v) return c;
  v.textContent = `${c.con} de ${c.total}`; v.classList.toggle('mid', c.con < c.total);
  if (por) por.textContent = c.faltan.length ? `Completando ${c.faltan.join(', ')}. Finnhub da 60 consultas por minuto: se van sumando solas, pod\u00e9s esperar o copiar ya.` : 'Todas al d\u00eda.';
  return c;
}

/* Calendario de balances: proximos earnings de todo lo que se sigue (cartera + watchlist), por fecha.
 * Las fechas vienen del calendario de resultados de Finnhub, que se trae con la ficha de cada empresa. */
function formBalances() {
  const k = E.cartera(); const hoy = D.today();
  const todos = [...k.posiciones.map(p => ({ t: p.ticker, tengo: true, peso: p.peso })), ...k.watch.filter(w => !k.posiciones.some(p => p.ticker === w.ticker)).map(w => ({ t: w.ticker, tengo: false }))];
  const con = [], sin = [], pasados = [];
  for (const x of todos) {
    const d = Fund.de(x.t); if (!d) { sin.push({ ...x, motivo: 'ficha todav\u00eda no cargada' }); continue; }
    if (!d.balance) { sin.push({ ...x, motivo: 'Finnhub no tiene fecha' }); continue; }
    const dias = D.daysBetween(hoy, d.balance.fecha);
    if (dias < 0) { pasados.push({ ...x, b: d.balance, dias }); continue; }
    con.push({ ...x, b: d.balance, dias });
  }
  con.sort((a, b) => a.b.fecha.localeCompare(b.b.fecha));
  const hora = h => h === 'bmo' ? 'antes de abrir' : h === 'amc' ? 'despu\u00e9s del cierre' : h === 'dmh' ? 'durante la rueda' : '';
  const fila = x => `<div class="bal-r" data-act="pos" data-id="${esc(x.t)}"><div class="bal-d"><b>${D.fmt(x.b.fecha)}</b><span>${x.dias === 0 ? 'hoy' : x.dias === 1 ? 'ma\u00f1ana' : `en ${x.dias} d\u00edas`}</span></div><div class="bal-t"><b>${esc(x.t)}</b>${x.tengo ? `<span class="sub">${M.pct(x.peso, 1)} de la cartera</span>` : '<span class="tag">watchlist</span>'}</div><div class="bal-x">${hora(x.b.hora) ? `<span>${hora(x.b.hora)}</span>` : ''}${x.b.epsEst != null ? `<span>EPS esperado ${fmtU(x.b.epsEst)}</span>` : ''}</div></div>`;
  const grupo = (titulo, arr) => arr.length ? `<div class="f-sec"><div class="t">${titulo}</div>${arr.map(fila).join('')}</div>` : '';
  const semana = con.filter(x => x.dias <= 7), quincena = con.filter(x => x.dias > 7 && x.dias <= 30), luego = con.filter(x => x.dias > 30);
  const body = `<div class="hoja">
    ${con.length ? '' : `<p class="ob-nota">Todav\u00eda no hay fechas: se cargan con la ficha de cada empresa (abrila o esper\u00e1 a que se completen solas).</p>`}
    ${grupo('Esta semana', semana)}${grupo('Pr\u00f3ximos 30 d\u00edas', quincena)}${grupo('M\u00e1s adelante', luego)}
    ${sin.length ? `<div class="f-sec"><div class="t">Sin fecha</div><p class="small muted" style="margin:0">${sin.map(x => `${esc(x.t)} (${x.motivo})`).join(' \u00b7 ')}</p></div>` : ''}
    ${pasados.length ? `<div class="f-sec"><div class="t">Ya presentaron (ficha vieja)</div><p class="small muted" style="margin:0">${pasados.map(x => `${esc(x.t)} el ${D.fmt(x.b.fecha)}`).join(' \u00b7 ')}. Se actualiza al abrir la ficha.</p></div>` : ''}
    <p class="ob-nota">Fechas del calendario de resultados de Finnhub, que las toma de los anuncios de cada empresa y las estima cuando todav\u00eda no hay anuncio. Se traen junto con la ficha (hasta 200 d\u00edas adelante) y se refrescan cada vez que la ficha se actualiza. Toc\u00e1 una fila para abrir la ficha.</p>
  </div>`;
  Modal.open({ title: 'Balances que vienen', submit: '', body });
}

/** Cromo que reacciona al scroll: la hairline del encabezado existe solo cuando hay algo arriba,
 *  y el FAB se va mientras bajas (flotaba sobre el contenido todo el recorrido y tapaba cifras).
 *  Vuelve al frenar o al subir. */
let _scrollY = 0, _fabT = null;
/** tocar la pestaña en la que ya estás te lleva arriba del todo (como en iOS); cambiar de pestaña ya arranca arriba */
function arriba() {
  const m = window.innerWidth <= 900 ? $('.main') : null;
  if (m) m.scrollTo({ top: 0, behavior: 'smooth' }); else window.scrollTo({ top: 0, behavior: 'smooth' });
}
function headLine() {
  const m = $('.main'); if (!m) return;
  const h = $('.mobile-head'); if (h) h.classList.toggle('scrolled', m.scrollTop > 4);
  const f = $('.fab'); if (!f) { _scrollY = m.scrollTop; return; }
  const y = m.scrollTop;
  if (y > _scrollY + 2 && y > 40) f.classList.add('hide');
  else if (y < _scrollY - 2) f.classList.remove('hide');
  _scrollY = y;
  clearTimeout(_fabT); _fabT = setTimeout(() => f.classList.remove('hide'), 450);
}
function go(view) { ui.view = view; render(); }

/** setea el ticker elegido en el form de operación y refresca campos/cálculo */
function formOpSet(t) {
  const c = Cedears.de(t); const tk = $('#o-tk'), inp = $('#o-ticker'); if (!tk) return;
  tk.value = t; if (inp) inp.value = c ? `${c.code} · ${c.nombre}` : t; const sug = $('#o-sug'); if (sug) sug.innerHTML = '';
  $$('#modal [data-act="pick-ticker"]').forEach(b => b.classList.toggle('on', b.dataset.id === t));
  const info = $('#o-info'); if (info) info.innerHTML = formOpInfo(t);
  const box = $('#o-campos'); if (box) { const tipo = Modal.choice('o-tipo') || 'compra'; const modo = Modal.choice('o-modo') || 'usd'; const vals = { ced: Modal.val('o-ced'), pxars: Modal.val('o-pxars'), ccl: Modal.val('o-ccl'), acc: Modal.val('o-acc'), precio: Modal.val('o-precio'), monto: Modal.val('o-monto') }; box.innerHTML = formOpCampos(tipo, modo, { ticker: t, cedears: vals.ced, precioCedear: vals.pxars, ccl: vals.ccl, acciones: vals.acc, precio: vals.precio, monto: vals.monto }); }
  formOpCalc();
}

  async export() {
    const json = JSON.stringify(state, null, 1); const filename = `gastos-${D.today()}.json`;
    let dl = null; try { if (window.claude && window.claude.use) dl = await window.claude.use('downloads'); } catch (e) {}
    if (dl) { try { await dl.save({ filename, data: json }); toast('Respaldo guardado'); return; } catch (e) { if (e && e.code === 'unavailable') dl = null; else { toast('No se guardó el respaldo'); return; } } }
    if (!window.claude && navigator.canShare) { try { const file = new File([json], filename, { type: 'application/json' }); if (navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'Respaldo Gestor de gastos' }); state.settings.lastBackup = D.today(); Persist.save(); toast('Respaldo compartido'); return; } } catch (e) { if (e && e.name === 'AbortError') return; } }
    if (!window.claude) { const blob = new Blob([json], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); state.settings.lastBackup = D.today(); Persist.save(); return; }
    Modal.open({ title: 'Respaldo', body: `<p class="small muted" style="margin-bottom:8px">Copiá este texto y guardalo en un archivo .json:</p><textarea class="input textarea" style="min-height:300px" readonly>${esc(json)}</textarea>`, submit: '' });
  },

  mostrarTexto(txt) { Modal.open({ title: 'Resumen para Claude', body: `<textarea class="input textarea" style="min-height:300px" readonly>${esc(txt)}</textarea>`, submit: '' }); },
};

/* ---------- global events ---------- */
document.addEventListener('click', e => {
  const go_ = e.target.closest('[data-go]'); if (go_) { e.preventDefault(); if (go_.dataset.go === ui.view) { arriba(); return; } go(go_.dataset.go); return; }
  const mes = e.target.closest('[data-mes]'); if (mes) { const n = Number(mes.dataset.mes); ui.mes = n === 0 ? D.thisMonth() : D.addMonths(ui.mes, n); lastView = null; render(); return; }
  const cur = e.target.closest('[data-cur]'); if (cur) { ui.cur = cur.dataset.cur; render(); return; }
  const th = e.target.closest('th[data-sort]'); if (th) { const k = th.dataset.sort; if (ui.sort.key === k) ui.sort.dir *= -1; else ui.sort = { key: k, dir: k === 'monto' || k === 'fecha' ? -1 : 1 }; render(); return; }
  const rg = e.target.closest('[data-range]'); if (rg) { ui.trendRange = Number(rg.dataset.range); render(); return; }
  if (e.target.closest('#fab')) { if (ui.view === 'cartera') formOp(); else formMov(); return; }
  // cualquier fila de alerta abre la ficha (posicion o watchlist): antes buscaba tr[data-alerta] y la fila ya no es una tabla
  const ta = e.target.closest('[data-alerta]'); if (ta && !e.target.closest('button')) { formPosicion(ta.dataset.alerta); return; }
  if (e.target.id === 'overlay') { Modal.close(); return; }
  const act = e.target.closest('[data-act]'); if (act) { e.preventDefault(); const fn = Actions[act.dataset.act]; if (fn) fn(act.dataset.id); return; }
  const tr = e.target.closest('tr[data-id]'); if (tr && !e.target.closest('button,select,input,a,label')) { const id = tr.dataset.id; if (id.startsWith('v:')) Actions.confirmar(id); else Actions.edit(id.split('#')[0]); return; }
  const trr = e.target.closest('tr[data-rec]'); if (trr && !e.target.closest('button,select,input,a,label')) { Actions['edit-rec'](trr.dataset.rec); return; }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.filter) { ui.filtros[t.dataset.filter] = t.value; render(); const again = $(`[data-filter="${t.dataset.filter}"]`); if (again && t.dataset.filter === 'q') { again.focus(); again.setSelectionRange(again.value.length, again.value.length); } return; }
  if (t.dataset.setting) { const k = t.dataset.setting; const v = ['ingreso', 'tc', 'presupuesto', 'ccl'].includes(k) ? M.parse(t.value) : ['diaCobro', 'alertaCuotasPct'].includes(k) ? Number(t.value) || 0 : t.value.trim(); state.settings[k] = v; Persist.save(); if (k !== 'nombre') render(); return; }
  if (t.dataset.budget) { const c = state.categorias.find(c => c.id === t.dataset.budget); if (c) { c.presupuesto = M.parse(t.value); Persist.save(); render(); } return; }
  if (t.dataset.pago) { const [tarjetaId, mes] = t.dataset.pago.split('|'); let p = state.pagos.find(p => p.tarjetaId === tarjetaId && p.mes === mes); if (!p) { p = { tarjetaId, mes }; state.pagos.push(p); } p.cuentaId = t.value; Persist.save(); render(); return; }
  if (t.dataset.pagado) { const [tarjetaId, mes] = t.dataset.pagado.split('|'); let p = state.pagos.find(p => p.tarjetaId === tarjetaId && p.mes === mes); if (!p) { p = { tarjetaId, mes }; state.pagos.push(p); } p.pagado = t.checked; Persist.save(); render(); return; }
  if (t.id === 'res-mes') { ui.resMes = $('#res-mes').value; render(); return; }
  if (t.id === 'import-file') { const f = t.files[0]; if (!f) return; f.text().then(txt => { try { const j = JSON.parse(txt); if (!j || !j.v) throw new Error(); confirmar(`Importar ${j.movimientos?.length || 0} movimientos y reemplazar los datos actuales?`, () => { state = Persist.migrate(j); Persist.save(); toast('Datos importados'); go('resumen'); }, 'Importar'); } catch (e) { toast('El archivo no es un respaldo válido'); } }); return; }
  if (t.id === 'import-csv') { const f = t.files[0]; if (!f) return; f.text().then(importarCSV); return; }
});
document.addEventListener('input', e => { const t = e.target;
  if (t.id === 'ob-pres-range' && ui.ob) { ui.ob.presuPct = Number(t.value); obPresu(); return; }
  if (t.dataset.filter === 'q') { clearTimeout(window._qT); window._qT = setTimeout(() => { ui.filtros.q = t.value; const pos = t.selectionStart; render(); const again = $('[data-filter="q"]'); if (again) { again.focus(); again.setSelectionRange(pos, pos); } }, 250); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#overlay').classList.contains('open')) { Modal.close(); return; }
  if ($('#overlay').classList.contains('open')) { if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA' && !e.target.closest('.choice')) { e.preventDefault(); Modal.submit(); } return; }
  if (['INPUT', 'SELECT', 'TEXTAREA'].includes(e.target.tagName)) return;
  if (e.key === 'n' || e.key === 'N') formMov();
});
let rzT, lastW = window.innerWidth; window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => { if (window.innerWidth === lastW) return; lastW = window.innerWidth; if (!$('#overlay').classList.contains('open')) render(); }, 250); });

window.addEventListener('beforeunload', () => { if (Persist.dirty) { Persist.local(); } });

function importarCSV(txt) {
  const lines = txt.split(/\r?\n/).filter(l => l.trim()); if (lines.length < 2) { toast('CSV vacío'); return; }
  const sep = lines[0].includes(';') ? ';' : ','; const head = lines[0].split(sep).map(h => norm(h));
  const idx = (names) => head.findIndex(h => names.some(n => h.includes(n)));
  const iF = idx(['fecha', 'date']), iD = idx(['desc', 'concepto', 'detalle']), iM = idx(['monto', 'importe', 'amount', 'total']), iC = idx(['categ']), iQ = idx(['cuota']);
  if (iF < 0 || iM < 0) { toast('Necesito al menos columnas fecha y monto'); return; }
  let n = 0;
  for (const l of lines.slice(1)) {
    const c = l.split(sep); let fecha = c[iF]?.trim(); if (!fecha) continue;
    if (/^\d{1,2}\/\d{1,2}\/\d{2,4}$/.test(fecha)) { const [d, m, y] = fecha.split('/'); fecha = `${y.length === 2 ? '20' + y : y}-${pad2(m)}-${pad2(d)}`; }
    if (!/^\d{4}-\d{2}-\d{2}$/.test(fecha)) continue;
    const monto = Math.abs(M.parse(c[iM])); if (!monto) continue;
    const desc = (iD >= 0 ? c[iD] : 'Importado').trim(); const s = Smart.suggest(desc);
    let catId = s ? s.catId : 'otros'; if (iC >= 0 && c[iC]) { const found = state.categorias.find(k => norm(k.nombre) === norm(c[iC]) || k.id === norm(c[iC])); if (found) catId = found.id; }
    state.movimientos.push({ id: uid(), fecha, desc, monto, moneda: 'ARS', catId, medio: state.tarjetas.length ? 'tarjeta' : 'debito', tarjetaId: (state.tarjetas[0] || {}).id, necesidad: s ? s.necesidad : 2, cuotas: iQ >= 0 ? Number(c[iQ]) || 1 : 1 }); n++;
  }
  Persist.save(); toast(`${n} movimientos importados`); go('movimientos');
}

/* ---------- boot ---------- */
(async function boot() {
  applyTheme();
  try { const u = JSON.parse(sessionStorage.getItem('flujo.ui') || 'null'); if (u) { ui.view = u.view || ui.view; ui.mes = u.mes || ui.mes; ui.cur = u.cur || ui.cur; } } catch (e) {}
  renderNav(); $('#view').innerHTML = '<div class="empty bare">Cargando…</div>';
  await Persist.init();
  render();
  if (!window.claude && !$('#overlay').classList.contains('open')) {
    const pend = E.cobroPendiente();
    if (pend.length && !Cobro.pospuestoHoy()) setTimeout(() => formCobro(pend[pend.length - 1]), 400);
    else if (state.settings.ingreso && E.fijosPendientes().length && !Fijos.yaMostrado(D.thisMonth())) setTimeout(() => formFijos(D.thisMonth()), 400);
  }
  if (!window.claude && state.settings.tcFecha !== D.today()) TC.actualizar(true).then(ok => { if (ok) render(); });
  if (!window.claude) Cedears.actualizar().then(ch => { if (ch) console.log('Tabla de CEDEARs actualizada:', Cedears.actualizado()); });
  if (!window.claude && (state.settings.finnhubKey || '').trim() && Precios.tickers().length) { const f = state.cartera.preciosFecha ? Date.now() - new Date(state.cartera.preciosFecha).getTime() : Infinity; if (f > 15 * 60 * 1000) Precios.actualizar(true).then(ok => { if (ok && ui.view === 'cartera') render(); }); }
  if (!window.claude) setTimeout(() => Fund.calentar().then(() => { if (ui.view === 'cartera' && !$('#overlay').classList.contains('open')) render(); }), 4000);
  if (Gist.cfg()) Gist.refrescar(true).then(ch => { if (ch) { lastView = null; render(); toast('Datos actualizados desde tus otros dispositivos'); } });
})();

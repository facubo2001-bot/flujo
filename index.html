/* OLED: un solo tema, negro puro (píxeles apagados) */
:root{
  color-scheme:dark;
  --bg:#000000;
  /* las tarjetas se separan con borde, no con relleno: el pixel apagado es el fondo */
  --surface:transparent; --surface-2:transparent; --surface-3:rgba(255,255,255,.07);
  /* unica superficie no transparente: bottom sheet, tab bar y encabezado sticky */
  --surface-elev:#000000;
  --ink:#FFFFFF; --ink-2:#A3A3A3; --ink-3:#7C7C7C;
  --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.14);
  /* semaforo neon: expresa juicio (bueno / ojo / perdes) */
  --good:#0AF08A; --good-text:#0AF08A; --good-soft:rgba(10,240,138,.15);
  --warn:#FFCE21; --warn-text:#FFCE21; --warn-soft:rgba(255,206,33,.15);
  --crit:#FF4A45; --crit-text:#FF4A45; --crit-soft:rgba(255,74,69,.15);
  --serious:#FF4A45; --amber:#FFCE21; --amber-soft:rgba(255,206,33,.15);
  /* gama fria: expresa informacion, nunca juicio */
  --accent:#2DE2F0; --accent-ink:#2DE2F0; --accent-soft:rgba(45,226,240,.12); --accent-soft-2:rgba(45,226,240,.20);
  /* rampa secuencial: una sola gama por opacidad, de mayor a menor peso */
  /* graficos en escala de grises (Facu: "es todo celeste"); el celeste (--accent) queda para lo interactivo y lo tuyo */
  --c1:rgba(255,255,255,.94); --c2:rgba(255,255,255,.78); --c3:rgba(255,255,255,.64);
  --c4:rgba(255,255,255,.46); --c5:rgba(255,255,255,.36); --c6:rgba(255,255,255,.27);
  --c7:rgba(255,255,255,.20); --c8:rgba(255,255,255,.14); --c9:rgba(255,255,255,.10);
  --c-otras:rgba(255,255,255,.05); --c-otras-ink:#8A8A8A; --on-fill:#04161A;
  --grid:#151518; --axis:#2C2C31;
  --shadow:none;
  --shadow-lg:0 24px 60px -16px rgba(0,0,0,.9);
  --r:20px; --r-sm:12px;
  --font-ui:"Public Sans",system-ui,sans-serif;
  --font-display:"Public Sans",system-ui,sans-serif;
  --font-mono:"Public Sans",ui-monospace,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;overscroll-behavior:none}
button,a,.nav-btn,.tabbar button{touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent-ink)}
h1,h2,h3,h4{margin:0;font-family:var(--font-display);font-weight:900;letter-spacing:-.03em;text-wrap:balance}
h1{font-size:34px;line-height:1.1;letter-spacing:-.035em}
h2{font-size:18px}
h3{font-size:15px}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-weight:800;letter-spacing:-.01em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.rail{position:sticky;top:0;height:100vh;padding:20px 14px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px}

.brand .name{font-family:var(--font-display);font-weight:900;font-size:20px;letter-spacing:-.03em}
.brand .sub{font-size:11px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
.nav-btn{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border:0;border-radius:var(--r-sm);background:transparent;color:var(--ink-2);font-weight:500;text-align:left;transition:background .12s}
.nav-btn svg{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.nav-btn:hover{background:var(--surface-2);color:var(--ink)}
.nav-btn.active{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.rail .spacer{flex:1}
.rail .save-state{font-size:12px;color:var(--ink-3);padding:8px 12px;display:flex;align-items:center;gap:8px}
.save-dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.save-dot.ok{background:var(--good)} .save-dot.busy{background:var(--warn)} .save-dot.local{background:var(--accent)} .save-dot.err{background:var(--crit)}
.main{min-width:0;padding:22px 28px 96px}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.topbar .title small{display:block;color:var(--ink-3);font-size:13px;margin-top:3px;font-family:var(--font-ui);font-weight:500}
.topbar .tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.month-nav{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);overflow:hidden}
.month-nav button{border:0;background:transparent;padding:8px 10px;color:var(--ink-2)}
.month-nav button:hover{background:var(--surface-2)}
.month-nav .label{padding:0 6px;font-weight:800;min-width:122px;text-align:center;font-family:var(--font-display);text-transform:capitalize}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 11px;border-radius:7px;color:var(--ink-2);font-weight:700;font-size:13px}
.seg button.on{background:var(--accent);color:#fff}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);width:38px;height:38px;display:grid;place-items:center;color:var(--ink-2)}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.icon-btn:hover{background:var(--surface-2)}

/* ---------- mobile shell ---------- */
.mobile-head{display:none}
.tabbar{display:none}
.fab{position:fixed;right:20px;bottom:24px;width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.22);background:var(--surface-elev);color:#fff;box-shadow:none;display:grid;place-items:center;z-index:30}
.fab svg{width:22px;height:22px;stroke:#fff;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
@media (min-width:901px){.fab{display:none}}
@media (max-width:900px){
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  .app{grid-template-columns:1fr;height:100dvh;min-height:0}
  .rail{display:none}
  .main{height:100dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding:0 14px calc(152px + env(safe-area-inset-bottom))}
  .mobile-head{display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;background:var(--surface-elev);
    margin:0 -14px 12px;padding:calc(14px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid transparent}
  .mobile-head.scrolled{border-bottom-color:var(--line)}
  .mobile-head .brand{padding:0}
  .tabbar{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:25}
  .tabbar button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9.5px;color:var(--ink-3);padding:4px 0;font-weight:700}
  .tabbar button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
  .tabbar button.active{color:var(--accent-ink)}
  .fab{bottom:calc(72px + env(safe-area-inset-bottom));right:16px;width:48px;height:48px}
  .topbar{margin-bottom:14px}
  h1{font-size:33px}
}

/* ---------- cards & grid ---------- */
.grid{display:grid;gap:14px}
.g-kpi{grid-template-columns:repeat(4,1fr)}
.g-2{grid-template-columns:1fr 1fr}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-21{grid-template-columns:2fr 1fr}
.g-12{grid-template-columns:1fr 2fr}
@media (max-width:1180px){.g-kpi{grid-template-columns:repeat(2,1fr)}.g-3{grid-template-columns:1fr 1fr}}
@media (max-width:900px){.g-2,.g-3,.g-21,.g-12{grid-template-columns:1fr}}
@media (max-width:520px){.g-kpi{grid-template-columns:1fr 1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow);min-width:0}
svg.g{width:1em;height:1em;flex:none;vertical-align:-.14em;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
button.card svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.card.tight{padding:14px 16px}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-head h2,.card-head h3{font-size:16px;font-weight:900;letter-spacing:-.03em}
.card-head .hint{font-size:12.5px;color:var(--ink-3)}
.section{margin-top:14px}
.eyebrow{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:700}

/* KPI tiles */
.kpi{display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.kpi .label{font-size:13.5px;color:var(--ink-2);font-weight:500}
@media (min-width:1181px){.kpi.hero .label{padding-right:90px}}
.kpi .delta .pill{white-space:normal;line-height:1.35}
.kpi .value{font-family:var(--font-display);font-size:26px;font-weight:900;letter-spacing:-.04em;line-height:1.1;white-space:nowrap;font-variant-numeric:tabular-nums}
.kpi .delta{font-size:11.5px;font-weight:400;color:var(--ink-3);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.kpi .delta b{font-weight:700}
.kpi .delta .up{color:var(--crit-text)} .kpi .delta .down{color:var(--good-text)} .kpi .delta .neutral{color:var(--ink-2)}
.kpi .spark{position:absolute;right:12px;top:14px;width:84px;height:34px;opacity:.9}
.kpi .mini{display:flex;flex-direction:column;gap:5px;margin-top:2px}
.kpi .mini>div{display:flex;justify-content:space-between;align-items:baseline;gap:8px;min-width:0}
.kpi .mini .k{font-size:12px;color:var(--ink-3);font-weight:700;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .mini b{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap;flex:none}
.kpi .mini b.pos{color:var(--good-text)} .kpi .mini b.neg{color:var(--crit-text)}
.kpi .foot{font-size:12.5px;color:var(--ink-3);margin-top:auto;padding-top:4px;line-height:1.35}
.kpi .value .pos{color:var(--good-text)} .kpi .value .neg{color:var(--crit-text)}
.kpi.hero .value{font-size:26px}
@media (max-width:1180px){.kpi .spark{display:none}}

/* sin fondo tenido: el estado se expresa en el chip y en el color de la cifra */
.kpi .delta .pill{background:transparent;padding:2px 0;border:0}
.kpi .delta .pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.kpi .delta .pill.neutral{color:var(--ink-3)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;vertical-align:1px;margin-right:5px;background:var(--ink-3)}
.dot.crit{background:var(--crit)} .dot.warn{background:var(--warn)} .dot.good{background:var(--good)} .dot.info{background:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700;line-height:1.5;border:1px solid transparent;white-space:nowrap}
.pill.good{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good-text)}
.pill.warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn-text)}
.pill.crit{background:color-mix(in srgb,var(--crit) 14%,transparent);color:var(--crit-text)}
.pill.neutral{background:var(--surface-3);color:var(--ink-2)}
.pill.accent{background:var(--accent-soft);color:var(--accent-ink)}
.pill.amber{background:var(--amber-soft);color:var(--amber)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor;margin-right:0}

/* meter */
.meter{height:8px;border-radius:4px;background:rgba(255,255,255,.10);overflow:hidden;position:relative}
.meter > i{display:block;height:100%;border-radius:4px;background:var(--accent);transition:width .4s}
/* datos nominales (categorias, medios de pago): el color no ordena nada, solo el largo */
.meter.neutral > i{background:rgba(255,255,255,.45)}
.meter.warn > i{background:var(--warn)} .meter.crit > i{background:var(--crit)}
/* barra de limite de tarjeta: 2 px, sin color salvo que estes al limite */
.meter.lim{height:2px;border-radius:1px}
.meter.lim > i{background:rgba(255,255,255,.55);border-radius:1px}
.meter.lim.warn > i{background:var(--warn)}
.meter .mark{position:absolute;top:-3px;width:2px;height:14px;background:var(--ink);opacity:.5}
.meter-row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;font-size:13px;padding:7px 0;border-bottom:1px solid var(--line)}
.meter-row:last-child{border-bottom:0}
.meter-row .meter{grid-column:1/-1}
.meter-row .l{display:flex;align-items:center;gap:8px;min-width:0}
.meter-row .l span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meter-row .v{color:var(--ink-2);white-space:nowrap}
.swatch{width:10px;height:10px;border-radius:3px;flex:none;display:inline-block}
.dl{display:grid;grid-template-columns:auto 1fr auto;gap:7px 8px;align-items:center;font-size:12.5px;flex:1;min-width:0}
.dl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dl b{font-weight:800;font-variant-numeric:tabular-nums}

/* ---------- charts ---------- */
.chart{width:100%;position:relative}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--font-ui);font-size:11px;fill:var(--ink-3)}
.chart .grid line{stroke:var(--grid);stroke-width:1}
.chart .axis line{stroke:var(--axis);stroke-width:1}
.chart .lbl{font-size:11px;fill:var(--ink-2)}
.chart .lbl.strong{fill:var(--ink);font-weight:800}
.chart .hit{fill:transparent}
.chart .hit:hover{fill:color-mix(in srgb,var(--ink) 4%,transparent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend i.line{height:3px;width:14px;border-radius:2px}
.legend i.dash{height:0;width:14px;border-top:2px dashed;background:none!important}
#tooltip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);padding:8px 11px;border-radius:9px;font-size:12px;line-height:1.4;box-shadow:var(--shadow-lg);max-width:260px;opacity:0;transition:opacity .1s;transform:translate(-50%,calc(-100% - 12px))}
#tooltip.show{opacity:1}
#tooltip b{font-weight:800;font-variant-numeric:tabular-nums}
#tooltip .row{display:flex;justify-content:space-between;gap:14px}
#tooltip .row i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:6px}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.heat .d{aspect-ratio:1;border-radius:5px;background:var(--surface-3);display:grid;place-items:center;font-size:10.5px;color:var(--ink-3);position:relative;cursor:default}
.heat .d.h1{background:var(--c9);color:#fff} .heat .d.h2{background:var(--c7);color:#fff} .heat .d.h3{background:var(--c5);color:#fff} .heat .d.h4{background:var(--c3);color:var(--on-fill)} .heat .d.h5{background:var(--c1);color:var(--on-fill)}
.heat .d.today{outline:2px solid var(--accent);outline-offset:-2px}
.heat .d.future{opacity:.45}
.heat .wd{font-size:10px;text-align:center;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}

/* ---------- tables ---------- */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -20px;padding:0 20px}
.card.tight .table-wrap{margin:0 -16px;padding:0 16px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:700;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
th.r,td.r{text-align:right}
th.sorted{color:var(--accent-ink)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
tr[data-id]{cursor:pointer}
td.amount{font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:14.5px;font-weight:800;letter-spacing:-.01em}
td .sub{display:block;font-size:13px;color:var(--ink-3);margin-top:1px}
tr.virtual td{color:var(--ink-2)}
tr.virtual td:first-child{border-left:2px solid var(--amber)}
tr.cuota td{color:var(--ink-2)}
tr.cuota td:first-child{border-left:2px solid var(--c4)}
.cat-chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:2px 8px;border-radius:7px;background:var(--surface-3);color:var(--ink-2);white-space:nowrap}
.cat-chip i{width:8px;height:8px;border-radius:2px;flex:none}
.nec{display:inline-block;width:20px;height:20px;border-radius:6px;font-size:11px;font-weight:700;line-height:20px;text-align:center}
.nec-1,.nec-2,.nec-3{background:rgba(255,255,255,.10);color:var(--ink-2)}
.nec-3{color:var(--crit-text)}
.row-actions{display:inline-flex;gap:2px;opacity:0;transition:opacity .1s}
tr:hover .row-actions,.mrow .row-actions{opacity:1}
.mini-btn{border:0;background:transparent;color:var(--ink-3);border-radius:8px;width:28px;height:28px;display:inline-grid;place-items:center}
@media (max-width:900px){.mini-btn{width:36px;height:36px}.mini-btn svg{width:18px;height:18px}.row-actions{opacity:1}}
.mini-btn:hover{background:var(--surface-3);color:var(--ink)}
.mini-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.empty{padding:34px 16px 30px;display:flex;flex-direction:column;align-items:center;text-align:center;border-top:1px solid var(--line)}
.empty.bare{border-top:0;padding:28px;color:var(--ink-3);font-size:13.5px}
.empty.bare-top{border-top:0}
.card > .empty:first-child,.card > .empty:only-child{border-top:0}
.empty .ico{width:48px;height:48px;border-radius:14px;border:1px solid rgba(255,255,255,.12);display:grid;place-items:center}
.empty .ico svg{width:22px;height:22px;stroke:var(--ink-3);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.empty.is-error .ico svg{stroke:var(--crit)}
.empty h4{margin:14px 0 0;font-size:15px;font-weight:800;letter-spacing:-.02em;color:var(--ink)}
.empty p{margin:6px 0 0;max-width:250px;font-size:12.5px;line-height:17px;color:var(--ink-3)}
.empty .trace{margin-top:12px;padding:8px 12px;border-radius:var(--r-sm);background:rgba(255,255,255,.05);font-family:var(--font-mono);font-size:11px;color:#8A8A8A;max-width:100%;overflow-wrap:anywhere}
.empty .btn{margin-top:16px;height:40px;padding:0 18px;border-radius:var(--r-sm);font-size:13.5px;font-weight:700;border:0;background:var(--ink);color:#05070A}
.empty .btn.ghost{background:transparent;color:var(--ink);border:1px solid rgba(255,255,255,.16)}
.empty-inline{border:1px dashed rgba(255,255,255,.12);border-radius:var(--r-sm);padding:14px 16px;display:flex;align-items:center;gap:12px}
.empty-inline span{flex:1;font-size:13px;font-weight:600;color:var(--ink-3)}
.empty-inline button{height:32px;padding:0 13px;border-radius:10px;border:1px solid rgba(255,255,255,.16);background:transparent;color:var(--ink);font-size:12.5px;font-weight:700}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mrow .mob{display:none}
.sub{display:block;font-size:13px;color:var(--ink-3);margin-top:1px}
.nowrap{white-space:nowrap}
@media (max-width:700px){
  .table-wrap{margin:0 -14px;padding:0 14px}
  table.responsive thead{display:none}
  table.responsive tr{display:block;border-bottom:1px solid var(--line);padding:8px 0}
  table.responsive td{display:none;border:0;padding:2px 0}
  table.responsive td.keep{display:block}
  table.responsive td.keep.amount{text-align:right}
  .mrow .mob{display:flex;gap:6px;align-items:center;flex:none}
}

/* ---------- filters / forms ---------- */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.input,select.input,textarea.input{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-sm);padding:8px 11px;min-height:38px;width:100%;transition:border-color .12s}
.input:focus{border-color:var(--accent);outline:0;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.input.sm{min-height:34px;padding:6px 10px;font-size:13.5px;width:auto}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12.5px;font-weight:500;color:var(--ink-2)}
.field .help{font-size:11.5px;color:var(--ink-3)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid .full{grid-column:1/-1}
@media (max-width:520px){.form-grid{grid-template-columns:1fr}}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-sm);padding:8px 14px;font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;gap:7px;min-height:38px;transition:background .12s}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-ink)}
.btn.danger{color:var(--crit-text);border-color:color-mix(in srgb,var(--crit) 40%,transparent)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:5px 10px;min-height:32px;font-size:12.5px}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.choice{display:flex;gap:6px;flex-wrap:wrap}
.choice button{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-sm);padding:7px 11px;font-size:13px;font-weight:500;color:var(--ink-2)}
.choice button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.choice button.on.n3{border-color:var(--crit);background:color-mix(in srgb,var(--crit) 12%,transparent);color:var(--crit-text)}
.suggest{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.suggest button{border:1px dashed var(--line-2);background:transparent;border-radius:8px;padding:3px 9px;font-size:12px;color:var(--ink-2)}
.suggest button:hover{border-style:solid;background:var(--surface-2)}
.amount-input{position:relative}
.amount-input .input{padding-left:38px;font-family:var(--font-mono);font-size:18px;font-weight:900;font-variant-numeric:tabular-nums;min-height:48px}
.amount-input .cur{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--ink-3);font-weight:600}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;user-select:none}
.switch input{appearance:none;width:36px;height:20px;border-radius:10px;background:var(--line-2);position:relative;margin:0;transition:background .15s}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{transform:translateX(16px)}

/* ---------- modal / sheet ---------- */
.overlay{position:fixed;inset:0;background:rgba(8,12,20,.5);backdrop-filter:blur(3px);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
.overlay.open{display:flex}
.modal{background:var(--surface);border-radius:var(--r);width:min(640px,100%);max-height:calc(100vh - 40px);overflow:auto;box-shadow:var(--shadow-lg);border:1px solid var(--line)}
.modal .m-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px 10px;position:sticky;top:0;background:var(--surface);z-index:2}
.modal .m-head h2:empty{display:none}
.modal .m-head:has(h2:empty){justify-content:flex-end;padding-bottom:0}
.modal .m-body{padding:6px 22px 20px}
.modal .m-foot{display:flex;justify-content:space-between;gap:10px;padding:14px 22px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
.modal .m-foot .right{display:flex;gap:8px;margin-left:auto}
@media (max-width:700px){
  .overlay{align-items:flex-end;padding:0}
  .modal{border-radius:var(--r) var(--r) 0 0;max-height:94vh;width:100%;border-top:1px solid var(--line)}
}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--r-sm);font-size:13.5px;font-weight:500;box-shadow:var(--shadow-lg);z-index:70;opacity:0;transition:all .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:900px){.toast{bottom:140px}}

/* ---------- glow: apagado por defecto; se enciende solo cuando el dato esta en un extremo ---------- */
/* Unico uso permitido: relleno. Nunca text-shadow: una cifra de 900 ya es una mancha solida,
   el halo la convierte en un bloque que irradia. El halo sirve donde hay poca tinta. */
.glow-fill{box-shadow:0 0 10px color-mix(in srgb,currentColor 45%,transparent)}
.glow-fill.crit{box-shadow:0 0 10px rgba(255,74,69,.45)}
.glow-fill.warn{box-shadow:0 0 10px rgba(255,206,33,.45)}
.glow-fill.good{box-shadow:0 0 10px rgba(10,240,138,.45)}
.glow-fill.info{box-shadow:0 0 10px rgba(45,226,240,.45)}
.glow-fill.ink{box-shadow:0 0 10px rgba(255,255,255,.55)}
/* la barra recorta el halo si sigue en overflow:hidden */
.meter:has(> i.glow-fill),.al-bar:has(> i.glow-fill){overflow:visible}

/* composicion de cartera: mapa de bloques proporcionales, sin leyenda */
.cmap{display:flex;flex-direction:column;gap:4px;height:210px}
.cmap-row{display:flex;gap:4px;min-height:46px}
.cmap-b{container-type:inline-size;flex-basis:0;min-width:0;border-radius:9px;display:flex;flex-direction:column;justify-content:space-between;gap:4px;overflow:hidden;cursor:pointer}
.cmap-b b{font-weight:900;letter-spacing:-.02em;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmap-b .n{display:flex;justify-content:space-between;gap:4px;font-weight:800;line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums;overflow:hidden}
.cmap-b .n i,.cmap-b .n em{font-style:normal}
.cmap-b .n i{opacity:.84} .cmap-b .n em{opacity:.58;text-align:right}
.cmap-b .n i,.cmap-b .n em{min-width:0;overflow:hidden}
/* el bloque angosto achica la cifra en vez de esconderla: si una fila muestra la variacion
   del dia y la otra no, la fila baila y deja de leerse como una unidad */
@container (max-width:104px){.cmap-b{padding:7px!important}.cmap-b .n{font-size:10px!important;letter-spacing:-.02em}}
@container (max-width:78px){.cmap-b{padding:6px!important}.cmap-b b{font-size:12px!important}.cmap-b .n{font-size:9px!important}}
.cmap-otras{flex:none;height:30px;border-radius:9px;background:var(--c-otras);color:var(--c-otras-ink);display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-size:12px;font-weight:800;font-variant-numeric:tabular-nums}

/* movimientos en mobile: lista, no una tabla de siete columnas escondiendo cinco */
.mlist{display:flex;flex-direction:column}
.mday{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:18px 0 7px;border-bottom:1px solid var(--line)}
.mday:first-child{padding-top:2px}
.mday b{font-size:12px;font-weight:800;color:var(--ink-3);font-variant-numeric:tabular-nums}
.mv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.mv:last-child{border-bottom:0}
/* el eco de una compra vieja pesa menos: eso es la informacion */
.mv.cuota{opacity:.62}
.mv .m1{display:flex;align-items:center;gap:6px;min-width:0}
.mv .m1 b{font-size:14.5px;font-weight:700;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mv .m2{font-size:11.5px;color:var(--ink-3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mv .mm{font-size:15px;font-weight:800;letter-spacing:-.01em;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.mv .mm .sub{display:block;font-size:11px;color:var(--ink-3);font-weight:500}
.mv.virtual .m1 b{color:var(--ink-2)}
.tg{flex:none;font-size:10px;font-weight:700;padding:1px 6px;border-radius:6px;border:1px solid var(--line-2);color:var(--ink-3);white-space:nowrap}
/* filtros: chips scrolleables, no un panel */
.chips.filtros{align-items:center;margin-bottom:6px}
.chips.filtros .input,.chips.filtros select{flex:none;width:auto;min-width:132px;height:34px;min-height:34px;font-size:13.5px}
.chips.filtros button.on{background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent)}
.chips.filtros .limpiar{flex:none;border:1px solid var(--line-2);background:transparent;color:var(--ink-2);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:700;white-space:nowrap}

/* comparar empresas: gris por defecto, el que lidera la fila en blanco con punto */
.ctx-paso{display:flex;align-items:center;gap:0;font-size:14px;color:var(--ink-2);padding:6px 0}
.cmp-wrap{margin:0 -2px}
.cmp-t{width:100%;border-collapse:collapse;table-layout:fixed;font-variant-numeric:tabular-nums}
.cmp-t th,.cmp-t td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right;vertical-align:baseline;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:default}
.cmp-t th:first-child,.cmp-t td.k{text-align:left;width:34%;color:var(--ink-2);font-size:12.5px;font-weight:500;white-space:normal;padding-left:0}
.cmp-t .cab th{text-transform:none;letter-spacing:0;border-bottom:1px solid var(--line-2);padding-bottom:10px}
.cmp-t .cab b{display:block;font-size:15px;font-weight:900;letter-spacing:-.02em;color:var(--ink)}
.cmp-t .cab span{font-size:11px;color:var(--ink-3);font-weight:700}
.cmp-t .cab .dot{margin:0 0 0 5px}
.cmp-t td{font-size:13.5px;font-weight:700;color:var(--ink-3)}
.cmp-t td.lider{color:var(--ink);font-weight:800}
.cmp-t td.ns{text-decoration:line-through;text-decoration-color:rgba(255,255,255,.3)}
.cmp-t td.lider::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--accent);margin-right:5px;vertical-align:2px}
.cmp-t tr.sec td{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:700;text-align:left;padding:16px 0 4px;border-bottom:0}
.cmp-t tr.score td{border-bottom:0;padding-top:12px;font-weight:800}
.cmp-t tr.score td.top{color:var(--accent)}
.cmp-w{font-size:9px;font-weight:800;color:var(--ink-3);margin-left:4px;vertical-align:1px}
.chips.filtros button.on .cmp-w{color:var(--accent)}

/* ---------- insights ---------- */
.insight{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:start}
.insight:last-child{border-bottom:0}
.insight .ic{width:40px;height:40px;border-radius:var(--r-sm);border:1px solid rgba(255,255,255,.12);background:transparent;display:grid;place-items:center;flex:none}
.insight .ic svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.insight.info .ic{color:var(--accent)}
.insight.good .ic{color:var(--good)}
.insight.warn .ic{color:var(--warn)}
.insight.crit .ic{color:var(--crit)}
.insight b{font-weight:600}
.insight p{font-size:13.5px;color:var(--ink-2)}
.insight .t{font-weight:800;margin-bottom:2px;color:var(--ink)}

/* ---------- cards view ---------- */
.tcard{border-radius:var(--r);border:1px solid var(--line);background:transparent;padding:18px 20px;color:var(--ink);position:relative;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:none}
.tcard .bankdot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:8px;vertical-align:1px;flex:none}
.tcard .tname{font-family:var(--font-display);font-weight:900;font-size:16px;letter-spacing:-.03em;display:flex;justify-content:space-between;align-items:center}
.tcard .tbig{font-family:var(--font-display);font-size:26px;font-weight:900;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.tcard .tmeta{display:flex;gap:16px;font-size:12px;color:var(--ink-3);flex-wrap:wrap}
.tcard .tmeta b{display:block;font-size:13px;color:var(--ink);font-weight:800;font-variant-numeric:tabular-nums}
.tcard .pill{background:rgba(255,255,255,.10);color:var(--ink-2)}
.timeline{display:flex;flex-direction:column;gap:8px}
.tl-row{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;font-size:13px}
.tl-row .m{color:var(--ink-3);font-weight:600;font-size:12px}
.tl-row .bar{height:22px;border-radius:6px;background:var(--surface-3);overflow:hidden;display:flex;gap:2px}
.tl-row .bar i{display:block;height:100%}
.tl-row .v{font-family:var(--font-mono);font-size:12px;color:var(--ink-2);white-space:nowrap}
.cuota-row{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.cuota-row:last-child{border-bottom:0}
.cuota-row .sub{font-size:12px;color:var(--ink-3);grid-column:1}
.cuota-row .meter{grid-column:1/-1;margin-top:6px;height:6px}
.cuota-row .amt{font-family:var(--font-mono);font-size:12.5px;text-align:right}
.progress-pill{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-2)}

/* ---------- misc ---------- */
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.muted{color:var(--ink-3)}
.small{font-size:13.5px}
.divider{height:1px;background:var(--line);margin:12px 0}
.callout{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:transparent;font-size:13.5px}
.callout::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block;margin-right:9px;vertical-align:1px;flex:none}
.callout.amber::before{background:var(--warn)}
.callout.crit::before{background:var(--crit)}
.list-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.onboard{max-width:720px;margin:20px auto}
.ob-steps{display:flex;gap:6px;margin-bottom:20px}
.ob-steps i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.12);transition:background .2s}
.ob-steps i.on{background:var(--accent)}
.onboard h1{font-size:28px;margin-top:6px}
.ob-sub{color:var(--ink-2);font-size:14px;margin-top:8px;max-width:44ch;line-height:1.45}
.ob-nota{color:var(--ink-3);font-size:11.5px;margin-top:12px;line-height:1.4}
.ob-amt{display:flex;align-items:baseline;gap:8px;margin-top:20px;border-bottom:1px solid var(--line-2);padding-bottom:6px}
.ob-amt .cur{font-size:22px;font-weight:800;color:var(--ink-3)}
.ob-big{border:0;background:transparent;font-family:var(--font-display);font-size:34px;font-weight:900;letter-spacing:-.03em;width:100%;padding:2px 0;color:var(--ink);font-variant-numeric:tabular-nums;min-width:0}
.ob-big:focus{outline:0}
.ob-big::placeholder{color:rgba(255,255,255,.16)}
.ob-num{font-family:var(--font-display);font-size:32px;font-weight:900;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.ob-pct{color:var(--accent);font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.ob-card{display:grid;grid-template-columns:minmax(0,1fr) 62px 62px 32px;gap:8px;align-items:end;padding:10px 0;border-bottom:1px solid var(--line)}
.ob-card > *{min-width:0}
/* .input.sm trae width:auto y un input de texto mide 20 caracteres por defecto */
.onboard .input{width:100%}
.ob-card .input{min-width:0;padding-left:8px;padding-right:8px}
.ob-card:last-child{border-bottom:0}
.ob-card label{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.ob-card label .input{margin-top:3px;text-align:center}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent}
input[type=range]:focus{outline:0}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:linear-gradient(to right,var(--accent) var(--p,40%),rgba(255,255,255,.14) var(--p,40%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--ink);margin-top:-11.5px;border:0}
input[type=range]::-moz-range-track{height:3px;border-radius:2px;background:linear-gradient(to right,var(--accent) var(--p,40%),rgba(255,255,255,.14) var(--p,40%))}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:var(--ink);border:0}
body.onboarding .fab{display:none}
kbd{font-family:var(--font-mono);font-size:11px;background:var(--surface-3);padding:1px 6px;border-radius:5px;border:1px solid var(--line-2)}
.hidden{display:none!important}
.fade{animation:fade .22s ease}
.nofade{animation:none}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:6px;background:var(--surface-3);color:var(--ink-2);margin-right:4px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;font-size:13.5px}
.two-col div{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.two-col div b{font-family:var(--font-mono);font-weight:800;font-size:12.5px;font-variant-numeric:tabular-nums}

/* ---------- iOS skin ---------- */
.card{border:0;box-shadow:none;border-radius:var(--r)}

.choice button.on{background:var(--accent);color:#fff}
.choice button.on.n3{background:var(--crit);color:#fff}
.pill{font-weight:700}
th{text-transform:none;letter-spacing:0;font-size:12px;font-weight:700}
.nav-btn.active{background:var(--accent-soft)}
.eyebrow{letter-spacing:.02em}
.modal{border-radius:var(--r)}
.modal .m-head{padding:14px 20px 8px}
.modal .m-head h2{font-size:20px}
.modal .m-foot{border-top:0;padding:10px 20px calc(16px + env(safe-area-inset-bottom))}

.fab{width:48px;height:48px;border-radius:50%;box-shadow:none}
.fab:active{transform:scale(.94)}
/* flota sobre el contenido todo el recorrido: se va al bajar y vuelve al frenar o al subir */

.fab.hide{opacity:0;pointer-events:none}
.tabbar{background:var(--surface-elev)}
@media (max-width:900px){
  h1{font-size:33px;font-weight:900;letter-spacing:-.035em}

}

tr.day td{background:transparent;font-size:12px;font-weight:600;color:var(--ink-2);padding:6px 10px;border-bottom:0}
tr.day td span{float:right;font-family:var(--font-mono);font-weight:800;font-variant-numeric:tabular-nums}
@media (max-width:700px){table.responsive tr.day{display:block;padding:8px 0 4px;border-bottom:0}table.responsive tr.day td{display:block}table.grouped td.fecha{display:none!important}
  /* el desglose se va: la tabla de 12 meses no entra en 390 px */
  th.det,td.det{display:none}
  .table-wrap table th,.table-wrap table td{padding:9px 6px}}
.toast{display:flex;gap:14px;align-items:center;pointer-events:auto}
.toast button{border:0;background:transparent;color:var(--accent);font-weight:700;padding:0;font-size:13.5px}

/* ---------- OLED skin: negro puro, minimalista ---------- */
html,body{background:#000}
.card{background:var(--surface);border:1px solid var(--line)}
.rail{background:#000;border-right:1px solid var(--line)}
.nav-btn.active{background:var(--surface-3);color:#fff}

.btn.primary{background:#fff;border-color:#fff;color:#000}

.btn.danger{background:color-mix(in srgb,var(--crit) 14%,transparent);color:var(--crit-text)}

.grabber{background:#3A3A3C}

.switch input{background:#2E2E33}
.sim-result .box{background:var(--surface-3)}
kbd{background:var(--surface-3)}

/* cartera */
.pos-row{display:grid;grid-template-columns:1.2fr 1fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.pos-row:last-child{border-bottom:0}

.pos-row .pos-m{text-align:right;font-size:13px}
.pos-row .pos-r{text-align:right}
.pos-row .pos-r b{display:block}
.pos-row .up{color:var(--good-text)} .pos-row .down{color:var(--crit-text)}
.sim-result .box .v.up{color:var(--good-text)} .sim-result .box .v.down{color:var(--crit-text)}

/* cartera: alertas compactas, operaciones, buscador de tickers */
.al-row{padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.al-row:last-child{border-bottom:0}
.al-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.al-top .sub{display:inline;margin-left:8px;font-size:12px;color:var(--ink-3)}
.al-desc{font-size:11.5px;font-weight:400;color:var(--ink-3);margin-top:3px;line-height:1.35}
.al-bar{height:4px;border-radius:2px;background:var(--surface-3);margin:8px 0 6px;overflow:hidden}
.al-bar i{display:block;height:100%;border-radius:2px;transition:width .3s}
.al-lv{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.al-lv small{color:var(--ink-3);font-size:11.5px}
.op-row .op-amt{white-space:nowrap;font-size:13px}
.op-row .sub{white-space:normal}
.sug-list{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.sug-list button{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;text-align:left;border:0;background:var(--surface-3);border-radius:var(--r-sm);padding:8px 12px;color:var(--ink);font-size:14px}
.sug-list button span{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.sug-list button i{font-style:normal;font-family:var(--font-mono);font-size:12px;color:var(--ink-3)}
.sug-list button:active{background:var(--surface-3)}
.al-lv span{white-space:nowrap}
.seg.rangos{display:inline-flex;margin-bottom:4px}
.seg.rangos button{padding:5px 11px;font-size:12.5px}
.seg.rangos button.off{opacity:.35}
.alfa-row{display:grid;grid-template-columns:76px 1fr auto;gap:10px;align-items:center;font-size:13px;padding:4px 0}
.alfa-row i{display:block;height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.alfa-row i b{display:block;height:100%;border-radius:3px}
.alfa-row .up{color:var(--good-text)} .alfa-row .down{color:var(--crit-text)}
.ccl-info{display:flex;flex-direction:column;gap:4px;margin-top:6px;font-size:12.5px;color:var(--ink-2)}
.ccl-info span{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.op-row .sub{white-space:normal}
/* vs S&P 500: tres cajas idénticas, centradas */
.evo-kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.evo-kpi .box{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:84px;padding:10px 6px;border-radius:var(--r-sm);background:var(--surface-3);border:0px solid var(--line);text-align:center}
.evo-kpi .box .l{font-size:10.5px;color:var(--ink-3);font-weight:700;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.evo-kpi .box .v{font-family:var(--font-display);font-size:21px;font-weight:900;letter-spacing:-.04em;line-height:1.1;white-space:nowrap;font-variant-numeric:tabular-nums}
.evo-kpi .box .s{font-size:11.5px;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.evo-kpi .box .v.up{color:var(--good-text)} .evo-kpi .box .v.down{color:var(--crit-text)}

.warn-text{color:var(--warn-text)}
/* hoja continua: encabezado, sections con eyebrow + hairline, sin caja dentro de caja */
.hoja{display:flex;flex-direction:column;gap:18px}
.hoja .n{font-size:11.5px;color:var(--ink-3);font-weight:400;line-height:1.35}
.hoja .f-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.hoja .f-head h3{font-family:var(--font-display);font-size:30px;font-weight:900;letter-spacing:-.035em;line-height:1;margin:0}
.hoja .f-head .n{font-size:12.5px;margin-top:5px}
.hoja .f-head .n.desc{font-size:11.5px;font-weight:400;color:var(--ink-3);margin-top:3px;line-height:1.35}
.hoja .f-px{text-align:right;flex:none}
.hoja .f-px b{display:block;font-family:var(--font-display);font-size:20px;font-weight:900;letter-spacing:-.03em;font-variant-numeric:tabular-nums;white-space:nowrap}
.hoja .f-px .dp{font-size:12.5px;font-weight:800;font-variant-numeric:tabular-nums}
.hoja .f-px .dp.up{color:var(--good-text)} .hoja .f-px .dp.down{color:var(--crit-text)}
/* el unico bloque con borde: es un control visual, no una lista */
.hoja .f-rng{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px}
.hoja .f-sec>.t,.hoja .f-rng>.t{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.hoja .r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:baseline;padding:9px 0;border-top:1px solid var(--line)}
.hoja .f-sec>.t + .r{border-top:0;padding-top:6px}
.hoja .r .k{color:var(--ink-2);font-size:13.5px;font-weight:500;min-width:0}
.hoja .r .v{font-size:15px;font-weight:800;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.hoja .r .v.ok{color:var(--good-text)} .hoja .r .v.mid{color:var(--warn-text)} .hoja .r .v.bad{color:var(--crit-text)}
.hoja .r .por{grid-column:1/-1;font-size:11px;color:var(--ink-3);line-height:1.35}
.hoja .f-rng-pies{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}

.hoja .f-bal .n{margin-left:auto}
.hoja .f-pie{font-size:10.5px;color:var(--ink-3);line-height:1.4}
.rng{height:4px;border-radius:2px;background:rgba(255,255,255,.14);position:relative;margin:10px 0 8px}

.nibars{display:flex;align-items:flex-end;gap:3px;height:62px;margin-top:8px}
.nibars i{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px}
.nibars i.neg{background:var(--crit);opacity:1!important}
.crit-text{color:var(--crit-text)}
.fijos,.conc{display:flex;flex-direction:column}
.fijo-row,.conc-row{display:grid;grid-template-columns:1fr 150px 32px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.conc-row{grid-template-columns:1fr 120px}
.fijo-row:first-child,.conc-row:first-child{border-top:0}
.fijo-row b,.conc-row b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.fijo-row .amount-input .input,.conc-row .input{width:100%;box-sizing:border-box}
.fijo-row .amount-input .input{text-align:right;font-size:14px;min-height:38px;padding-left:34px}
.conc-row .input{text-align:right}
.fijo-row .amount-input .cur{left:10px;font-size:12px}
.fijo-row.omitido{opacity:.4} .fijo-row.omitido b{text-decoration:line-through}
ul.verif{list-style:none;margin:8px 0 0;padding:8px 0 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:5px;font-size:12.5px;line-height:1.35}
ul.verif li{display:grid;grid-template-columns:16px 1fr;gap:6px;align-items:start;color:var(--ink-2)}
ul.verif li i{font-style:normal;font-weight:700;text-align:center;line-height:1.35}
ul.verif li.ok i{color:var(--good-text)} ul.verif li.info i{color:var(--ink-3)} ul.verif li.warn{color:var(--ink)} ul.verif li.warn i{color:var(--warn-text)} ul.verif li.block{color:var(--ink)} ul.verif li.block i{color:var(--crit-text)}
.verif-force{margin-top:10px;padding-top:8px;border-top:1px solid var(--line);color:var(--crit-text)}
.traza{padding:8px 10px;border:1px dashed var(--line-2);border-radius:var(--r-sm);line-height:1.4}
.op-row .tag.verif-warn{color:var(--warn-text)} .op-row .tag.verif-block{color:var(--crit-text)}
table.metricas{width:100%;border-collapse:collapse;font-size:12.5px;margin:0 0 4px;table-layout:fixed}
table.metricas th{font-weight:700;color:var(--ink-3);text-align:right;padding:0 2px 6px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
table.metricas th:first-child{text-align:left;width:38%;white-space:normal}

.info-btn{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;border:1px solid var(--line-2);background:transparent;color:var(--ink-3);vertical-align:middle;margin-left:4px;padding:0}

/* precios de Cartera: una linea en vez de tarjeta */

/* composicion: el resto de las posiciones, abierto debajo del mapa */
.cmap-lista{margin-top:6px}
.cl-r{display:grid;grid-template-columns:52px 1fr 44px 58px;align-items:center;gap:10px;min-height:34px;border-bottom:1px solid var(--line);cursor:pointer;font-variant-numeric:tabular-nums}

.cl-bar{height:4px;border-radius:2px;background:rgba(255,255,255,.10);overflow:hidden}

.cl-p{font-size:12.5px;font-weight:700;text-align:right}

/* toda tu plata */

.pat-donut{flex:none;width:150px;height:150px}

const M = {
  tc() { return Number(state.settings.tc) || 1; },
  toARS(monto, moneda) { return moneda === 'USD' ? monto * M.tc() : monto; },
  toUSD(ars) { return ars / M.tc(); },
  /** format an ARS amount in the display currency */
  f(ars, opts = {}) {
    const cur = opts.cur || ui.cur;
    if (cur === 'USD') {
      const v = M.toUSD(ars);
      const s = Math.abs(v) < 100 && !opts.int ? fmtUSD2.format(v) : fmtUSD.format(v);
      return `US$ ${s}`;
    }
    return `$ ${fmtARS.format(Math.round(ars))}`;
  },
  /** compact for tiles: $ 1,2 M / $ 850 k */
  c(ars, opts = {}) {
    const cur = opts.cur || ui.cur;
    if (cur === 'USD') return M.f(ars, opts);
    const a = Math.abs(ars);
    if (a >= 1e6) return `${ars < 0 ? '\u2212' : ''}$ ${(a / 1e6).toLocaleString('es-AR', { maximumFractionDigits: a >= 1e7 ? 1 : 2 })} M`;
    if (a >= 1e4) return `${ars < 0 ? '\u2212' : ''}$ ${(a / 1e3).toLocaleString('es-AR', { maximumFractionDigits: 0 })} k`;
    return M.f(ars, opts);
  },
  pct(v, d = 0) { return `${MENOS((v * 100).toLocaleString('es-AR', { maximumFractionDigits: d }))} %`; },
  /** original currency formatting for a movement */
  orig(m) { return m.moneda === 'USD' ? `US$ ${fmtUSD2.format(m.monto)}` : `$ ${fmtARS.format(m.monto)}`; },
  parse(str) {
    if (typeof str === 'number') return str;
    let s = String(str || '').replace(/\u2212/g, '-').trim().replace(/[^\d,.\-]/g, '');
    if (!s) return 0;
    // es-AR: 1.234.567,89 ; also accept 1234567.89
    if (s.includes(',') && s.includes('.')) s = s.replace(/\./g, '').replace(',', '.');
    else if (s.includes(',')) s = s.replace(',', '.');
    else if ((s.match(/\./g) || []).length > 1) s = s.replace(/\./g, '');
    else if (/\.\d{3}$/.test(s)) s = s.replace('.', '');
    return Number(s) || 0;
  },
};

/* ---------- persistence ---------- */
const LS_KEY = 'flujo.v1';
const Persist = {
  status: 'idle', mode: 'unknown', artifact: undefined, timer: null, dirty: false, lastError: '',
  async init() {
    let candidates = [];
    try { const raw = localStorage.getItem(LS_KEY); if (raw) candidates.push({ src: 'local', data: JSON.parse(raw) }); } catch (e) {}
    try { const emb = JSON.parse($('#flujo-data').textContent); if (emb && emb.v) candidates.push({ src: 'embed', data: emb }); } catch (e) {}
    try {
      const url = new URL('data/flujo.json', location.href).href;
      const r = await fetch(url, { cache: 'no-store' });
      if (r.ok) { const j = await r.json(); if (j && j.v) candidates.push({ src: 'cloud', data: j }); }
    } catch (e) {}
    candidates.sort((a, b) => (b.data.updatedAt || 0) - (a.data.updatedAt || 0));
    if (candidates.length) { state = Persist.migrate(candidates[0].data); Persist.mode = candidates[0].src; }
    Persist.setStatus(candidates.length ? (candidates[0].src === 'local' ? 'local' : 'ok') : 'idle');
    if (Persist.applyPreset()) { state.updatedAt = Date.now(); Persist.local(); Persist.schedule(1500); }
    // resolve capability in background (never block first paint)
    Persist.capPromise = (async () => {
      if (window.claude && typeof window.claude.use === 'function') {
        try { Persist.artifact = await window.claude.use('artifact'); } catch (e) { Persist.artifact = null; }
      } else Persist.artifact = null;
      if (Persist.artifact && candidates.length && candidates[0].src === 'local') Persist.schedule(300); // push local-only edits to cloud
      else if (!Persist.artifact && Persist.status === 'ok') Persist.setStatus('local');
    })();
  },
  /** Merge a data preset embedded by Claude (idempotent: applied once per preset id) */
  applyPreset() {
    let list = null; try { list = JSON.parse($('#flujo-preset').textContent); } catch (e) { return false; }
    if (!list) return false; if (!Array.isArray(list)) list = [list];
    state = Persist.migrate(state);
    let changed = false;
    if (!Array.isArray(state.presets)) state.presets = [];
    for (const p of list) if (p && p.id && !state.presets.includes(p.id)) { Persist.applyOne(p); changed = true; }
    return changed;
  },
  applyOne(p) {
    const byId = arr => new Set(arr.map(x => x.id));
    for (const c of p.categorias || []) if (!byId(state.categorias).has(c.id)) state.categorias.splice(Math.max(0, state.categorias.length - 1), 0, c);
    for (const t of p.tarjetas || []) if (!byId(state.tarjetas).has(t.id) && !state.tarjetas.find(x => norm(x.nombre) === norm(t.nombre))) state.tarjetas.push(t);
    for (const c of p.cuentas || []) if (!byId(state.cuentas).has(c.id) && !state.cuentas.find(x => norm(x.nombre) === norm(c.nombre))) state.cuentas.push(c);
    for (const r of p.recurrentes || []) if (!byId(state.recurrentes).has(r.id)) state.recurrentes.push(r);
    const previos = state.movimientos.slice();
    const dup = (m) => previos.some(x => x.tarjetaId === m.tarjetaId && Math.abs(M.toARS(Number(x.monto) || 0, x.moneda) - M.toARS(Number(m.monto) || 0, m.moneda)) < 1 && Math.abs(D.daysBetween(x.fecha, m.fecha)) <= 4);
    const ids = byId(state.movimientos);
    for (const m of p.movimientos || []) if (!ids.has(m.id) && !dup(m)) state.movimientos.push(m);
    for (const id of p.remove || []) state.movimientos = state.movimientos.filter(x => x.id !== id);
    for (const u of p.updateTarjetas || []) { const t = state.tarjetas.find(x => x.id === u.id); if (t) Object.assign(t, u); }
    for (const u of p.updateRecurrentes || []) { const r = state.recurrentes.find(x => x.id === u.id); if (r) Object.assign(r, u); }
    for (const id of p.removeRecurrentes || []) state.recurrentes = state.recurrentes.filter(x => x.id !== id);
    for (const term of p.scrub || []) { const t = norm(term); state.movimientos = state.movimientos.filter(x => !norm(x.desc).includes(t)); state.recurrentes = state.recurrentes.filter(x => !norm(x.desc).includes(t)); for (const k of Object.keys(state.aprendido)) if (k.includes(t)) delete state.aprendido[k]; }
    for (const g of p.pagos || []) if (!state.pagos.find(x => x.tarjetaId === g.tarjetaId && x.mes === g.mes)) state.pagos.push(g);
    if (p.limpiarInversionesExcepto) { const keep = p.limpiarInversionesExcepto.map(norm); state.inversiones = state.inversiones.filter(i => keep.some(t => norm(i.desc || '').includes(t) || norm(i.destino || '').includes(t))); }
    for (const i of p.inversiones || []) if (!byId(state.inversiones).has(i.id)) state.inversiones.push(i);
    if (p.cartera) {
      const c = state.cartera;
      for (const id of p.cartera.removeInversiones || []) state.inversiones = state.inversiones.filter(x => x.id !== id);
      for (const o of p.cartera.operaciones || []) if (!byId(c.operaciones).has(o.id)) c.operaciones.push(o);
      for (const [t, a] of Object.entries(p.cartera.alertas || {})) if (!c.alertas[t]) c.alertas[t] = a;
      for (const id of p.cartera.removeOperaciones || []) c.operaciones = c.operaciones.filter(x => x.id !== id);
      if (p.cartera.inicio) c.inicio = p.cartera.inicio;
    }
    if (p.settings) for (const [k, v] of Object.entries(p.settings)) if (p.forceSettings || !state.settings[k]) state.settings[k] = v;
    for (const u of p.updates || []) { const m = state.movimientos.find(x => x.id === u.id); if (m) Object.assign(m, u); }
    state.presets.push(p.id);
  },
  migrate(d) {
    const base = defaultState();
    const s = { ...base, ...d, settings: { ...base.settings, ...(d.settings || {}) } };
    if (!s.categorias || !s.categorias.length) s.categorias = base.categorias;
    for (const k of ['tarjetas','cuentas','movimientos','recurrentes','ingresos','inversiones','pagos']) if (!Array.isArray(s[k])) s[k] = [];
    if (!s.aprendido) s.aprendido = {};
    if (!s.sueldos || typeof s.sueldos !== 'object' || Array.isArray(s.sueldos)) s.sueldos = {};
    if (!s.cartera || typeof s.cartera !== 'object') s.cartera = { operaciones: [], alertas: {}, precios: {}, preciosFecha: null };
    for (const k of ['operaciones']) if (!Array.isArray(s.cartera[k])) s.cartera[k] = [];
    for (const k of ['alertas', 'precios', 'historial', 'spy', 'fund']) if (!s.cartera[k] || typeof s.cartera[k] !== 'object') s.cartera[k] = {};
    if (!Array.isArray(s.cartera.activos)) s.cartera.activos = [];  // otros activos: efectivo, fondos, letras, bonos, bitcoin
    // reserva v2: los fondos llevan lotes (suscripcion / rescate) y valor cuota real; un fci viejo (capital + tna) pasa a un lote
    for (const a of s.cartera.activos) if (a && a.tipo === 'fci' && !Array.isArray(a.lotes)) { a.lotes = a.capital ? [{ id: uid(), tipo: 'suscripcion', fecha: a.desde || D.today(), monto: Number(a.capital) || 0 }] : []; }
    for (const o of s.cartera.operaciones) if (o && o.fecha) { const h = D.habil(o.fecha); if (h !== o.fecha) o.fecha = h; }
    for (const o of s.cartera.operaciones) if (o && o.deDividendos > 0 && o.deCaja == null) { o.deCaja = o.deDividendos; delete o.deDividendos; }
    // alertas v2: `desc` (qué hace) separado de `nota` (tier + tesis). Nota vieja "qué hace | tesis" se parte una sola vez.
    for (const a of Object.values(s.cartera.alertas)) if (a && typeof a === 'object' && !a.desc && a.nota && String(a.nota).includes(' | ')) { const t = String(a.nota), i = t.indexOf(' | '); a.desc = t.slice(0, i).trim().slice(0, 120) || null; a.nota = t.slice(i + 3).trim() || null; }
    if (!Array.isArray(s.presets)) s.presets = [];
    if (!s.settings.presupuesto && s.settings.ingreso) s.settings.presupuesto = Math.max(0, Math.round(s.settings.ingreso * (1 - (Number(s.settings.metaInversionPct) || 0) / 100) - (Number(s.settings.colchon) || 0)));
    for (const c of DEFAULT_CATS) if (!s.categorias.find(k => k.id === c.id)) s.categorias.splice(Math.max(0, s.categorias.length - 1), 0, { ...c });
    return s;
  },
  setStatus(st, msg) {
    Persist.status = st;
    const map = { idle: ['', 'Sin datos guardados'], busy: ['busy', 'Guardando…'], ok: ['ok', Gist.cfg() && !Persist.artifact ? 'Sincronizado con tu GitHub' : 'Guardado en la nube'], local: ['local', 'Guardado en este dispositivo'], err: ['err', msg || 'No se pudo guardar'] };
    const [cls, text] = map[st] || map.idle;
    for (const id of ['#save-state', '#save-state-m']) {
      const el = $(id); if (!el) continue;
      el.querySelector('.save-dot').className = 'save-dot ' + cls;
      const t = el.querySelectorAll('span')[1]; if (t) t.textContent = text;
      el.title = text;
    }
  },
  save() { state.updatedAt = Date.now(); Persist.local(); Persist.schedule(); },
  local() { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {} },
  schedule(ms = 1800) { Persist.dirty = true; clearTimeout(Persist.timer); Persist.timer = setTimeout(Persist.flush, ms); Persist.setStatus('busy'); },
  async flush() {
    Persist.dirty = false;
    if (Persist.artifact === undefined && Persist.capPromise) await Persist.capPromise;
    if (!Persist.artifact && Gist.cfg()) {
      try { await Gist.push(); Persist.setStatus('ok'); } catch (e) { Persist.setStatus(e && e.status === 401 ? 'err' : 'local', e && e.status === 401 ? 'Token de GitHub inválido' : ''); }
      return;
    }
    if (!Persist.artifact) { Persist.setStatus('local'); return; }
    const json = JSON.stringify(state);
    try {
      await Persist.artifact.publish({ 'data/flujo.json': { content: json, contentType: 'application/json' } });
      Persist.setStatus('ok');
    } catch (e) {
      const code = e && e.code;
      if (code === 'capability_disabled' || code === 'read_only_path' || code === 'capability_removed' || code === 'transform_error') {
        // fallback: republish whole page with embedded data
        try {
          const r = await fetch(location.href, { cache: 'no-store' });
          let html = await r.text();
          const re = /<script type="application\/json" id="flujo-data">[\s\S]*?<\/script>/;
          if (!re.test(html) || !/^\s*<!doctype html>/i.test(html)) throw new Error('no-template');
          html = html.replace(re, `<script type="application/json" id="flujo-data">${json.replace(/<\//g, '<\\/')}<\/script>`);
          sessionStorage.setItem('flujo.ui', JSON.stringify({ view: ui.view, mes: ui.mes, cur: ui.cur }));
          await Persist.artifact.publish(html);
          Persist.setStatus('ok');
        } catch (e2) { Persist.setStatus(e2 && e2.code === 'conflict' ? 'ok' : 'local'); }
      } else if (code === 'conflict') { Persist.setStatus('ok'); }
      else if (code === 'not_granted' || code === 'not_writer' || code === 'not_declared') { Persist.artifact = null; Persist.setStatus('local'); }
      else if (code === 'rate_limited') { Persist.setStatus('busy'); Persist.schedule(15000); }
      else { Persist.lastError = (e && e.message) || String(e); Persist.setStatus('err'); }
    }
  },
};

/* ---------- sincronización vía Gist privado de GitHub (la config vive en ESTE dispositivo) ---------- */
const Gist = {
  FILE: 'gestor-gastos-datos.json', lastPull: 0,
  cfg() { try { return JSON.parse(localStorage.getItem('flujo.gist') || 'null'); } catch (e) { return null; } },
  guardar(c) { try { localStorage.setItem('flujo.gist', JSON.stringify(c)); } catch (e) {} },
  clear() { try { localStorage.removeItem('flujo.gist'); } catch (e) {} },
  hdr(t) { return { 'Authorization': 'Bearer ' + t, 'Accept': 'application/vnd.github+json' }; },
  async conectar(token) {
    const r = await fetch('https://api.github.com/gists?per_page=100', { headers: Gist.hdr(token) });
    if (r.status === 401) throw new Error('El token no es válido. Fijate que sea un token clásico con permiso "gist".');
    if (!r.ok) throw new Error('GitHub respondió ' + r.status);
    const list = await r.json();
    let g = Array.isArray(list) ? list.find(x => x.files && x.files[Gist.FILE]) : null;
    if (!g) {
      const c = await fetch('https://api.github.com/gists', { method: 'POST', headers: Gist.hdr(token), body: JSON.stringify({ description: 'Gestor de gastos — datos (privado)', public: false, files: { [Gist.FILE]: { content: JSON.stringify(state) } } }) });
      if (!c.ok) throw new Error('No pude crear el archivo en GitHub (' + c.status + '). ¿El token tiene permiso "gist"?');
      g = await c.json();
    }
    Gist.guardar({ token, id: g.id });
    return g.id;
  },
  async pull() {
    const c = Gist.cfg(); if (!c) return null;
    const r = await fetch('https://api.github.com/gists/' + c.id, { headers: Gist.hdr(c.token), cache: 'no-store' });
    if (!r.ok) { const e = new Error('gist ' + r.status); e.status = r.status; throw e; }
    const g = await r.json(); const f = g.files && g.files[Gist.FILE]; if (!f) return null;
    let content = f.content;
    if (f.truncated && f.raw_url) { const rr = await fetch(f.raw_url); content = await rr.text(); }
    return JSON.parse(content);
  },
  async push() {
    const c = Gist.cfg(); if (!c) return false;
    const files = { [Gist.FILE]: { content: JSON.stringify(state) } };
    // copia mensual aparte, que no se pisa: respaldo-AAAA-MM.json (una por mes, en el mismo gist)
    const mes = D.thisMonth(); const marca = 'flujo.gist.mes';
    let ultimo = null; try { ultimo = localStorage.getItem(marca); } catch (e) {}
    if (ultimo !== mes) files[`respaldo-${mes}.json`] = { content: JSON.stringify(state) };
    const r = await fetch('https://api.github.com/gists/' + c.id, { method: 'PATCH', headers: Gist.hdr(c.token), body: JSON.stringify({ files }) });
    if (!r.ok) { const e = new Error('gist ' + r.status); e.status = r.status; throw e; }
    try { localStorage.setItem(marca, mes); localStorage.setItem('flujo.gist.push', String(Date.now())); } catch (e) {}
    return true;
  },
  ultimoPush() { try { return Number(localStorage.getItem('flujo.gist.push')) || 0; } catch (e) { return 0; } },
  /** historial del gist: GitHub guarda una version por cada subida */
  async versiones(n = 30) {
    const c = Gist.cfg(); if (!c) return [];
    const r = await fetch(`https://api.github.com/gists/${c.id}/commits?per_page=${n}`, { headers: Gist.hdr(c.token), cache: 'no-store' });
    if (!r.ok) { const e = new Error('gist ' + r.status); e.status = r.status; throw e; }
    const list = await r.json();
    return (Array.isArray(list) ? list : []).map(x => ({ sha: x.version, fecha: x.committed_at, cambios: x.change_status ? (x.change_status.additions || 0) + (x.change_status.deletions || 0) : null }));
  },
  async version(sha) {
    const c = Gist.cfg(); if (!c) return null;
    const r = await fetch(`https://api.github.com/gists/${c.id}/${sha}`, { headers: Gist.hdr(c.token), cache: 'no-store' });
    if (!r.ok) { const e = new Error('gist ' + r.status); e.status = r.status; throw e; }
    const g = await r.json(); const f = g.files && g.files[Gist.FILE]; if (!f) return null;
    let content = f.content; if (f.truncated && f.raw_url) { const rr = await fetch(f.raw_url); content = await rr.text(); }
    return JSON.parse(content);
  },
  /** trae del gist si hay algo más nuevo; devuelve true si cambió el estado local */
  async refrescar(force = false) {
    if (!Gist.cfg()) return false;
    if (!force && Date.now() - Gist.lastPull < 60000) return false;
    Gist.lastPull = Date.now();
    try {
      const remote = await Gist.pull();
      if (remote && remote.v && (remote.updatedAt || 0) > (state.updatedAt || 0)) { state = Persist.migrate(remote); if (Persist.applyPreset()) { state.updatedAt = Date.now(); Persist.schedule(1500); } Persist.local(); Persist.setStatus('ok'); return true; }
      if (remote && (state.updatedAt || 0) > (remote.updatedAt || 0)) Persist.schedule(800);
      Persist.setStatus('ok');
    } catch (e) { if (e && e.status === 401) Persist.setStatus('err', 'Token de GitHub inválido'); }
    return false;
  },
};

/* ---------- dólar MEP (dolarapi.com; only works outside the artifact sandbox) ---------- */
const TC = {
  /** CCL fresco (para cargar operaciones): guarda valor + hora; devuelve {ccl, hora} o null */
  async ccl(maxEdadMin = 10) {
    const s = state.settings; const edad = s.cclHora ? (Date.now() - new Date(s.cclHora).getTime()) / 60000 : Infinity;
    if (s.ccl && edad < maxEdadMin) return { ccl: s.ccl, hora: s.cclHora, cache: true };
    try {
      const r = await fetch('https://dolarapi.com/v1/dolares/contadoconliqui', { cache: 'no-store' }); if (!r.ok) throw new Error(r.status);
      const j = await r.json(); const v = Number(j.venta) || Number(j.compra); if (!v) throw new Error('sin valor');
      s.ccl = Math.round(v); s.cclFecha = D.today(); s.cclHora = j.fechaActualizacion || new Date().toISOString(); Persist.save();
      return { ccl: s.ccl, hora: s.cclHora, cache: false };
    } catch (e) { return s.ccl ? { ccl: s.ccl, hora: s.cclHora, cache: true, error: true } : null; }
  },
  async actualizar(silencioso = false) {
    try {
      const r = await fetch('https://dolarapi.com/v1/dolares/bolsa', { cache: 'no-store' });
      if (!r.ok) throw new Error(r.status);
      const j = await r.json(); const v = Number(j.venta) || Number(j.compra); if (!v) throw new Error('sin valor');
      state.settings.tc = Math.round(v); state.settings.tcFecha = D.today(); state.settings.tcFuente = 'dolarapi.com (MEP venta)';
      try { const r2 = await fetch('https://dolarapi.com/v1/dolares/contadoconliqui', { cache: 'no-store' }); if (r2.ok) { const j2 = await r2.json(); const v2 = Number(j2.venta) || Number(j2.compra); if (v2) { state.settings.ccl = Math.round(v2); state.settings.cclFecha = D.today(); state.settings.cclHora = j2.fechaActualizacion || new Date().toISOString(); } } } catch (e2) {}
      Persist.save(); if (!silencioso) { toast(`Dólar actualizado · MEP $ ${fmtARS.format(state.settings.tc)}${state.settings.ccl ? ' · CCL $ ' + fmtARS.format(state.settings.ccl) : ''}`); render(); }
      return true;
    } catch (e) {
      if (!silencioso) toast('No se pudo consultar la cotización desde acá (la versión publicada no puede salir a internet). Cargalo a mano o pedímelo en el chat.', 5000);

};

/* ---------- ArgentinaDatos (misma gente que dolarapi; gratis, sin clave): valor cuota de FCI (fuente CNV),
 * inflacion mensual (INDEC) y CCL historico. Todo cacheado en state.cartera.ad, se refresca una vez por dia. ---------- */
const AD = {
  BASE: 'https://api.argentinadatos.com/v1',
  MP_SLUG: 'mercado-fondo-clase-a',   // el fondo de Mercado Pago, para comparar contra "dejarlo en MP"
  box() { const c = state.cartera; if (!c.ad || typeof c.ad !== 'object') c.ad = { fondos: {}, ipc: {}, ccl: {}, at: {} }; for (const k of ['fondos', 'ipc', 'ccl', 'at']) if (!c.ad[k] || typeof c.ad[k] !== 'object') c.ad[k] = {}; return c.ad; },
  async get(path) { const r = await fetch(`${AD.BASE}${path}`, { cache: 'no-store' }); if (!r.ok) throw new Error(`${r.status} ${path}`); return r.json(); },
  fresco(k, horas = 20) { const t = AD.box().at[k]; return t && Date.now() - t < horas * 3600000; },
  /** lista de fondos (para buscar el propio por nombre); cache en memoria una sesion */
  async fondos() {
    if (AD._fondos) return AD._fondos;
    const j = await AD.get('/finanzas/fci/fondos');
    const arr = Array.isArray(j) ? j : (j && (j.fondos || j.data)) || [];
    AD._fondos = arr.map(f => ({ slug: f.slug || AD.slug(f.nombre || ''), nombre: f.nombre || f.slug || '', categoria: f.categoria || '', horizonte: f.horizonte || '' })).filter(f => f.slug);
    return AD._fondos;
  },
  slug(n) { return String(n).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, ''); },
  buscar(lista, q) { const t = AD.slug(q).split('-').filter(Boolean); return lista.filter(f => { const n = AD.slug(f.nombre); return t.every(x => n.includes(x)); }).slice(0, 25); },
  /** historico de valor cuota de un fondo → { fecha: valorCuotaparte }, ultimos ~420 dias */
  async fondo(slug, forzar = false) {
    const box = AD.box(); const k = 'fondo:' + slug;
    if (!forzar && AD.fresco(k) && box.fondos[slug]) return box.fondos[slug];
    const j = await AD.get(`/finanzas/fci/fondos/${encodeURIComponent(slug)}/historico`);
    const hist = Array.isArray(j) ? j : (j && j.historico) || [];
    const desde = D.addDays(D.today(), -420); const vc = {};
    for (const h of hist) { const f = String(h.fecha || '').slice(0, 10); const v = Number(h.valorCuotaparte ?? h.vcp ?? h.valor); if (f >= desde && v > 0) vc[f] = v; }
    if (!Object.keys(vc).length) throw new Error('sin valor cuota');
    box.fondos[slug] = { nombre: (j && j.nombre) || (hist[0] && hist[0].nombre) || slug, vc, hasta: Object.keys(vc).sort().pop() };
    box.at[k] = Date.now(); Persist.save(); return box.fondos[slug];
  },
  /** valor cuota en una fecha (o el ultimo anterior disponible) */
  vcEn(slug, fecha) { const f = AD.box().fondos[slug]; if (!f) return null; if (f.vc[fecha]) return { v: f.vc[fecha], fecha }; const ks = Object.keys(f.vc).filter(x => x <= fecha).sort(); const k = ks[ks.length - 1]; return k ? { v: f.vc[k], fecha: k } : null; },
  vcUltimo(slug) { const f = AD.box().fondos[slug]; return f ? { v: f.vc[f.hasta], fecha: f.hasta } : null; },
  /** inflacion mensual INDEC → { 'AAAA-MM': % } */
  async inflacion(forzar = false) {
    const box = AD.box(); if (!forzar && AD.fresco('ipc', 48) && Object.keys(box.ipc).length) return box.ipc;
    const j = await AD.get('/finanzas/indices/inflacion'); const arr = Array.isArray(j) ? j : [];
    const ipc = {}; for (const r of arr) { const f = String(r.fecha || '').slice(0, 7); const v = Number(r.valor); if (f && Number.isFinite(v)) ipc[f] = v; }
    if (Object.keys(ipc).length) { box.ipc = ipc; box.at.ipc = Date.now(); Persist.save(); }
    return box.ipc;
  },
  /** CCL historico (venta) → { fecha: valor }, ultimos ~420 dias */
  async cclHist(forzar = false) {
    const box = AD.box(); if (!forzar && AD.fresco('ccl') && Object.keys(box.ccl).length) return box.ccl;
    const j = await AD.get('/cotizaciones/dolares/contadoconliqui'); const arr = Array.isArray(j) ? j : [];
    const desde = D.addDays(D.today(), -420); const ccl = {};
    for (const r of arr) { const f = String(r.fecha || '').slice(0, 10); const v = Number(r.venta) || Number(r.compra); if (f >= desde && v > 0) ccl[f] = v; }
    if (Object.keys(ccl).length) { box.ccl = ccl; box.at.ccl = Date.now(); Persist.save(); }
    return box.ccl;
  },
  cclEn(fecha) { const c = AD.box().ccl; if (c[fecha]) return c[fecha]; const ks = Object.keys(c).filter(x => x <= fecha).sort(); const k = ks[ks.length - 1]; return k ? c[k] : null; },
  /** refresco diario de todo lo que usa la reserva; silencioso, cada fuente por su lado */
  async actualizar() {
    const slugs = new Set((state.cartera.activos || []).filter(a => a.tipo === 'fci' && a.slug).map(a => a.slug));
    if (!slugs.size) return;
    slugs.add(AD.MP_SLUG);
    const tareas = [...slugs].map(sl => AD.fondo(sl).catch(e => { AD.box().at['err:' + sl] = String(e.message || e); }));
    tareas.push(AD.inflacion().catch(() => {}), AD.cclHist().catch(() => {}));
    await Promise.all(tareas);
  },
};

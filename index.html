/* ===================== FLUJO — engine: cycles, cuotas, aggregation ===================== */

const E = {
  /** Closing date that falls in month ym (exact per-cycle date if loaded, else the usual day) */
  cierreDe(t, ym) { return (t.cierres && t.cierres[ym]) || D.dateIn(ym, clamp(Number(t.cierre) || 27, 1, 31)); },
  /** For a card + purchase date → closing date, due date, payment month.
      If the purchase falls between two closing dates loaded explicitly (≤ 45 días entre sí), usa la siguiente exacta —
      esto banca ciclos irregulares como un cierre 27-ago seguido de 1-oct. */
  cycle(tarjeta, fecha) {
    const exactas = Object.values(tarjeta.cierres || {}).sort();
    const next = exactas.find(d => d >= fecha);
    const prev = exactas.filter(d => d < fecha).pop();
    if (next && prev && D.daysBetween(prev, next) <= 45) {
      const venc0 = clamp(Number(tarjeta.vencimiento) || 5, 1, 31);
      let vy = D.ym(next); let vd = D.dateIn(vy, venc0);
      while (vd <= next) { vy = D.addMonths(vy, 1); vd = D.dateIn(vy, venc0); }
      return { cierre: next, vencimiento: vd, mesPago: vy };
    }
    let ym = D.ym(fecha); let cierreDate = E.cierreDe(tarjeta, ym);
    if (fecha > cierreDate) { ym = D.addMonths(ym, 1); cierreDate = E.cierreDe(tarjeta, ym); }
    if (next && next < cierreDate) cierreDate = next, ym = D.ym(next);
    const venc = clamp(Number(tarjeta.vencimiento) || 5, 1, 31);
    let vencYm = ym; let vencDate = D.dateIn(vencYm, venc);
    while (vencDate <= cierreDate) { vencYm = D.addMonths(vencYm, 1); vencDate = D.dateIn(vencYm, venc); }
    return { cierre: cierreDate, vencimiento: vencDate, mesPago: vencYm };
  },
  /** Next closing / due dates for a card relative to today */
  cardNow(tarjeta, hoy = D.today()) {
    const c = E.cycle(tarjeta, hoy);
    // period start = day after previous closing
    const exactas = Object.values(tarjeta.cierres || {}).sort();
    const prevCierre = exactas.filter(d => d < c.cierre).pop();
    const periodoDesde = D.addDays(prevCierre && D.daysBetween(prevCierre, c.cierre) <= 45 ? prevCierre : E.cierreDe(tarjeta, D.addMonths(D.ym(c.cierre), -1)), 1);
    return { ...c, periodoDesde, periodoHasta: c.cierre, diasAlCierre: D.daysBetween(hoy, c.cierre), diasAlVenc: D.daysBetween(hoy, c.vencimiento) };
  },
  /** Next statement to pay (earliest whose due date is today or later) */
  proximoPago(tarjeta, hoy = D.today()) {
    const now = E.cardNow(tarjeta, hoy);
    for (const ym of [D.addMonths(now.mesPago, -1), now.mesPago]) { const f = D.dateIn(ym, tarjeta.vencimiento); if (f >= hoy) return { ym, fecha: f, dias: D.daysBetween(hoy, f), ...E.resumen(tarjeta.id, ym) }; }
    return { ym: now.mesPago, fecha: now.vencimiento, dias: now.diasAlVenc, ...E.resumen(tarjeta.id, now.mesPago) };
  },
  /** payment month for a movement's first installment */
  primerPago(m) {
    if (m.primerPago) return m.primerPago;
    if (m.medio === 'tarjeta') { const t = L.tarjeta(m.tarjetaId); if (t) return E.cycle(t, m.fecha).mesPago; }
    return D.ym(m.fecha);
  },
  /** Month the first installment is "spent" in (accrual): purchase month, unless an explicit first statement was set */
  baseMes(m) {
    if (m.primerPago && m.medio === 'tarjeta') { const t = L.tarjeta(m.tarjetaId); if (t) { const cy = E.cycle(t, m.fecha); return D.addMonths(m.primerPago, -D.diffMonths(D.ym(cy.cierre), cy.mesPago)); } }
    return D.ym(m.fecha);
  },
  /** Expand a movement into installment pieces. mesGasto = month the cuota counts as spent; mesPago = month it is debited */
  expand(m) {
    const n = Math.max(1, Number(m.cuotas) || 1);
    const totalARS = M.toARS(Number(m.monto) || 0, m.moneda);
    const first = E.primerPago(m); const base = E.baseMes(m);
    const mesConsumo = D.ym(m.fecha);
    const origenBase = m.recId ? 'fijo' : null;
    const out = [];
    for (let i = 0; i < n; i++) {
      const mesPago = D.addMonths(first, i); const mesGasto = D.addMonths(base, i);
      out.push({
        m, idx: i + 1, n, montoARS: totalARS / n, totalARS, mesConsumo, mesPago, mesGasto,
        fechaPago: m.medio === 'tarjeta' ? E.fechaVenc(m.tarjetaId, mesPago) : m.fecha,
        origen: origenBase || (n > 1 ? (i === 0 ? 'nuevo' : 'cuota') : (mesPago === mesConsumo ? 'nuevo' : 'nuevo')),
      });
    }
    return out;
  },
  fechaVenc(tarjetaId, ym) { const t = L.tarjeta(tarjetaId); return t ? D.dateIn(ym, t.vencimiento) : D.dateIn(ym, 1); },
  /** closing date of the statement whose payment month is ym */
  fechaCierre(tarjetaId, ym) { const t = L.tarjeta(tarjetaId); if (!t) return D.dateIn(ym, 1); const cy = Number(t.vencimiento) <= Number(t.cierre) ? D.addMonths(ym, -1) : ym; return E.cierreDe(t, cy); },

  /** Virtual instances of recurrentes for a month (skipping months already instantiated as real movements) */
  recurrentesDe(ym) {
    const real = new Set(state.movimientos.filter(m => m.recId).map(m => m.recId + ':' + m.mesRec));
    return state.recurrentes.filter(r => r.activo !== false && (!r.desde || r.desde <= ym) && (!r.hasta || r.hasta >= ym) && !real.has(r.id + ':' + ym) && !(Array.isArray(r.omitidos) && r.omitidos.includes(ym)))
      .map(r => ({ id: 'v:' + r.id + ':' + ym, virtual: true, recId: r.id, mesRec: ym, fecha: D.dateIn(ym, Number(r.dia) || 1), desc: r.desc, monto: r.monto, moneda: r.moneda || 'ARS', catId: r.catId, medio: r.medio || 'debito', tarjetaId: r.tarjetaId, cuentaId: r.cuentaId, necesidad: r.necesidad || 1, cuotas: 1 }));
  },
  /** all movements (real + virtual) whose purchase month is in [from, to] */
  movs(from, to) {
    const real = state.movimientos.filter(m => { const ym = D.ym(m.fecha); return ym >= from && ym <= to; });
    const virt = [];
    for (const ym of D.range(from, D.diffMonths(from, to) + 1)) virt.push(...E.recurrentesDe(ym));
    return real.concat(virt);
  },
  /** cache per render */
  _cache: null,
  build() {
    const from = D.addMonths(D.thisMonth(), -18), to = D.addMonths(D.thisMonth(), 14);
    const movs = E.movs(from, to);
    const pieces = movs.flatMap(E.expand);
    E._cache = { movs, pieces, from, to };
    return E._cache;
  },
  data() { return E._cache || E.build(); },

  /* ---------- aggregations ---------- */
  /** Día de cobro del sueldo de un mes (settings.diaCobro; 28 o más = último día del mes) */
  fechaCobro(ym) { const d = Number(state.settings.diaCobro) || 1; return D.dateIn(ym, d >= 28 ? D.daysIn(ym) : d); },
  /** Sueldo neto de un mes: el registrado ese mes; si no, el registrado más cercano (antes, o después); si no, el de Configuración */
  sueldo(ym) {
    const s = state.sueldos || {}; const ok = k => s[k] && Number(s[k].monto) > 0;
    if (ok(ym)) return { monto: Number(s[ym].monto), fecha: s[ym].fecha || E.fechaCobro(ym), registrado: true };
    const keys = Object.keys(s).filter(ok).sort(); const prev = keys.filter(k => k < ym).pop(); const ref = prev || keys.find(k => k > ym) || null;
    return { monto: ref ? Number(s[ref].monto) : Number(state.settings.ingreso) || 0, fecha: E.fechaCobro(ym), registrado: false, ref };
  },
  /** Guarda el sueldo cobrado en un mes; si es el más reciente, pasa a ser el sueldo base de toda la app. Devuelve {monto, prev, delta} */
  registrarSueldo(ym, monto, fecha) {
    if (!state.sueldos) state.sueldos = {};
    const prev = E.sueldo(D.addMonths(ym, -1));
    state.sueldos[ym] = { monto: Math.round(monto), fecha: fecha || E.fechaCobro(ym) };
    const ultimo = Object.keys(state.sueldos).sort().pop(); if (ultimo === ym) state.settings.ingreso = Math.round(monto);
    return { monto: Math.round(monto), prev: prev.monto, prevRegistrado: prev.registrado, delta: prev.monto ? monto / prev.monto - 1 : null };
  },
  /** Meses cuyo cobro ya pasó (hasta 25 días atrás) y no está registrado: el anterior y el actual, del más viejo al más nuevo */
  cobroPendiente() {
    if (!(Number(state.settings.ingreso) > 0)) return []; const hoy = D.today(); const cur = D.thisMonth();
    return [D.addMonths(cur, -1), cur].filter(ym => { const f = E.fechaCobro(ym); return f <= hoy && D.daysBetween(f, hoy) <= 25 && !E.sueldo(ym).registrado; });
  },
  ingreso(ym) {
    const base = E.sueldo(ym).monto;
    const extra = sum(state.ingresos.filter(i => D.ym(i.fecha) === ym).map(i => M.toARS(Number(i.monto) || 0, i.moneda)));
    return { base, extra, total: base + extra };
  },
  invertido(ym) { return sum(state.inversiones.filter(i => D.ym(i.fecha) === ym).map(i => M.toARS(Number(i.monto) || 0, i.moneda))); },
  /** Gasto del mes (devengado): fijos del mes + cuotas que caen en el mes + compras del mes (primera cuota) */
  consumo(ym) {
    const pieces = E.data().pieces.filter(p => p.mesGasto === ym);
    const agg = { total: 0, fijo: 0, cuotas: 0, compras: 0, variable: 0, byCat: {}, byGrupo: {}, byNec: { 1: 0, 2: 0, 3: 0 }, byMedio: {}, byDay: {}, count: 0, movs: [], innecesario: 0, tarjeta: 0, nCuotas: 0, esencial: 0, elegible: 0, viaje: 0, viajeCuotas: 0, viajeMovs: [] };
    const dias = D.daysIn(ym);
    for (const p of pieces) {
      const m = p.m; const v = p.montoARS;
      let row = m;
      if (p.idx > 1) row = { ...m, id: m.id + '#' + p.idx, origId: m.id, cuotaRow: true, cuotaIdx: p.idx, cuotaN: p.n, monto: v, moneda: 'ARS', cuotas: 1, fecha: D.dateIn(ym, Math.min(Number(m.fecha.slice(8, 10)), dias)), primerPago: undefined };
      // gastos de un viaje (Facu: las vacaciones son puntuales y distorsionan el mes): fuera del gasto mensual, cuentan en el viaje y en el anio
      if (m.viajeId && L.viaje(m.viajeId)) { agg.viaje += v; if (p.idx > 1) agg.viajeCuotas += v; agg.viajeMovs.push(row); continue; }
      if (p.idx > 1) { agg.cuotas += v; agg.nCuotas++; }
      else if (m.recId) agg.fijo += v;
      else agg.compras += v;
      agg.total += v; agg.count++; agg.movs.push(row);
      agg.byCat[m.catId] = (agg.byCat[m.catId] || 0) + v;
      const g = L.grupoDeCat(m.catId).id; agg.byGrupo[g] = (agg.byGrupo[g] || 0) + v;
      if (L.cat(m.catId).esencial) agg.esencial += v; else agg.elegible += v;
      agg.byNec[m.necesidad || 1] += v;
      agg.byMedio[m.medio] = (agg.byMedio[m.medio] || 0) + v;
      // las cuotas de compras viejas ya estan comprometidas el 1 del mes: si se dibujan en el dia de la compra
      // original, las que caen despues de hoy quedan fuera del ritmo del mes (y la proyeccion arranca corta)
      const d = Number(row.fecha.slice(8, 10)); const dd = row.cuotaRow || D.ym(row.fecha) !== ym ? 1 : d; agg.byDay[dd] = (agg.byDay[dd] || 0) + v;
      if (m.medio === 'tarjeta') agg.tarjeta += v;
    }
    agg.variable = agg.compras; agg.comprometido = agg.fijo + agg.cuotas; agg.innecesario = agg.byNec[3];
    return agg;
  },
  /** amount a row represents in the month (cuota rows and first cuotas show the installment, not the total) */
  rowAmount(m) { if (m.cuotaRow) return m.monto; const v = M.toARS(Number(m.monto) || 0, m.moneda); return (m.cuotas || 1) > 1 ? v / m.cuotas : v; },
  /** flujo: by payment month — what leaves the accounts */
  flujo(ym) {
    const pieces = E.data().pieces.filter(p => p.mesPago === ym);
    const agg = { total: 0, fijos: 0, cuotas: 0, previo: 0, nuevo: 0, tarjetas: {}, contado: 0, pieces, byCat: {}, comprometido: 0 };
    for (const p of pieces) {
      agg.total += p.montoARS;
      if (p.origen === 'fijo') agg.fijos += p.montoARS;
      else if (p.idx > 1) agg.cuotas += p.montoARS;
      else if (p.mesConsumo < ym) agg.previo += p.montoARS;
      else agg.nuevo += p.montoARS;
      if (p.m.medio === 'tarjeta') { const k = p.m.tarjetaId || 'sin'; agg.tarjetas[k] = (agg.tarjetas[k] || 0) + p.montoARS; }
      else agg.contado += p.montoARS;
      agg.byCat[p.m.catId] = (agg.byCat[p.m.catId] || 0) + p.montoARS;
    }
    agg.comprometido = agg.fijos + agg.cuotas + agg.previo;
    return agg;
  },
  /** Statement (resumen) of a card for a payment month */
  resumen(tarjetaId, ym) {
    const pieces = E.data().pieces.filter(p => p.mesPago === ym && p.m.medio === 'tarjeta' && p.m.tarjetaId === tarjetaId);
    return { total: sum(pieces.map(p => p.montoARS)), pieces, fecha: E.fechaVenc(tarjetaId, ym) };
  },
  /** Projection of consumo for a month (variable spend) */
  proyeccion(ym) {
    const hoy = D.today();
    const c = E.consumo(ym);
    const dias = D.daysIn(ym);
    if (ym < D.thisMonth()) return { total: c.total, variable: c.variable, fijo: c.fijo, cuotas: c.cuotas, cerrado: true };
    if (ym > D.thisMonth()) {
      const hist = E.promedioVariable(ym, 3); const fe = Math.max(c.fijo, E.fijosEstimados(ym));
      return { total: hist + fe + c.cuotas, variable: hist, fijo: fe, cuotas: c.cuotas, futuro: true };
    }
    const dia = Number(hoy.slice(8, 10));
    const restantes = dias - dia;
    const hist = E.promedioVariable(ym, 3);
    const paceActual = dia > 0 ? c.variable / dia : 0;
    const paceHist = hist / dias;
    const w = clamp(dia / dias, 0.15, 0.85); // trust current pace more as month advances
    const pace = paceActual * w + paceHist * (1 - w);
    const variable = c.variable + pace * restantes;
    const fijoTotal = Math.max(c.fijo, E.fijosEstimados(ym));
    return { total: variable + fijoTotal + c.cuotas, variable, fijo: fijoTotal, cuotas: c.cuotas, pace, restantes, dia };
  },
  /** Average cumulative spend curve over previous months (accrual). Returns {vals, n} for ym's days */
  promedioAcumulado(ym, maxMeses = 12) {
    const dias = D.daysIn(ym); const curvas = [];
    for (let i = 1; i <= maxMeses; i++) {
      const m = D.addMonths(ym, -i); const c = E.consumo(m); if (c.count < 5) continue;
      const dm = D.daysIn(m); const cum = []; let acc = 0;
      for (let d = 1; d <= dm; d++) { acc += (c.byDay[d] || 0); cum.push(acc); }
      curvas.push({ cum, dm });
      if (curvas.length >= 6) break;
    }
    if (!curvas.length) return { vals: null, n: 0 };
    const vals = Array.from({ length: dias }, (_, i) => sum(curvas.map(c => c.cum[Math.min(i, c.dm - 1)])) / curvas.length);
    return { vals, n: curvas.length };
  },
  promedioVariable(ym, n) {
    const vals = [];
    for (let i = 1; i <= n; i++) { const m = D.addMonths(ym, -i); const c = E.consumo(m); if (c.count >= 5) vals.push(c.variable); }
    return vals.length ? sum(vals) / vals.length : 0;
  },
  /** Fijos del mes todavía no confirmados (virtuales) cuyo día ya pasó (mes actual) o todos (meses anteriores) */
  fijosPendientes(ym = D.thisMonth()) { const hoy = D.today(); return E.recurrentesDe(ym).filter(v => ym < D.thisMonth() || v.fecha <= hoy); },
  /** Confirma los fijos de un mes: crea el movimiento real con el monto dicho; si cambió, actualiza el monto base del fijo. omitidos = ids de recurrentes que no van este mes */
  confirmarFijos(ym, montos, omitidos = []) {
    const cambios = []; let n = 0;
    for (const v of E.recurrentesDe(ym)) {
      const r = state.recurrentes.find(x => x.id === v.recId); if (!r) continue;
      if (omitidos.includes(v.recId)) { r.omitidos = Array.from(new Set([...(r.omitidos || []), ym])); continue; }
      const monto = Number(montos[v.recId]); if (!(monto > 0)) continue;
      state.movimientos.push({ id: uid(), fecha: v.fecha, desc: v.desc, monto, moneda: v.moneda, catId: v.catId, medio: v.medio, tarjetaId: v.tarjetaId, cuentaId: v.cuentaId, necesidad: v.necesidad, cuotas: 1, recId: v.recId, mesRec: ym }); n++;
      if (Math.abs(monto - Number(r.monto)) > 0.5) { cambios.push({ desc: r.desc, antes: Number(r.monto), ahora: monto, d: monto / Number(r.monto) - 1 }); r.monto = monto; }
    }
    E._cache = null; return { n, cambios, omitidos: omitidos.length };
  },
  fijosEstimados(ym) { return sum(E.recurrentesDe(ym).map(r => M.toARS(r.monto, r.moneda))) + sum(state.movimientos.filter(m => m.recId && m.mesRec === ym).map(m => M.toARS(m.monto, m.moneda))); },
  /** Forward view: fijos + cuotas already committed per month (accrual) vs income */
  horizonte(fromYm, n = 12) {
    return D.range(fromYm, n).map(ym => {
      const c = E.consumo(ym); const ing = E.ingreso(ym).total || E.ingreso(D.thisMonth()).base; const pres = E.presupuesto(ym) || ing;
      const fijos = Math.max(c.fijo, E.fijosEstimados(ym)); const comprometido = fijos + c.cuotas + c.viajeCuotas;  // las cuotas de un viaje no son gasto del mes, pero se pagan con el sueldo
      return { ym, ingreso: ing, presupuesto: pres, fijos, cuotas: c.cuotas + c.viajeCuotas, nuevo: c.compras, comprometido, libre: pres - comprometido, pct: pres ? comprometido / pres : 0 };
    });
  },
  /** dolares de un movimiento: USD directo; pesos al CCL del dia de la compra (si no hay historico, el de hoy) */
  aUSD(m) { const v = Number(m.monto) || 0; if (m.moneda === 'USD') return v; const c = (typeof AD !== 'undefined' && AD.cclEn && AD.cclEn(m.fecha)) || Number(state.settings.ccl) || Number(state.settings.tc) || 0; return c ? v / c : null; },
  /** resumen de cada viaje: total (la compra entera, aunque sea en cuotas), por categoria, por dia */
  viajes() {
    return (state.viajes || []).map(v => {
      const movs = state.movimientos.filter(m => m.viajeId === v.id);
      const total = sum(movs.map(m => M.toARS(Number(m.monto) || 0, m.moneda))); const usd = movs.every(m => E.aUSD(m) != null) ? sum(movs.map(E.aUSD)) : null;
      const byCat = {}; for (const m of movs) byCat[m.catId] = (byCat[m.catId] || 0) + M.toARS(Number(m.monto) || 0, m.moneda);
      const dias = v.desde && v.hasta ? D.daysBetween(v.desde, v.hasta) + 1 : null;
      return { ...v, movs, total, usd, byCat, dias, porDia: dias ? total / dias : null, porDiaUSD: dias && usd != null ? usd / dias : null, anio: (v.desde || (movs[0] || {}).fecha || D.today()).slice(0, 4) };
    }).sort((a, b) => String(b.desde || '').localeCompare(String(a.desde || '')));
  },
  /** gasto de un anio: meses (sin viajes) + viajes, por fecha de gasto (devengado) */
  anual(anio) {
    const meses = D.range(`${anio}-01`, 12).filter(ym => ym <= D.thisMonth());
    const cs = meses.map(ym => ({ ym, c: E.consumo(ym) }));
    const mensual = sum(cs.map(x => x.c.total)), viajes = sum(cs.map(x => x.c.viaje));
    return { anio, meses: cs.length, mensual, viajes, total: mensual + viajes, promMes: cs.length ? mensual / cs.length : 0 };
  },
  /** Cuotas que se PAGAN en el mes ym (entran en el resumen que vence ese mes): cuota k de N */
  pagosCuotas(ym) {
    return E.data().pieces.filter(p => p.n > 1 && p.mesPago === ym).map(p => ({ m: p.m, idx: p.idx, n: p.n, cuota: p.montoARS })).sort((a, b) => b.cuota - a.cuota);
  },
  /** Horizonte por mes de PAGO (vista Cuotas): fijos del mes + cuotas que pagas ese mes, contra el presupuesto */
  horizontePago(fromYm, n = 12) {
    return E.horizonte(fromYm, n).map(h => { const cuotas = sum(E.pagosCuotas(h.ym).map(x => x.cuota)); const comprometido = h.fijos + cuotas; const pres = h.presupuesto; return { ...h, cuotas, comprometido, libre: pres - comprometido, pct: pres ? comprometido / pres : 0 }; });
  },
  /** Active installment plans. idx = calendar month; idxPeriodo advances when the card closes */
  cuotasActivas(ym = D.thisMonth()) {
    const hoy = D.today();
    return state.movimientos.filter(m => (m.cuotas || 1) > 1).map(m => {
      const first = E.baseMes(m); const n = Number(m.cuotas);
      const last = D.addMonths(first, n - 1);
      const idx = clamp(D.diffMonths(first, ym) + 1, 0, n);
      const t = m.medio === 'tarjeta' ? L.tarjeta(m.tarjetaId) : null;
      const cierre = t ? E.cycle(t, hoy).cierre : null;
      const ymPer = ym === D.thisMonth() && cierre ? D.ym(cierre) : ym;
      // Nº de cuota "en curso" = cierres de la tarjeta que YA pasaron desde la compra + 1 (la que va al próximo cierre).
      // Solo se usa el calendario si no hay tarjeta o si se mira un mes que no es el actual.
      let idxPeriodo, pasados = null;
      if (t && ym === D.thisMonth()) {
        // el dia del cierre todavia no cerro (una compra de ese dia entra en ese resumen): cuenta desde el dia siguiente
        let c = E.cycle(t, m.fecha).cierre; pasados = 0;
        while (c && c < hoy && pasados < n) { pasados++; c = E.cycle(t, D.addDays(c, 1)).cierre; }

      return { catId: best[0], necesidad: Number(best[1]), medio: best[2], tarjetaId: best[3] || undefined, monto: last.monto, moneda: last.moneda, src: 'historial', n: hist.length };
    }
    if (state.aprendido[d]) return { ...state.aprendido[d], src: 'aprendido' };
    // 2) dictionary
    for (const [re, cat, nec] of DICT) if (re.test(' ' + d + ' ') || re.test(d)) { if (state.categorias.find(c => c.id === cat)) return { catId: cat, necesidad: nec, src: 'diccionario' }; }
    return null;
  },
  learn(m) { const d = norm(m.desc); if (d.length >= 3) state.aprendido[d] = { catId: m.catId, necesidad: m.necesidad, medio: m.medio, tarjetaId: m.tarjetaId }; },
  /** detect possible recurring expenses among non-recurrent movements */
  detectarRecurrentes() {
    const groups = {};
    for (const m of state.movimientos) { if (m.recId) continue; const k = norm(m.desc).replace(/\d+/g, '').trim(); if (k.length < 3) continue; (groups[k] = groups[k] || []).push(m); }

    }
    return out;
  },
};

function niceMax(v, ticks = 4) {

  const f = raw / p; const nf = [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10].find(x => x >= f - 1e-9) || 10;
  const step = nf * p; return { max: step * ticks, step };
}
const axisFmt = v => MENOS((() => { const cur = ui.cur; if (cur === 'USD') { const u = M.toUSD(v); return Math.abs(u) >= 1000 ? (u / 1000).toLocaleString('es-AR', { maximumFractionDigits: 1 }) + ' k' : Math.round(u).toString(); } return Math.abs(v) >= 1e6 ? (v / 1e6).toLocaleString('es-AR', { maximumFractionDigits: 1 }) + ' M' : Math.abs(v) >= 1000 ? Math.round(v / 1000) + ' k' : Math.round(v).toString(); })());

  /** Stacked columns. series: [{name,color,values}] ; optional line overlay {name,values,color} on the SAME axis */

    const padL = 44, padR = 12, padT = 14, padB = 26;

    const all = totals.slice(); if (line) all.push(...line.values.filter(v => v != null));
    const { max, step } = niceMax(Math.max(...all, 1));
    const slot = iw / n; const bw = Math.min(24, slot * 0.6); const x = i => padL + slot * i + slot / 2; const y = v => padT + ih - v / max * ih;
    let g = '<g class="grid">';
    for (let v = 0; v <= max + 1e-9; v += step) g += `<line x1="${padL}" x2="${w - padR}" y1="${y(v)}" y2="${y(v)}"/><text x="${padL - 6}" y="${y(v) + 4}" text-anchor="end">${yFmt(v)}</text>`;
    g += '</g>';
    const every = Math.max(1, Math.ceil(44 / slot));
    let xl = ''; labels.forEach((l, i) => { if (i % every === 0) xl += `<text x="${x(i)}" y="${h - 8}" text-anchor="middle" ${i === highlight ? 'class="lbl strong"' : ''}>${esc(l)}</text>`; });
    let bars = '', hits = '';
    labels.forEach((_, i) => {

      hits += act ? `<rect class="hit" x="${padL + slot * i}" y="${padT}" width="${slot}" height="${ih}" data-act="${act}" data-id="${i}" style="cursor:pointer"/>` : `<rect class="hit" x="${padL + slot * i}" y="${padT}" width="${slot}" height="${ih}" data-tip="${esc(`<b>${esc(tipTitle(i))}</b>${rows}${tot}${ln}`)}"/>`;
    });
    let lp = '';
    if (line) { let d = ''; line.values.forEach((v, i) => { if (v == null) return; d += (d ? 'L' : 'M') + x(i) + ' ' + y(v); }); lp = `<path d="${d}" fill="none" stroke="${line.color || 'var(--ink)'}" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round"/>`; }

  donut({ slices, size = 180, thick = 26, center = '' }) {

/* ===================== FLUJO — insights (rule-based analysis) ===================== */

const Insights = {
  /** returns list of {level, icon, title, text, view?} for the selected month */
  build(ym) {
    const out = [];
    const c = E.consumo(ym), prev = E.consumo(D.addMonths(ym, -1)), ing = E.ingreso(ym).total; const mg = E.margen(ym);
    const isCur = ym === D.thisMonth(); const proj = E.proyeccion(ym);
    const nextYm = D.addMonths(ym, 1); const ingNext = E.ingreso(nextYm).total;
    const hz = E.horizonte(D.thisMonth(), 12); const alerta = (Number(state.settings.alertaCuotasPct) || 60) / 100;
    if (!c.count) return [{ level: 'info', icon: 'spark', title: 'Todavía no hay movimientos en este mes', text: 'Cargá tus gastos con el botón + y acá vas a ver alertas, tendencias y sugerencias calculadas sobre tus datos.' }];

    // 1. projection vs income / vs previous month
    const pres = mg.presupuesto;
    if (isCur && pres) {
      const ratio = proj.total / pres;
      if (ratio > 1) out.push({ level: 'crit', icon: 'alert', title: `Proyección: te pasás ${M.pct(ratio - 1)} del presupuesto`, text: `Al ritmo actual cerrás ${D.monthName(ym)} con ${M.f(proj.total)} contra un presupuesto de ${M.f(pres)}. Los ${proj.restantes} días que quedan necesitan un freno: cada día de compras promedia ${M.f(proj.pace)}.` });
      else if (ratio > 0.85) out.push({ level: 'warn', icon: 'alert', title: `Proyección ajustada: ${M.pct(ratio)} del presupuesto`, text: `Vas a cerrar el mes cerca de ${M.f(proj.total)}. Queda poco margen si no bajás las compras (${M.f(proj.pace)} por día).` });
      else out.push({ level: 'good', icon: 'check', title: `Proyección de cierre: ${M.f(proj.total)} (${M.pct(ratio)} del presupuesto)`, text: `Si mantenés el ritmo, te sobran ${M.f(mg.quedaProj)} del presupuesto, además de los ${M.f(mg.ahorro)} que ya separás para invertir.` });
    }
    // 1b. sueldo registrado del mes: adónde va la diferencia (presupuesto quieto → todo el aumento a inversión)
    const su = E.sueldo(ym), suPrev = E.sueldo(D.addMonths(ym, -1));
    if (su.registrado && suPrev.monto && pres && (suPrev.registrado || (suPrev.ref && suPrev.ref < ym))) {
      const d = su.monto / suPrev.monto - 1; const ant = suPrev.registrado ? D.monthName(D.addMonths(ym, -1)).split(' ')[0] : 'el sueldo anterior';
      if (d >= 0.005) out.push({ level: 'good', icon: 'trend', title: `Cobraste ${M.f(su.monto)}: +${M.pct(d)} vs ${ant}`, text: `Con el presupuesto quieto en ${M.f(pres)}, los ${M.f(su.monto - suPrev.monto)} de más van derecho a inversión: ${M.f(su.monto - pres)} este mes.`, view: 'plan' });
      else if (d <= -0.005) out.push({ level: 'warn', icon: 'down', title: `Cobraste ${M.f(su.monto)}: ${M.pct(d)} vs ${ant}`, text: `Quedan ${M.f(su.monto - pres)} para invertir con el presupuesto en ${M.f(pres)}. Para sostener el objetivo anterior habría que recortar ${M.f(suPrev.monto - su.monto)} de gastos.`, view: 'plan' });
    }
    // 2. vs previous month
    if (prev.count && c.count) {
      const d = (c.total - prev.total) / (prev.total || 1);
      const cmp = isCur ? `Comparado con el mismo punto del mes pasado` : `Contra ${D.monthName(D.addMonths(ym, -1))}`;
      let prevToDate = prev.total;
      if (isCur) { const dia = Number(D.today().slice(8, 10)); prevToDate = sum(Object.entries(prev.byDay).filter(([k]) => Number(k) <= dia).map(([, v]) => v)); }
      const dd = (c.total - prevToDate) / (prevToDate || 1);
      if (Math.abs(dd) > 0.12 && prevToDate > 0) out.push({ level: dd > 0 ? 'warn' : 'good', icon: dd > 0 ? 'trend' : 'down', title: `${dd > 0 ? '+' : ''}${M.pct(dd)} vs el mes pasado`, text: `${cmp}: ${M.f(c.total)} contra ${M.f(prevToDate)}. ${dd > 0 ? 'Fijate en qué categorías está la diferencia (abajo).' : 'Buen ritmo, sostenelo.'}` });
    }
    // 3. category jumps
    const jumps = [];
    for (const [catId, v] of Object.entries(c.byCat)) {
      const avg = E.promedioCat(catId, ym, 3);
      if (avg > 0 && v > avg * 1.4 && v - avg > ing * 0.02 && v > 20000) jumps.push({ cat: L.cat(catId), v, avg });
    }
    jumps.sort((a, b) => (b.v - b.avg) - (a.v - a.avg)).slice(0, 2).forEach(j => out.push({ level: 'warn', icon: 'trend', title: `${j.cat.nombre}: ${M.pct(j.v / j.avg - 1)} arriba de tu promedio`, text: `Llevás ${M.f(j.v)} en ${D.monthName(ym)} contra un promedio de ${M.f(j.avg)} en los últimos 3 meses.` }));
    // 4. budgets
    for (const cat of state.categorias) {
      if (!cat.presupuesto) continue; const v = c.byCat[cat.id] || 0; const r = v / M.toARS(cat.presupuesto, 'ARS');
      if (r >= 1) out.push({ level: 'crit', icon: 'alert', title: `Presupuesto de ${cat.nombre} superado ${r > 1.005 ? `por ${M.pct(r - 1)}` : ''}`.trim(), text: `Gastaste ${M.f(v)} de los ${M.f(cat.presupuesto)} que definiste.` });
      else if (r >= 0.8 && isCur && proj.restantes > 5) out.push({ level: 'warn', icon: 'clock', title: `${cat.nombre} al ${M.pct(r)} del presupuesto`, text: `Quedan ${M.f(cat.presupuesto - v)} para ${proj.restantes} días.` });
    }
    // 5. unnecessary share
    if (c.total > 0) {
      const share = c.innecesario / c.total;
      const prevShare = prev.total ? prev.byNec[3] / prev.total : null;
      if (share > 0.2) out.push({ level: 'warn', icon: 'alert', title: `${M.pct(share)} de lo gastado lo marcaste como innecesario`, text: `Son ${M.f(c.innecesario)}. ${prevShare != null ? `El mes pasado fue ${M.pct(prevShare)}. ` : ''}Eso equivale a ${M.pct(c.innecesario / (pres || c.total))} de tu presupuesto que podría ir a inversión.` });
      else if (share < 0.08 && c.count > 5) out.push({ level: 'good', icon: 'check', title: `Solo ${M.pct(share)} de gasto innecesario`, text: `Gasto disciplinado: ${M.f(c.innecesario)} en caprichos sobre ${M.f(c.total)}.` });
    }
    // 6. installment load next months
    const heavy = hz.filter(h => h.presupuesto && h.pct > alerta);
    if (heavy.length) {
      const worst = heavy.sort((a, b) => b.pct - a.pct)[0];
      out.push({ level: worst.pct > 0.5 ? 'crit' : 'warn', icon: 'cuotas', title: `${heavy.length === 1 ? 'Un mes' : heavy.length >= 6 ? 'Casi todos los próximos meses' : heavy.length + ' meses'} con más de ${M.pct(alerta)} del presupuesto ya comprometido`, text: `El peor es ${D.monthName(worst.ym)}: ${M.f(worst.comprometido)} entre fijos y cuotas (${M.pct(worst.pct)} del presupuesto). Evitá sumar cuotas nuevas que caigan ahí.`, view: 'cuotas' });
    } else if (hz[1] && hz[1].presupuesto) {
      out.push({ level: 'info', icon: 'cuotas', title: `Ya comprometido para ${D.monthName(nextYm)}: ${M.f(hz[1].comprometido)}`, text: `${M.pct(hz[1].pct)} del presupuesto entre fijos (${M.f(hz[1].fijos)}) y cuotas (${M.f(hz[1].cuotas)}). Te quedan ${M.f(hz[1].libre)} para compras.`, view: 'cuotas' });
    }
    // 7. cuotas finishing soon
    const act = E.cuotasActivas(ym); const ending = act.filter(a => a.last === ym || a.last === nextYm);
    if (ending.length) out.push({ level: 'good', icon: 'check', title: `Se terminan ${ending.length} plan${ending.length > 1 ? 'es' : ''} de cuotas`, text: `${ending.map(a => `${a.m.desc} (${M.f(a.cuota)}/mes)`).join(', ')}. Se liberan ${M.f(sum(ending.map(a => a.cuota)))} mensuales desde ${D.monthName(D.addMonths(ending.sort((a, b) => b.last.localeCompare(a.last))[0].last, 1))}.` });
    // 8. subscriptions annualized
    const subs = state.recurrentes.filter(r => r.activo !== false && L.cat(r.catId).id === 'subs');
    if (subs.length >= 3) { const tot = sum(subs.map(r => M.toARS(r.monto, r.moneda))); out.push({ level: 'info', icon: 'repeat', title: `${subs.length} suscripciones: ${M.f(tot)} por mes`, text: `Anualizado son ${M.f(tot * 12)}. Revisá si usás todas: ${subs.map(s => s.desc).join(', ')}.` }); }
    // 9. hormiga
    const small = c.movs.filter(m => !m.recId && !m.cuotaRow && M.toARS(m.monto, m.moneda) < 8000);
    if (small.length >= 12) { const t = sum(small.map(m => M.toARS(m.monto, m.moneda))); out.push({ level: 'info', icon: 'wallet', title: `Gasto hormiga: ${small.length} compras chicas suman ${M.f(t)}`, text: `Compras de menos de $ 8.000 que individualmente no se notan pero juntas son ${M.pct(t / (c.total || 1))} del mes.` }); }
    // 10. recurring detection
    const det = Smart.detectarRecurrentes();
    if (det.length) out.push({ level: 'info', icon: 'repeat', title: `Detecté ${det.length} gasto${det.length > 1 ? 's' : ''} que se repite${det.length > 1 ? 'n' : ''} todos los meses`, text: `${det.slice(0, 3).map(d => `${d.desc} (~${M.f(d.avg)})`).join(', ')}. Convertilos en fijos para que el pronóstico los tenga en cuenta.`, action: 'detectar' });
    // 11. investment
    const inv = E.invertido(ym);
    if (ing && !isCur && ym <= D.thisMonth()) {
      const libre = ing - c.total; const meta = mg.ahorro;
      if (inv >= meta && meta > 0) out.push({ level: 'good', icon: 'invest', title: `Invertiste ${M.f(inv)}: ${M.pct(inv / ing)} del sueldo`, text: `Cumpliste el objetivo de ${M.f(meta)}.` });
      else if (libre > meta * 0.5 && inv < meta) out.push({ level: 'info', icon: 'invest', title: `Te sobraron ${M.f(libre)} en ${D.monthName(ym)}`, text: `Invertiste ${M.f(inv)}. Registrá lo que aportaste a Balanz/BTC para seguir tu tasa de ahorro real.`, view: 'plan' });
    }
    // 12. weekend pattern
    const wk = { fin: 0, sem: 0 };
    for (const m of c.movs) { if (m.recId || m.cuotaRow) continue; const d = D.dow(m.fecha); wk[d === 0 || d === 6 ? 'fin' : 'sem'] += E.rowAmount(m); }
    if (wk.fin > wk.sem && wk.fin > 0) out.push({ level: 'info', icon: 'clock', title: 'Gastás más los fines de semana que en toda la semana', text: `${M.f(wk.fin)} sábados y domingos contra ${M.f(wk.sem)} de lunes a viernes.` });
    // 13. card closing soon
    if (isCur) for (const t of state.tarjetas) { const now = E.cardNow(t); if (now.diasAlCierre >= 0 && now.diasAlCierre <= 3) out.push({ level: 'info', icon: 'tarjetas', title: `${t.nombre} cierra ${now.diasAlCierre === 0 ? 'hoy' : now.diasAlCierre === 1 ? 'mañana' : 'en ' + now.diasAlCierre + ' días'}`, text: `Lo que compres después del ${D.fmt(now.cierre)} recién lo pagás el ${D.fmt(D.dateIn(D.addMonths(now.mesPago, 1), t.vencimiento))}. Si podés esperar, esperá.` }); }
    // 14. backup reminder (only outside claude.ai)
    if (!window.claude && state.movimientos.length > 20) { const last = state.settings.lastBackup; if (!last || D.daysBetween(last, D.today()) > 30) out.push({ level: 'info', icon: 'download', title: 'Hacé un respaldo', text: `${last ? 'Hace más de un mes que no exportás' : 'Nunca exportaste'} tus datos. Viven solo en este teléfono: en Configuración tocá Exportar y guardalo en Archivos.`, view: 'config' }); }
    const order = { crit: 0, warn: 1, good: 2, info: 3 };
    return out.sort((a, b) => order[a.level] - order[b.level]).slice(0, 8);
  },

  /** Text summary to paste into a Claude chat */
  resumenTexto(ym) {
    const c = E.consumo(ym), ing = E.ingreso(ym); const mg = E.margen(ym);
    const lines = [];
    lines.push(`# Resumen financiero ${D.monthName(ym)} (generado por Gestor de gastos)`);
    lines.push(`Tipo de cambio usado: ${state.settings.tc} ARS/USD. Ingreso: ${M.f(ing.total, { cur: 'ARS' })} (${M.f(ing.total, { cur: 'USD' })}).`);
    lines.push(`Gastos del mes: ${M.f(c.total, { cur: 'ARS' })} — fijos ${M.f(c.fijo, { cur: 'ARS' })}, cuotas de compras anteriores ${M.f(c.cuotas, { cur: 'ARS' })}, compras ${M.f(c.compras, { cur: 'ARS' })}. Innecesario: ${M.f(c.innecesario, { cur: 'ARS' })} (${M.pct(c.innecesario / (c.total || 1))}).`);
    lines.push(`Presupuesto mensual: ${M.f(mg.presupuesto, { cur: 'ARS' })} (el resto, ${M.f(mg.ahorro, { cur: 'ARS' })}, va a inversión). Queda para gastar: ${M.f(mg.queda, { cur: 'ARS' })}.`);
    lines.push(`Invertido: ${M.f(E.invertido(ym), { cur: 'ARS' })}.`);
    if (c.viaje) lines.push(`Viajes (aparte, no suman al gasto del mes; sí al del año): ${M.f(c.viaje, { cur: 'ARS' })} — ${[...new Set(c.viajeMovs.map(m => (L.viaje(m.viajeId) || {}).nombre))].join(', ')}.`);
    lines.push('\n## Por categoría');
    Object.entries(c.byCat).sort((a, b) => b[1] - a[1]).forEach(([k, v]) => lines.push(`- ${L.cat(k).nombre}: ${M.f(v, { cur: 'ARS' })} (${M.pct(v / (c.total || 1))})`));
    lines.push('\n## Próximos 6 meses (comprometido: fijos + cuotas)');
    E.horizonte(D.thisMonth(), 6).forEach(h => lines.push(`- ${D.monthName(h.ym, true)}: fijos + cuotas ${M.f(h.comprometido, { cur: 'ARS' })} de un presupuesto de ${M.f(h.presupuesto, { cur: 'ARS' })} (${M.pct(h.pct)}), libre para compras ${M.f(h.libre, { cur: 'ARS' })}`));
    const act = E.cuotasActivas(ym);
    if (act.length) { lines.push('\n## Cuotas activas'); act.forEach(a => lines.push(`- ${a.m.desc}: cuota ${a.idx}/${a.n} de ${M.f(a.cuota, { cur: 'ARS' })}, termina ${D.monthName(a.last, true)}`)); }
    lines.push('\n## Movimientos del mes');
    c.movs.sort((a, b) => a.fecha.localeCompare(b.fecha)).forEach(m => lines.push(`- ${m.fecha} | ${m.desc} | ${M.f(E.rowAmount(m), { cur: 'ARS' })}${m.cuotaRow ? ` (cuota ${m.cuotaIdx}/${m.cuotaN})` : (m.cuotas || 1) > 1 ? ` (1/${m.cuotas} cuotas, total ${M.orig(m)})` : ''} | ${L.cat(m.catId).nombre} | ${NECESIDAD[m.necesidad || 1]} | ${MEDIOS[m.medio] || m.medio}${m.recId ? ' | fijo' : ''}`));
    lines.push('\nAnalizá tendencias, señalá gastos evitables y decime cuánto podría invertir el mes que viene sin quedarme corto.');
    return lines.join('\n');
  },
};

/** Día de cobro: la app pregunta cuánto cobraste (hasta registrar el mes; "Después" lo posterga hasta mañana) */
function renderCobroBanner() {

  const ym = pend[pend.length - 1]; const prev = E.sueldo(D.addMonths(ym, -1)); const mes = D.monthName(ym).split(' ')[0];
  return `<div class="callout" style="margin-bottom:14px"><b>¿Cuánto cobraste el ${D.fmt(E.fechaCobro(ym))}?</b><br><span class="small muted">Sueldo de ${mes} · con el número real se recalcula todo.</span><div class="row" style="margin-top:10px;gap:8px"><button class="btn sm primary" data-act="cobro-cargar" data-id="${ym}">Cargar</button>${prev.monto ? `<button class="btn sm" data-act="cobro-igual" data-id="${ym}">Igual: ${M.f(prev.monto)}</button>` : ''}<button class="btn sm ghost" data-act="cobro-later" data-id="${ym}">Después</button></div></div>`;
}
/** Fijos del mes cuyo día ya pasó y no están confirmados: ¿quedaron igual o cambiaron? */
function renderFijosBanner() {

}
function renderCierreBanner() {

function viewResumen() {
  const ym = ui.mes; const isCur = ym === D.thisMonth();
  const c = E.consumo(ym), prev = E.consumo(D.addMonths(ym, -1)), ing = E.ingreso(ym), proj = E.proyeccion(ym);

  const dia = Number(D.today().slice(8, 10));
  const avg = E.promedioAcumulado(ym);

  const last6 = D.range(D.addMonths(ym, -5), 6).map(m => E.consumo(m).total);
  const margen = E.margen(ym); const mesN = D.monthName(ym).split(' ')[0];
  const projPct = margen.presupuesto ? proj.total / margen.presupuesto : 0; const pres = margen.presupuesto; const comp = margen.fijos + c.cuotas;

  let html = renderRespaldoBanner() + renderCobroBanner() + renderFijosBanner() + renderCierreBanner();

    { k: 'Promedio', v: deltaProm != null ? `${deltaProm >= 0 ? '+' : '\u2212'}${Math.round(Math.abs(deltaProm) * 100)} %` : '\u2014', cls: deltaProm == null ? '' : deltaProm > 0.05 ? 'neg' : deltaProm < -0.05 ? 'pos' : '' },
    { k: 'Compras', v: kARS(c.compras) },
    { k: 'Cuotas', v: kARS(c.cuotas) },
    { k: 'Fijos', v: kARS(margen.fijos) },
  ] });
  html += kpi({ label: isCur ? 'Te queda' : ym < D.thisMonth() ? 'Te qued\u00f3' : 'Quedar\u00e1', value: `<span class="${margen.queda < 0 ? 'neg' : ''}">${M.f(margen.queda)}</span>`, stats: [
    { k: 'Presup.', v: pres ? kARS(pres) : '\u2014' },
    { k: isCur ? 'Cierre' : 'Gastado', v: isCur ? kARS(proj.total) : kARS(c.total), cls: pres ? semPres((isCur ? proj.total : c.total) / pres) : '' },
    // pasado el 100 % se muestra el exceso (+16 %), no el total (116 %): Facu
    (() => { const r = pres ? (isCur ? proj.total : c.total) / pres : null; return r != null && r > 1 ? { k: isCur ? 'Te pas\u00e1s' : 'Te pasaste', v: `+${M.pct(r - 1, 0)}`, cls: 'neg' } : { k: 'Del presup.', v: r != null ? M.pct(r, 0) : '\u2014', cls: r != null ? semPres(r) : '' }; })(),
    { k: 'Por d\u00eda', v: isCur && margen.restantes ? kARS(Math.max(0, margen.queda) / margen.restantes) : '\u2014' },
  ] });
  html += `</div>`;

  // ritmo + margen
  const days = D.daysIn(ym); const labels = Array.from({ length: days }, (_, i) => String(i + 1));
  // Linea real = lo gastado con fecha hasta hoy (las cuotas cuentan desde el 1). Lo que tiene fecha posterior
  // (un fijo que se debita el 28, una compra cargada a futuro) va en la proyeccion, en su dia. Antes se sumaba
  // todo "hoy" y el cruce del presupuesto saltaba al dia de hoy cada vez que abrias la app (Facu, 27-sep).
  const hastaHoy = isCur ? dia : days;
  const cumReal = agg => { let a = 0; return labels.map((_, i) => { if (i + 1 > hastaHoy) return null; a += agg.byDay[i + 1] || 0; return a; }); };
  const curVals = cumReal(c);
  const avgVals = avg.vals ? avg.vals.slice(0, days) : labels.map(() => null);
  let projVals = labels.map(() => null);
  if (isCur && proj.pace != null) {
    const base = curVals[dia - 1] || 0; const fijosRest = Math.max(0, proj.fijo - c.fijo);
    let fut = 0;
    for (let i = dia - 1; i < days; i++) { if (i >= dia) fut += c.byDay[i + 1] || 0; projVals[i] = base + fut + (proj.pace + fijosRest / Math.max(1, proj.restantes)) * (i + 1 - dia); }
  }
  // cruce: el primer dia en que lo gastado (por fecha) paso el presupuesto; si todavia no, el dia en que lo pasaria
  // con lo que ya esta cargado a futuro mas el ritmo de compras. Asi el dia no cambia al abrir la app otro dia.
  let cruce = null;
  if (pres) { const iReal = curVals.findIndex(v => v != null && v >= pres); const iProj = iReal < 0 ? projVals.findIndex(v => v != null && v >= pres) : -1;
    if (iReal >= 0) cruce = { i: iReal, label: String(iReal + 1), color: 'var(--crit)', pasado: true }; else if (iProj >= 0) cruce = { i: iProj, label: String(iProj + 1), color: 'var(--warn)', pasado: false }; }
  html += `<div class="grid g-21 section">
    <div class="card"><div class="card-head"><h2>Ritmo del mes ${infoBtn('Acumulado del mes: las cuotas de compras anteriores cuentan desde el d\u00eda 1 y las compras en el d\u00eda que las hiciste. La l\u00ednea gris es tu promedio de los meses anteriores y la punteada, la proyecci\u00f3n al ritmo actual.')}</h2><span class="hint">${cruce ? `<span class="${cruce.pasado ? 'crit-text' : 'warn-text'}">${cruce.pasado ? `presupuesto cruzado el ${cruce.label}` : `a este ritmo lo cruzás el ${cruce.label}`}</span>` : ''}</span></div>
      ${ChartQ.reg(w => Charts.line({ w, labels, h: 230, cruce, tipTitle: i => `Día ${labels[i]}`, refY: margen.presupuesto || null, refLabel: margen.presupuesto ? 'Presupuesto' : '', series: [
        ...(avg.vals ? [{ name: `Promedio ${avg.n} ${avg.n === 1 ? 'mes' : 'meses'}`, color: 'var(--line-2)', values: avgVals }] : []),
        { name: D.monthName(ym).split(' ')[0], color: 'var(--accent)', values: curVals, area: true, strong: true },
        ...(isCur ? [{ name: 'Proyección', color: 'var(--accent)', values: projVals, dashed: true }] : []),
      ] }), 230)}
      ${Charts.legend([{ name: 'Este mes', color: 'var(--accent)', kind: 'line' }, ...(avg.vals ? [{ name: `Promedio (${avg.n} ${avg.n === 1 ? 'mes' : 'meses'})`, color: 'var(--line-2)', kind: 'line' }] : []), ...(isCur ? [{ name: 'Proyección', color: 'var(--accent)', kind: 'dash' }] : [])])}
    </div>
  </div>`;

  // insights + donut
  const ins = Insights.build(ym);
  const grupos = Object.entries(c.byGrupo).map(([g, v]) => ({ name: L.grupo(g).nombre, value: v, id: g })).sort((a, b) => b.value - a.value);
  // --- Donde se fue: mapa anidado (grupo = marco, categoria = bloque del tamaño de lo gastado)
  const tot = c.total || 0;
  let dondeHTML = '';
  if (grupos.length && tot > 0) {
    const gdat = grupos.map(g => ({ id: g.id, label: g.name, v: g.value, items: Object.entries(c.byCat).filter(([id]) => L.cat(id).grupo === g.id).map(([id, v]) => ({ id, label: L.cat(id).nombre, v, eleg: !L.cat(id).esencial })) }));
    dondeHTML = mapaAnidado(gdat, gdat.filter(g => g.v > 0).length > 5 ? 440 : 380);
  } else dondeHTML = empty({ kind: 'periodo', icon: 'cal', head: `Sin gastos en ${D.monthName(ym)}`, sub: 'Cuando cargues gastos, acá ves en qué se fue la plata.' });
  html += `<div class="grid g-21 section">
    <div class="card"><div class="card-head"><h2>Lectura del mes</h2><span class="hint">Alertas y patrones calculados sobre tus datos</span></div>${renderInsights(ins)}</div>
    <div class="card"><div class="card-head"><h2>Dónde se fue ${infoBtn('Cada marco es un grupo (Comida, Movilidad…) y cada bloque adentro, una categoría: el tamaño es lo que gastaste y cuanto más claro, más pesó. Tocá un bloque para ver esos gastos.')}</h2><span class="hint">${D.monthName(ym)}</span></div>${dondeHTML}</div>
  </div>`;

  // horizonte
  const hz = E.horizonte(D.thisMonth(), 12); const alerta = (Number(state.settings.alertaCuotasPct) || 60) / 100;
  html += `<div class="grid g-2 section">
    <div class="card"><div class="card-head"><h2>Próximos 12 meses</h2><span class="hint">Fijos + cuotas ya comprometidos vs presupuesto</span></div>
      ${ChartQ.reg(w => Charts.stacked({ w, h: 230, labels: hz.map(h => D.monthName(h.ym, true)), series: [{ name: 'Fijos', color: 'var(--c1)', values: hz.map(h => h.fijos) }, { name: 'Cuotas', color: 'var(--c4)', values: hz.map(h => h.cuotas) }], line: { name: 'Presupuesto', color: 'var(--ink-2)', values: hz.map(h => h.presupuesto || null) }, thresholdPct: alerta }), 230)}
      ${Charts.legend([{ name: 'Fijos', color: 'var(--c1)' }, { name: 'Cuotas', color: 'var(--c4)' }, { name: 'Presupuesto', color: 'var(--ink-2)', kind: 'dash' }, { name: `Alerta ${M.pct(alerta)}`, color: 'var(--warn)', kind: 'dash' }])}
    </div>
  </div>`;

  // últimas compras (solo lo cargado a mano en el mes visto: sin fijos ni cuotas)
  const last = state.movimientos.filter(m => !m.recId && m.fecha.startsWith(ym)).slice().sort((a, b) => b.fecha.localeCompare(a.fecha) || (b.id > a.id ? 1 : -1));
  html += `<div class="card section"><div class="card-head"><h2>Últimas compras</h2><div class="row" style="gap:8px"><span class="hint">Sin fijos ni cuotas</span><button class="btn ghost sm" data-go="movimientos">Ver todo el mes ${G.to}</button></div></div>${renderMovTable(last, { compact: true })}</div>`;
  return html;
}

function renderMargen(mg, proj) {
  if (!mg.presupuesto) return empty({ kind: 'setup', icon: 'chart', head: 'Falta tu presupuesto mensual', sub: 'Definilo y Gastos te avisa cuánto te queda por día y cuándo lo vas a cruzar.', btn: 'Definir presupuesto', go: 'config' });
  const isCur = mg.ym === D.thisMonth();
  const rows = [
    ['Presupuesto del mes', mg.presupuesto, 'in'],
    ['Fijos', -mg.fijos, 'var(--c1)'],
    ['Cuotas del mes', -mg.cuotas, 'var(--c4)'],
    [isCur ? 'Compras hasta hoy' : 'Compras', -mg.compras, 'var(--c7)'],
  ];
  let acc = 0; const maxV = Math.max(mg.presupuesto, mg.fijos + mg.cuotas + mg.compras, 1);
  const wf = rows.map(([l, v, color]) => { let left, width; if (color === 'in') { left = 0; width = v / maxV * 100; acc = v; } else { const from = acc; acc += v; left = Math.max(0, acc) / maxV * 100; width = (Math.max(from, 0) - Math.max(acc, 0)) / maxV * 100; } return `<div class="wf"><span>${l}</span><div class="bar"><i style="left:${left}%;width:${width}%;background:${color === 'in' ? 'var(--line-2)' : color}"></i></div><span class="n">${v < 0 ? '−' : ''}${M.f(Math.abs(v))}</span></div>`; }).join('');
  return `<div style="font-family:var(--font-display);font-size:30px;font-weight:900;letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:${mg.queda < 0 ? 'var(--crit-text)' : 'var(--ink)'}">${M.f(mg.queda)}</div>
    <p class="small muted aclara" style="margin:2px 0 12px">${mg.queda < 0 ? 'Ya te pasaste del presupuesto del mes.' : isCur ? `Podés gastar hasta ahí en lo que queda de ${D.monthName(mg.ym).split(' ')[0]}.` : 'Lo que quedó del presupuesto después de fijos, cuotas y compras.'}</p>
    <div class="waterfall">${wf}<div class="wf total"><span>Queda</span><div class="bar"><i style="left:0;width:${clamp(Math.max(0, mg.queda) / maxV * 100, 0, 100)}%;background:var(--accent)"></i></div><span class="n">${M.f(mg.queda)}</span></div></div>
    ${isCur && proj && proj.pace != null ? `<div class="callout ${mg.quedaProj < 0 ? 'crit' : ''}" style="margin-top:12px">Al ritmo actual (${M.f(proj.pace)}/día en compras) cerrás el mes ${mg.quedaProj < 0 ? `<b>${M.f(-mg.quedaProj)}</b> por encima del presupuesto.` : `con <b>${M.f(mg.quedaProj)}</b> sin usar.`}</div>` : ''}
    ${mg.ingreso ? `<p class="small muted" style="margin-top:10px">Sueldo ${M.f(mg.ingreso)} − presupuesto ${M.f(mg.presupuesto)} = <b>${M.f(mg.ahorro)}</b> para invertir / ahorrar.</p>` : ''}`;
}

function renderInsights(list) {
  if (!list.length) return empty({ kind: 'periodo', icon: 'list', head: 'Todo en orden', sub: 'Cuando algo se salga de lo normal lo vas a ver acá.' });
  return list.map(i => `<div class="insight ${i.level}"><div class="ic">${ICONS[i.icon] || ICONS.spark}</div><div><div class="t">${esc(i.title)}</div><p>${esc(i.text)}${i.view ? ` <a href="#" data-go="${i.view}">Ver ${G.to}</a>` : ''}${i.action === 'detectar' ? ` <a href="#" data-act="detectar">Revisar ${G.to}</a>` : ''}</p></div></div>`).join('');
}

/** Movimientos en mobile: encabezado de dia, descripcion con sus tags, categoria y medio abajo,
 *  monto a la derecha. Las filas de cuota pesan menos: no son una compra de hoy, son el eco de
 *  una compra vieja. Las acciones salen de la fila (en una lista de 48 movimientos eran 144 botones):
 *  tocar abre el detalle, que ya trae borrar y duplicar. */
function renderMovLista(rows, opts, key) {
  const DIAS = ['Domingo', 'Lunes', 'Martes', 'Mi\u00e9rcoles', 'Jueves', 'Viernes', 'S\u00e1bado'];
  const porDia = !opts.compact && key === 'fecha';
  let html = '<div class="mlist">';
  rows.forEach((m, i) => {
    if (porDia && (i === 0 || rows[i - 1].fecha !== m.fecha)) {
      const totDia = sum(rows.filter(x => x.fecha === m.fecha).map(E.rowAmount));
      const nDia = rows.filter(x => x.fecha === m.fecha).length;
      html += `<div class="mday"><span class="eyebrow">${DIAS[D.dow(m.fecha)].slice(0, 3)} ${m.fecha.slice(8, 10)}</span>${nDia > 1 ? `<b>${M.f(totDia)}</b>` : ''}</div>`;
    }
    const ars = E.rowAmount(m), total = M.toARS(m.monto, m.moneda), enCuotas = (m.cuotas || 1) > 1;
    const tags = [];
    if (m.cuotaRow) tags.push(`cuota ${m.cuotaIdx}/${m.cuotaN}`);
    else if (enCuotas) tags.push(`1/${m.cuotas} cuotas`);
    if (m.recId) tags.push('fijo');
    if (m.virtual) tags.push('estimado');
    const act = m.virtual ? `data-act="confirmar" data-id="${m.id}"`
      : m.cuotaRow ? `data-act="edit" data-id="${esc(m.origId)}"` : `data-act="edit" data-id="${esc(m.id)}"`;
    const sub = [L.cat(m.catId).nombre, medioLabel(m), ...tags.filter(t => t !== 'estimado')];
    if (m.moneda === 'USD') sub.push(`US$ ${fmtAcc(m.monto)}`);
    if (!porDia) sub.unshift(D.fmt(m.fecha));
    // el "(6 cuotas)" del nombre ya esta en la linea gris
    const nombre = String(m.desc || '').replace(/,\s*\d+\s*cuotas?\)/i, ')').replace(/\s*\(\s*\d+\s*cuotas?\s*\)\s*$/i, '');
    html += `<div class="mv ${m.cuotaRow ? 'cuota' : ''}${m.virtual ? ' virtual' : ''}" ${act}>
      <div style="min-width:0">
        <div class="m1"><b>${esc(nombre)}</b></div>
        <div class="m2">${sub.map(x => esc(x)).join(' \u00b7 ')}</div>
      </div>
      <div class="mm">${m.virtual ? '\u2248 ' : ''}${M.f(ars)}${enCuotas && !m.cuotaRow ? `<span class="sub">total ${M.f(total)}</span>` : ''}</div>
    </div>`;
  });
  return html + '</div>';
}

/* ---------- MOVIMIENTOS ---------- */
function renderMovTable(movs, opts = {}) {
  if (!movs.length) return opts.compact
    ? empty({ kind: 'periodo', icon: 'cal', head: `Sin compras en ${D.monthName(ui.mes).split(' ')[0]}`, sub: 'Las compras sueltas del mes aparecen acá, sin los fijos ni las cuotas.' })
    : empty({ kind: 'filtro', icon: 'search', head: 'Ningún movimiento coincide', sub: 'Probá ampliando el período o sacando alguna categoría.', btn: 'Limpiar filtros', action: 'clear-filters', ghost: true });
  const s = ui.sort; const key = s.key;
  const val = m => key === 'monto' ? E.rowAmount(m) : key === 'cat' ? L.cat(m.catId).nombre : key === 'nec' ? (m.necesidad || 1) : key === 'desc' ? norm(m.desc) : m.fecha + (m.id || '');
  const rows = opts.compact ? movs : movs.slice().sort((a, b) => { const va = val(a), vb = val(b); return (va > vb ? 1 : va < vb ? -1 : 0) * s.dir; });
  // en 390 px la tabla de siete columnas no entra: hoy se resolvia escondiendo columnas,
  // o sea que la tabla existia para no mostrarse. En mobile es una lista.
  if (window.innerWidth <= 700) return renderMovLista(rows, opts, key);
  const th = (k, label, cls = '') => opts.compact ? `<th class="${cls}">${label}</th>` : `<th class="${cls} ${key === k ? 'sorted' : ''}" data-sort="${k}">${label}${key === k ? (s.dir > 0 ? ' ' + G.up : ' ' + G.down) : ''}</th>`;
  return `<div class="table-wrap"><table class="responsive ${!opts.compact && key === 'fecha' ? 'grouped' : ''}"><thead><tr>${th('fecha', 'Fecha')}${th('desc', 'Descripción')}${th('cat', 'Categoría')}<th>Medio</th>${th('nec', 'Nec.')}${th('monto', 'Monto', 'r')}<th></th></tr></thead><tbody>
  ${rows.map((m, i) => { const ars = E.rowAmount(m); const dayHead = !opts.compact && key === 'fecha' && (i === 0 || rows[i - 1].fecha !== m.fecha) ? `<tr class="day"><td colspan="7">${['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'][D.dow(m.fecha)]} ${D.fmt(m.fecha)}<span>${M.f(sum(rows.filter(x => x.fecha === m.fecha).map(E.rowAmount)))}</span></td></tr>` : ''; const total = M.toARS(m.monto, m.moneda); const cuotas = (m.cuotas || 1) > 1; const t = L.tarjeta(m.tarjetaId); const pago = m.medio === 'tarjeta' && t && !m.cuotaRow ? E.primerPago(m) : null;
    return dayHead + `<tr class="${m.virtual ? 'virtual' : ''} ${m.cuotaRow ? 'cuota' : ''}" data-id="${m.id}">
      <td class="keep mono muted fecha" style="white-space:nowrap">${D.fmt(m.fecha)}</td>

      <td>${catChip(m.catId)}</td><td class="small">${esc(medioLabel(m))}</td><td>${necBadge(m.necesidad)}</td>

      <td class="r" style="white-space:nowrap">${m.virtual ? `<button class="btn sm" data-act="confirmar" data-id="${m.id}" title="Cargar el monto real de este mes">Confirmar</button>` : m.cuotaRow ? `<span class="row-actions"><button class="mini-btn" data-act="edit" data-id="${m.origId}" title="Ver la compra original">${ICONS.edit}</button></span>` : `<span class="row-actions"><button class="mini-btn" data-act="edit" data-id="${m.id}" title="Editar">${ICONS.edit}</button><button class="mini-btn" data-act="dup" data-id="${m.id}" title="Duplicar">${ICONS.copy}</button><button class="mini-btn" data-act="del" data-id="${m.id}" title="Borrar">${ICONS.trash}</button></span>`}</td></tr>`; }).join('')}
  </tbody></table></div>`;
}

/** Arriba de la lista de Gastos: velocimetro de cuanto fue innecesario, top 3 categorias y a donde se va la plata.
 *  Todo sale de "¿Hacia falta?" de cada gasto (se sugiere por la categoria y se puede cambiar a mano). */
function gastosAnalisis(c) {
  const tot = c.total || 0; if (tot <= 0) return '';
  const byNec = { 1: 0, 2: 0, 3: 0 }; for (const m of c.movs) byNec[m.necesidad || 1] += E.rowAmount(m);
  const pIn = byNec[3] / tot;
  // velocimetro: 0 = nada innecesario, 100 = todo innecesario
  const R = 78, cx = 95, cy = 88; const ang = p => Math.PI * (1 - p); const pt = (p, r = R) => [cx + r * Math.cos(ang(p)), cy - r * Math.sin(ang(p))];
  const arc = (p0, p1) => { const [x0, y0] = pt(p0), [x1, y1] = pt(p1); return `M${x0.toFixed(1)} ${y0.toFixed(1)} A${R} ${R} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`; };
  const ticks = [0, 0.25, 0.5, 0.75, 1].map(p => { const [a1, b1] = pt(p, R - 14), [a2, b2] = pt(p, R - 8); return `<line x1="${a1.toFixed(1)}" y1="${b1.toFixed(1)}" x2="${a2.toFixed(1)}" y2="${b2.toFixed(1)}" class="vt"/>`; }).join('');
  const [nx, ny] = pt(Math.min(1, pIn), R - 22);
  const velo = `<svg viewBox="0 0 190 100" class="velo"><path d="${arc(0, 1)}" class="vb"/>${pIn > 0.002 ? `<path d="${arc(0, Math.min(1, pIn))}" class="vf"/>` : ''}${ticks}
    <line x1="${cx}" y1="${cy}" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" class="vn"/><circle cx="${cx}" cy="${cy}" r="5" class="vc"/>
    </svg>`;
  // 1) macro: grupos en tarjetas (tono por tamaño) con aviso si ya pasaron su promedio de 3 meses
  const grupos = Object.entries(c.byGrupo).filter(([, v]) => v > 0).map(([g, v]) => ({ g: L.grupo(g), v, avg: sum(state.categorias.filter(k => L.grupo(k.grupo).id === g).map(k => E.promedioCat(k.id, ui.mes, 3))) })).sort((a, b) => b.v - a.v);
  const gmx = grupos.length ? grupos[0].v : 1;
  const gTile = x => { const d = x.avg > 0 ? x.v - x.avg : null; const alto = d != null && d > Math.max(1000, x.avg * 0.1); const bajo = d != null && d < -Math.max(1000, x.avg * 0.1);
    return `<div class="gt ${ui.gaGrupo === x.g.id ? 'on' : ''}" data-act="ga-grupo" data-id="${esc(x.g.id)}" style="background:rgba(255,255,255,${(0.05 + 0.20 * Math.pow(x.v / gmx, 0.8)).toFixed(3)})"><span class="n">${esc(x.g.nombre)}</span><b>${M.c(x.v)}</b><span class="p">${M.pct(x.v / tot, 0)} del mes</span><span class="p">${alto ? `<em class="neg">+${M.c(d)} vs promedio</em>` : bajo ? `<em class="pos">−${M.c(-d)} vs promedio</em>` : 'en tu promedio'}</span></div>`; };
  // grupo abierto: sus categorias debajo de su fila de tarjetas (1er toque abre, 2do toque va a los gastos)
  const gAb = grupos.find(x => x.g.id === ui.gaGrupo);
  const detalle = x => { const cs = Object.entries(c.byCat).filter(([id, v]) => v > 0 && L.grupo(L.cat(id).grupo).id === x.g.id).map(([id, v]) => ({ cat: L.cat(id), v, avg: E.promedioCat(id, ui.mes, 3) })).sort((a, b) => b.v - a.v); const cm = cs.length ? cs[0].v : 1;
    return `<div class="gt-det"><div class="gt-dh"><b>${esc(x.g.nombre)}</b><span>tocá una categoría para ver sus gastos · el grupo otra vez para cerrar</span></div>${cs.map(k => { const d = k.avg > 0 ? k.v - k.avg : null; const dd = d != null && Math.abs(d) > Math.max(1000, k.avg * 0.1) ? ` · <em class="${d > 0 ? 'neg' : 'pos'}">${d > 0 ? '+' : '−'}${M.c(Math.abs(d))}</em>` : '';
      return `<div class="dv" data-act="ver-cat" data-id="${esc(k.cat.id)}"><div class="dv1"><span>${esc(k.cat.nombre)}</span><b>${M.c(k.v)}</b></div><div class="dv2"><span class="dvb"><i style="width:${Math.max(2, k.v / cm * 100).toFixed(1)}%;background:rgba(255,255,255,${(0.18 + 0.62 * Math.pow(k.v / cm, 0.8)).toFixed(3)})"></i></span><em>${M.pct(k.v / x.v, 0)}${dd}</em></div></div>`; }).join('')}</div>`; };
  let tiles = ''; grupos.forEach((x, i) => { tiles += gTile(x); const finFila = i % 2 === 1 || i === grupos.length - 1; if (finFila && gAb && [grupos[i], grupos[i - (i % 2)]].includes(gAb)) tiles += detalle(gAb); });
  const macro = `<div class="card ga-g"><div class="ga-t">Por grupo ${infoBtn('Cuánto se fue en cada grupo este mes. En rojo, lo que ya gastaste de más contra tu promedio de los últimos 3 meses; en verde, lo que vas por debajo. Tocá un grupo para ver en qué categorías se fue (otra vez para cerrarlo) y una categoría para ver sus gastos.')}</div><div class="gts">${tiles}</div></div>`;
  // 3) ¿hacia falta?: compacto, una linea con un mini velocimetro
  const neces = `<div class="card ga-nec"><div class="ga-nec-b">${velo}<div class="vl1"><div><b class="in">${M.pct(pIn, 0)} innecesario</b> · ${M.c(byNec[3])} ${infoBtn('Sale de lo que marcás en cada gasto (Necesario, Útil o Innecesario). Al cargar se sugiere según la categoría y lo podés cambiar.')}</div><div class="vl2">Necesario ${M.c(byNec[1])} · Útil ${M.c(byNec[2])}</div></div></div></div>`;
  // 2) micro: top 3 categorias y el resto en lista (sin repetir el top)
  const cats = Object.entries(c.byCat).map(([id, v]) => ({ cat: L.cat(id), v })).filter(x => x.v > 0).sort((a, b) => b.v - a.v);
  const top = cats.slice(0, 3);
  const top3 = `<div class="ga-top">${top.map((x, i) => `<div class="card ga-tc" data-act="ver-cat" data-id="${esc(x.cat.id)}"><span class="r">${i + 1}</span><span class="n">${esc(x.cat.nombre)}</span><b>${M.c(x.v)}</b><em>${M.pct(x.v / tot, 0)} del mes</em></div>`).join('')}</div>`;
  const mx = cats.length ? cats[0].v : 1; const resto = cats.slice(3); const todas = !!ui.gastosTodas; const lista = todas ? resto : resto.slice(0, 6);
  const tono = v => (0.18 + 0.62 * Math.pow(v / mx, 0.8)).toFixed(3);
  const donde = !resto.length ? '' : `<div class="card ga-dv"><div class="ga-t">Y el resto</div>${lista.map(x => `<div class="dv" data-act="ver-cat" data-id="${esc(x.cat.id)}"><div class="dv1"><span>${esc(x.cat.nombre)}</span><b>${M.c(x.v)}</b></div><div class="dv2"><span class="dvb"><i style="width:${Math.max(2, x.v / mx * 100).toFixed(1)}%;background:rgba(255,255,255,${tono(x.v)})"></i></span><em>${M.pct(x.v / tot, 0)}</em></div></div>`).join('')}
    ${resto.length > 6 ? `<button type="button" class="dv-mas" data-act="gastos-todas">${todas ? 'ver menos' : `ver las ${resto.length}`}</button>` : ''}</div>`;
  return `<div class="ga">${macro}<div class="ga-t ga-sep">Por categoría</div>${top3}${donde}${neces}</div>`;
}
function viewMovimientos() {
  const ym = ui.mes; const f = ui.filtros; const c = E.consumo(ym);
  let movs = c.movs;
  if (f.q) { const q = norm(f.q); movs = movs.filter(m => norm(m.desc).includes(q) || norm(m.notas || '').includes(q)); }
  if (f.cat) movs = movs.filter(m => m.catId === f.cat);
  if (f.grupo) movs = movs.filter(m => L.cat(m.catId).grupo === f.grupo);
  if (f.medio) movs = movs.filter(m => f.medio.startsWith('t:') ? m.tarjetaId === f.medio.slice(2) : m.medio === f.medio);
  if (f.nec) movs = movs.filter(m => String(m.necesidad || 1) === f.nec);
  if (f.tipo === 'fijos') movs = movs.filter(m => m.recId); else if (f.tipo === 'variables') movs = movs.filter(m => !m.recId && !m.cuotaRow); else if (f.tipo === 'cuotas') movs = movs.filter(m => m.cuotaRow || (m.cuotas || 1) > 1);
  const total = sum(movs.map(E.rowAmount)); const innec = sum(movs.filter(m => (m.necesidad || 1) === 3).map(E.rowAmount));
  const sel = (id, opts, cur, ph) => `<select class="input sm" data-filter="${id}"><option value="">${ph}</option>${opts.map(o => `<option value="${o[0]}" ${cur === o[0] ? 'selected' : ''}>${esc(o[1])}</option>`).join('')}</select>`;
  const compras = sum(movs.filter(m => !m.recId && !m.cuotaRow && !((m.cuotas || 1) > 1)).map(E.rowAmount));
  const cuotas = sum(movs.filter(m => m.cuotaRow || (m.cuotas || 1) > 1).map(E.rowAmount));
  const fijos = sum(movs.filter(m => m.recId).map(E.rowAmount));
  const kARS = v => `$ ${abrevARS(v)}`;
  return `<div class="gh-top"><div class="gh-big">${M.f(total)}</div><div class="gh-sub">${movs.length} movimiento${movs.length === 1 ? '' : 's'}${Object.values(f).some(Boolean) ? ' con los filtros' : ` en ${D.monthName(ym).split(' ')[0]}`} ${infoBtn('Cada mes muestra sus compras, sus fijos y las cuotas de compras anteriores que caen en \u00e9l (el monto de la cuota, no el total). Los montos con \u2248 en amarillo son fijos estimados: tocalos para confirmar el monto real.')}</div></div>
    ${(() => { // filtro activo: se ve arriba y se saca con un toque (antes habia que bajar hasta los chips)
      const et = []; if (f.grupo) et.push(L.grupo(f.grupo).nombre); if (f.cat) et.push(L.cat(f.cat).nombre); if (f.q) et.push(`"${f.q}"`); if (f.tipo) et.push({ fijos: 'Fijos', variables: 'Compras', cuotas: 'Cuotas' }[f.tipo] || f.tipo); if (f.medio) et.push(f.medio.startsWith('t:') ? (L.tarjeta(f.medio.slice(2)) || {}).nombre || 'Tarjeta' : (MEDIOS[f.medio] || f.medio)); if (f.nec) et.push(NECESIDAD[f.nec] || '');
      return et.length ? `<div class="gh-filtro"><span>${et.map(esc).join(' \u00b7 ')}</span><button type="button" data-act="clear-filters">Ver todo</button></div>` : ''; })()}
    <div class="gh-stats"><div><span>Compras</span><b>${kARS(compras)}</b></div><div><span>Cuotas</span><b>${kARS(cuotas)}</b></div><div><span>Fijos</span><b>${kARS(fijos)}</b></div></div>
    ${Object.values(f).some(Boolean) ? '' : gastosAnalisis(c)}
    <div class="gh-list">
    ${(() => {
      const chip = (k, v, label) => `<button type="button" data-act="filtro" data-id="${k}:${v}" class="${(f[k] || '') === v ? 'on' : ''}">${esc(label)}</button>`;
      return `<div class="chips filtros">
        <input class="input sm" placeholder="Buscar…" data-filter="q" value="${esc(f.q || '')}">
        ${chip('tipo', '', 'Todo')}${chip('tipo', 'variables', 'Compras')}${chip('tipo', 'fijos', 'Fijos')}${chip('tipo', 'cuotas', 'Cuotas')}
        ${chip('nec', '3', 'Innecesario')}
        ${sel('cat', state.categorias.map(c => [c.id, c.nombre]), f.cat, 'Categoría')}
        ${sel('medio', [['tarjeta', 'Tarjeta (todas)'], ...state.tarjetas.map(t => ['t:' + t.id, t.nombre]), ['debito', 'Débito'], ['efectivo', 'Efectivo'], ['transferencia', 'Transferencia / MP']], f.medio, 'Medio de pago')}
        ${Object.values(f).some(Boolean) ? '<button type="button" class="limpiar" data-act="clear-filters">Limpiar</button>' : ''}
      </div>`;
    })()}
    ${renderMovTable(movs)}
    ${Object.values(f).some(Boolean) ? '' : viajesDelMes(c)}
  </div>${Object.values(f).some(Boolean) ? '' : viajesCard()}`;
}
/** gastos de viajes que caen este mes: aparte, no suman al gasto del mes (van al viaje y al año) */
function viajesDelMes(c) {
  if (!c.viajeMovs.length) return '';
  const porV = {}; for (const m of c.viajeMovs) (porV[m.viajeId] = porV[m.viajeId] || []).push(m);
  return Object.entries(porV).map(([id, ms]) => { const v = L.viaje(id); return `<div class="vj-mes"><div class="vj-h" data-act="viaje" data-id="${id}"><span>${ICONS.plane || '\u2708'} <b>${esc(v.nombre)}</b>${v.desde ? ` \u00b7 ${D.fmt(v.desde)}${v.hasta && v.hasta !== v.desde ? ` al ${D.fmt(v.hasta)}` : ''}` : ''}</span><span class="mono">${M.f(sum(ms.map(E.rowAmount)))}</span></div><div class="vj-sub">Viaje: no suma al gasto de este mes, s\u00ed al del a\u00f1o</div>${renderMovTable(ms)}</div>`; }).join('');
}

      <td class="r" style="white-space:nowrap"><span class="row-actions"><button class="mini-btn" data-act="edit-rec" data-id="${r.id}" title="Editar">${ICONS.edit}</button><button class="mini-btn" data-act="toggle-rec" data-id="${r.id}" title="${r.activo === false ? 'Reactivar' : 'Pausar'}">${ICONS.clock}</button><button class="mini-btn" data-act="del-rec" data-id="${r.id}" title="Borrar">${ICONS.trash}</button></span></td></tr>`).join('')}</tbody></table></div>` : empty({ kind: 'setup', icon: 'list', head: 'Todavía no cargaste gastos fijos', sub: 'Alquiler, seguro, suscripciones. Una vez cargados el pronóstico los descuenta solo.', btn: 'Agregar gasto fijo', action: 'new-rec' })}
  </div>`;
  return html;
}

function renderSimulacion(res, monto) {

  <div class="sim-result"><div class="box"><div class="l">Cuota mensual</div><div class="v">${M.f(res[0].cuota)}</div></div><div class="box"><div class="l">Última cuota</div><div class="v">${D.monthName(res[res.length - 1].ym, true)}</div></div><div class="box"><div class="l">Libre en el peor mes</div><div class="v" style="color:${peor.libre < 0 ? 'var(--crit-text)' : 'inherit'}">${M.f(peor.libre)}</div></div></div>

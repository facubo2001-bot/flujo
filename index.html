        <div class="field"><label>Cuotas</label><input class="input" id="sim-cuotas" inputmode="numeric" value="6"></div>
        <div class="field"><label>Tarjeta</label><select class="input" id="sim-tarjeta">${state.tarjetas.map(t => `<option value="${t.id}">${esc(t.nombre)}</option>`).join('')}<option value="">Débito / contado</option></select></div>
        <div class="field"><label>Mes de compra</label><input class="input" id="sim-mes" type="month" value="${ym}"></div>
      </div>
      <div class="row" style="margin-top:12px"><button class="btn primary" data-act="simular">Simular</button><span class="small muted">Compara contra lo que ya tenés comprometido.</span></div>
      <div id="sim-out" class="section"></div>
    </div>
  </div>`;
  const det = Smart.detectarRecurrentes();
  html += `<div class="card section"><div class="card-head"><h2>Gastos fijos y suscripciones</h2><button class="btn sm" data-act="new-rec">${ICONS.plus} Nuevo fijo</button></div>
    ${det.length ? `<div class="callout amber" style="margin-bottom:12px"><b>Se repiten todos los meses:</b> ${det.map(d => `<button class="btn sm" style="margin:3px 4px 0 0" data-act="rec-from" data-id="${d.m.id}">${esc(d.desc)} · ~${M.c(d.avg)}</button>`).join('')}<div class="small muted" style="margin-top:6px">Tocá uno para convertirlo en gasto fijo y que entre en el pronóstico.</div></div>` : ''}
    ${recs.length ? `<div class="table-wrap"><table class="responsive"><thead><tr><th>Concepto</th><th>Categoría</th><th>Medio</th><th>Día</th><th class="r">Monto / mes</th><th></th></tr></thead><tbody>${recs.map(r => `<tr data-rec="${r.id}" style="cursor:pointer;${r.activo === false ? 'opacity:.5' : ''}">

      <td>${catChip(r.catId)}</td><td class="small">${esc(medioLabel(r))}</td><td class="mono">${r.dia || 1}</td><td class="amount r">${M.f(M.toARS(r.monto, r.moneda))}${r.moneda === 'USD' ? `<span class="sub">${M.orig(r)}</span>` : ''}</td>

function renderSimulacion(res, monto) {

  <div class="sim-result"><div class="box"><div class="l">Cuota mensual</div><div class="v">${M.f(res[0].cuota)}</div></div><div class="box"><div class="l">Última cuota</div><div class="v">${D.monthName(res[res.length - 1].ym, true)}</div></div><div class="box"><div class="l">Libre en el peor mes</div><div class="v" style="color:${peor.libre < 0 ? 'var(--crit-text)' : 'inherit'}">${M.f(peor.libre)}</div></div></div>

}


/* ===================== FLUJO — views B: tarjetas, plan, tendencias, config ===================== */

const CARD_COLORS = ['#1F4E79', '#5B2C6F', '#7A3E1D', '#1E5E4A', '#3B3B6B', '#7A1F3D'];

/* ---------- TARJETAS Y PAGOS ---------- */
function viewTarjetas() {
  const hoy = D.today(); const ym = ui.mes;
  if (!state.tarjetas.length) return `<div class="card"><div class="empty">Todavía no cargaste tarjetas. <button class="btn primary sm" data-act="new-card" style="margin-left:8px">${ICONS.plus} Agregar tarjeta</button></div></div>`;
  let html = `<div class="grid g-3">`;
  state.tarjetas.forEach((t, i) => {
    const now = E.cardNow(t, hoy);
    const consumoPeriodo = sum(E.data().pieces.filter(p => p.m.medio === 'tarjeta' && p.m.tarjetaId === t.id && p.mesPago === now.mesPago && p.idx === 1 && !p.m.recId).map(p => p.montoARS));
    const prox = E.proximoPago(t, hoy);
    const cerrando = E.resumen(t.id, now.mesPago);
    const lim = Number(t.limite) || 0; const uso = lim ? (prox.ym === now.mesPago ? cerrando.total : prox.total + cerrando.total) / lim : 0;
    const cierreDesde = D.addDays(E.fechaCierre(t.id, D.addMonths(now.mesPago, -1)), 1);
    html += `<div class="tcard" data-act="edit-card" data-id="${t.id}" style="cursor:pointer;background:linear-gradient(135deg,${t.color || CARD_COLORS[i % CARD_COLORS.length]},${t.color || CARD_COLORS[i % CARD_COLORS.length]}cc)">
      <div class="tname"><span>${esc(t.nombre)}<span style="font-weight:400;opacity:.8;font-size:13px"> ${esc(t.banco || '')}</span></span><button class="mini-btn" style="color:#fff" data-act="edit-card" data-id="${t.id}">${ICONS.edit}</button></div>
      <div><div style="font-size:12px;opacity:.85">Período ${D.fmt(cierreDesde)} – ${D.fmt(now.cierre)} · cierra en ${now.diasAlCierre} día${now.diasAlCierre === 1 ? '' : 's'}</div><div class="tbig">${M.f(cerrando.total)}</div></div>
      <div class="tmeta"><span>Consumo nuevo<b>${M.f(consumoPeriodo)}</b></span><span>Cuotas y fijos<b>${M.f(cerrando.total - consumoPeriodo)}</b></span>${prox.ym !== now.mesPago ? `<span>A pagar el ${D.fmt(prox.fecha)}<b>${M.f(prox.total)}</b></span>` : ''}</div>
      ${lim ? `<div style="margin-top:8px"><div class="row between" style="font-size:11px;opacity:.9"><span>Límite ${M.c(lim)}</span><span>${M.pct(uso)}</span></div><div class="meter" style="background:rgba(255,255,255,.2);height:6px;margin-top:3px"><i style="width:${clamp(uso * 100, 0, 100)}%;background:#fff"></i></div></div>` : ''}
    </div>`;
  });
  html += `<button class="card" data-act="new-card" style="display:grid;place-items:center;color:var(--ink-3);font-weight:600;min-height:150px;border-style:dashed;cursor:pointer">${ICONS.plus} Agregar tarjeta</button></div>`;

  // Plan de pago del mes
  const meses = D.range(ym, 3);
  html += `<div class="card section"><div class="card-head"><h2>Plan de pago</h2><span class="hint">Qué vence, cuándo y de dónde sale</span></div>
    <div class="table-wrap"><table><thead><tr><th>Cierre</th><th>Tarjeta</th><th class="r">Monto</th><th>Sale de</th><th>Pagado</th></tr></thead><tbody>
    ${meses.flatMap(m => state.tarjetas.map(t => { const r = E.resumen(t.id, m); if (!r.total && m !== ym) return ''; const p = state.pagos.find(p => p.tarjetaId === t.id && p.mes === m) || {};
      return `<tr style="${p.pagado ? 'opacity:.55' : ''}"><td class="mono" style="white-space:nowrap">${D.fmt(E.fechaCierre(t.id, m), { year: true })}</td><td><b style="font-weight:500">${esc(t.nombre)}</b><span class="sub">${r.pieces.length} ítems · vence ${D.fmt(r.fecha)}</span></td><td class="amount r"><b>${M.f(r.total)}</b></td>
      <td><select class="input sm" data-pago="${t.id}|${m}"><option value="">Elegir cuenta…</option>${state.cuentas.map(c => `<option value="${c.id}" ${p.cuentaId === c.id ? 'selected' : ''}>${esc(c.nombre)}</option>`).join('')}</select></td>
      <td><label class="switch"><input type="checkbox" data-pagado="${t.id}|${m}" ${p.pagado ? 'checked' : ''}><span>${p.pagado ? 'Sí' : 'No'}</span></label></td></tr>`; })).join('')}
    </tbody></table></div>
    <p class="small muted" style="margin-top:8px">Tocá una tarjeta arriba para editar sus datos (cierre, vencimiento, límite). Los resúmenes futuros incluyen las cuotas que ya conocés.</p></div>`;

  // Cuentas
  const pend = state.pagos.filter(p => !p.pagado && p.cuentaId);
  html += `<div class="grid g-2 section">
    <div class="card"><div class="card-head"><h2>De dónde sale la plata</h2><button class="btn sm" data-act="new-cuenta">${ICONS.plus} Cuenta</button></div>
      ${state.cuentas.length ? state.cuentas.map(c => { const saldo = M.toARS(Number(c.saldo) || 0, c.moneda); const asig = sum(pend.filter(p => p.cuentaId === c.id).map(p => E.resumen(p.tarjetaId, p.mes).total)); const desp = saldo - asig + (c.esSueldo ? (Number(state.settings.ingreso) || 0) : 0);
        return `<div class="list-item"><div><b style="font-weight:500">${esc(c.nombre)}</b>${c.esSueldo ? ' <span class="tag">cobro el sueldo acá</span>' : ''}<span class="sub small muted">${esc(c.tipo || '')}${asig ? ` · ${M.f(asig)} asignados a resúmenes` : ''}</span></div><div class="row" style="gap:4px"><div style="text-align:right"><div class="mono">${M.f(saldo)}${c.moneda === 'USD' ? `<span class="sub">US$ ${fmtUSD.format(Number(c.saldo) || 0)}</span>` : ''}</div>${asig || c.esSueldo ? `<div class="small ${desp < 0 ? 'pill crit' : 'muted'}">tras pagar${c.esSueldo ? ' + sueldo' : ''}: ${M.f(desp)}</div>` : ''}</div><button class="mini-btn" data-act="edit-cuenta" data-id="${c.id}">${ICONS.edit}</button></div></div>`; }).join('') : '<div class="empty">Agregá tus cuentas (caja de ahorro, Mercado Pago, dólares, Balanz) para planificar con qué pagás cada resumen.</div>'}
    </div>
    <div class="card"><div class="card-head"><h2>Detalle del resumen</h2><div class="row" style="gap:6px"><select class="input sm" id="res-card">${state.tarjetas.map(t => `<option value="${t.id}" ${ui.resCard === t.id ? 'selected' : ''}>${esc(t.nombre)}</option>`).join('')}</select><select class="input sm" id="res-mes">${D.range(D.addMonths(ym, -2), 8).map(m => `<option value="${m}" ${(ui.resMes || E.cardNow(state.tarjetas[0], hoy).mesPago) === m ? 'selected' : ''}>cierre ${D.fmt(E.fechaCierre((ui.resCard || state.tarjetas[0].id), m), { year: true })}</option>`).join('')}</select></div></div>
      <div id="res-detalle">${renderResumenDetalle(ui.resCard || state.tarjetas[0].id, ui.resMes || E.cardNow(state.tarjetas[0], hoy).mesPago)}</div>
    </div>
  </div>`;
  return html;
}

function renderResumenDetalle(tarjetaId, ym) {
  const r = E.resumen(tarjetaId, ym); const t = L.tarjeta(tarjetaId);
  if (!r.pieces.length) return '<div class="empty">Sin consumos en este resumen.</div>';
  const rows = r.pieces.slice().sort((a, b) => a.m.fecha.localeCompare(b.m.fecha));
  const cuotas = sum(rows.filter(p => p.idx > 1).map(p => p.montoARS));
  return `<div class="row between small muted" style="margin-bottom:8px"><span>Cierra ${D.fmt(E.fechaCierre(tarjetaId, ym), { year: true })} · vence ${D.fmt(r.fecha, { year: true })} · ${rows.length} ítems</span><span>Cuotas de compras anteriores: <b class="mono">${M.f(cuotas)}</b></span></div>
  <div class="table-wrap"><table><thead><tr><th>Compra</th><th>Concepto</th><th class="r">Importe</th></tr></thead><tbody>${rows.map(p => `<tr><td class="mono muted" style="white-space:nowrap">${D.fmt(p.m.fecha)}</td><td>${esc(p.m.desc)}${p.n > 1 ? ` <span class="tag">${p.idx}/${p.n}</span>` : ''}${p.m.recId ? ' <span class="tag">fijo</span>' : ''}</td><td class="amount r">${M.f(p.montoARS)}</td></tr>`).join('')}<tr><td></td><td><b>Total</b></td><td class="amount r"><b>${M.f(r.total)}</b></td></tr></tbody></table></div>`;
}

/* ---------- PLAN: presupuesto e inversión ---------- */
function viewPlan() {
  const ym = ui.mes; const ing = E.ingreso(ym), c = E.consumo(ym), inv = E.invertido(ym); const mg = E.margen(ym);
  const meta = mg.ahorro;
  const libre = ing.total - c.total;
  const steps = [
    { l: 'Ingreso', v: ing.total, color: 'var(--s3)', kind: 'in' },
    { l: 'Fijos', v: -mg.fijos, color: 'var(--s1)' },
    { l: 'Cuotas del mes', v: -c.cuotas, color: 'var(--s4)' },
    { l: 'Compras', v: -c.compras, color: 'var(--s2)' },
    { l: 'Libre', v: libre, color: 'var(--accent)', kind: 'total' },
  ];
  const maxV = Math.max(ing.total, c.total, 1);
  let acc = 0;
  const wf = steps.map(s => { let left, width; if (s.kind === 'in' || s.kind === 'total') { left = 0; width = Math.max(0, s.v) / maxV * 100; } else { const start = acc + s.v; left = Math.max(0, start) / maxV * 100; width = Math.abs(s.v) / maxV * 100; } if (s.kind !== 'total') acc += s.v; return `<div class="wf ${s.kind === 'total' ? 'total' : ''}"><span>${s.l}</span><div class="bar"><i style="left:${left}%;width:${width}%;background:${s.color}"></i></div><span class="n">${s.v < 0 ? '−' : ''}${M.f(Math.abs(s.v))}</span></div>`; }).join('');

  const hz12 = D.range(D.addMonths(D.thisMonth(), -11), 12).map(m => { const cc = E.consumo(m); const ii = E.ingreso(m).total; return { ym: m, gasto: cc.total, inv: E.invertido(m), ingreso: ii, tasa: ii ? E.invertido(m) / ii : null }; });
  const tasa3 = hz12.slice(-3).filter(h => h.ingreso); const tasaProm = tasa3.length ? sum(tasa3.map(h => h.tasa)) / tasa3.length : 0;
  let html = `<div class="grid g-kpi">
    ${kpi({ label: `Libre en ${D.monthName(ym).split(' ')[0]}`, value: M.f(libre), sub: `<span>Ingreso ${M.f(ing.total)} − gastos ${M.f(c.total)}</span>`, cls: 'accent' })}
    ${kpi({ label: 'Para invertir / ahorrar', value: M.f(meta), sub: `<span>sueldo − presupuesto de ${M.c(mg.presupuesto)}</span>` })}
    ${kpi({ label: 'Invertido este mes', value: M.f(inv), sub: ing.total ? `<span class="pill ${inv >= meta && meta ? 'good' : inv > 0 ? 'warn' : 'neutral'}">${M.pct(inv / ing.total)} del sueldo</span>` : '' })}
    ${kpi({ label: 'Tasa de inversión (3 meses)', value: M.pct(tasaProm), sub: `<span>promedio invertido / ingreso</span>` })}
  </div>`;
  html += `<div class="grid g-2 section">
    <div class="card"><div class="card-head"><h2>Cascada del mes</h2><span class="hint">Sueldo → fijos → cuotas → compras → libre</span></div><div class="waterfall">${wf}</div>
      <div class="divider"></div>
      <div class="row between"><div><div class="small muted">${ym < D.thisMonth() ? 'Quedó para invertir' : 'Podés invertir'}</div><div style="font-family:var(--font-display);font-size:22px;font-weight:600">${M.f(Math.max(0, libre))}</div><div class="small muted">objetivo ${M.f(meta)}${libre > meta ? ` · sobran ${M.f(libre - meta)} del presupuesto` : libre < meta ? ` · faltan ${M.f(meta - libre)}` : ''}</div></div><button class="btn primary sm" data-act="new-inv">${ICONS.invest} Registrar inversión</button></div>
    </div>
    <div class="card"><div class="card-head"><h2>Ingreso, gasto e inversión</h2><span class="hint">Últimos 12 meses</span></div>
      ${ChartQ.reg(w => Charts.stacked({ w, h: 230, labels: hz12.map(h => D.monthName(h.ym, true)), series: [{ name: 'Gastos del mes', color: 'var(--s2)', values: hz12.map(h => h.gasto) }, { name: 'Invertido', color: 'var(--s3)', values: hz12.map(h => h.inv) }], line: { name: 'Ingreso', color: 'var(--ink-2)', values: hz12.map(h => h.ingreso || null) } }), 230)}
      ${Charts.legend([{ name: 'Gasto', color: 'var(--s2)' }, { name: 'Invertido', color: 'var(--s3)' }, { name: 'Ingreso', color: 'var(--ink-2)', kind: 'dash' }])}
    </div>
  </div>`;
  // presupuestos
  const cats = state.categorias.slice().sort((a, b) => (c.byCat[b.id] || 0) - (c.byCat[a.id] || 0));
  html += `<div class="grid g-2 section">
    <div class="card"><div class="card-head"><h2>Presupuesto por categoría</h2><span class="hint">Dejá en blanco las que no querés limitar</span></div>
      <div class="table-wrap"><table><thead><tr><th>Categoría</th><th class="r">Este mes</th><th class="r">Prom. 3m</th><th class="r">Presupuesto</th></tr></thead><tbody>
      ${cats.map(cat => { const v = c.byCat[cat.id] || 0; const avg = E.promedioCat(cat.id, ym, 3); const r = cat.presupuesto ? v / cat.presupuesto : 0; return `<tr><td><span class="row nowrap" style="gap:6px;flex-wrap:nowrap"><i class="swatch" style="background:${L.catColor(cat.id)}"></i>${esc(cat.nombre)}</span>${cat.presupuesto ? `<div class="meter ${r > 1 ? 'crit' : r > .8 ? 'warn' : ''}" style="height:4px;margin-top:4px;max-width:160px"><i style="width:${clamp(r * 100, 0, 100)}%"></i></div>` : ''}</td><td class="amount r">${v ? M.f(v) : '<span class="muted">—</span>'}</td><td class="amount r muted">${avg ? M.f(avg) : '—'}</td><td class="r"><input class="input sm mono" style="width:120px;text-align:right" inputmode="numeric" data-budget="${cat.id}" value="${cat.presupuesto ? fmtARS.format(cat.presupuesto) : ''}" placeholder="—"></td></tr>`; }).join('')}
      </tbody></table></div>
      <p class="small muted" style="margin-top:8px">Total presupuestado: <b class="mono">${M.f(sum(state.categorias.map(c => Number(c.presupuesto) || 0)))}</b> · fijos estimados: <b class="mono">${M.f(E.fijosEstimados(ym))}</b></p>
    </div>
    <div class="card"><div class="card-head"><h2>Portfolio · inversiones</h2><span class="hint">todo lo registrado</span></div>
      ${(() => { const list = state.inversiones.slice().sort((a, b) => M.toARS(b.monto, b.moneda) - M.toARS(a.monto, a.moneda)); if (!list.length) return '<div class="empty">Registrá lo que aportás a Balanz, BTC o plazo fijo para medir tu tasa de ahorro real.</div>'; const tot = sum(list.map(i => M.toARS(i.monto, i.moneda))); return list.map(i => `<div class="list-item"><div><b style="font-weight:500">${esc(i.destino || i.desc || 'Inversión')}</b><span class="sub small muted">${esc(i.desc && i.destino ? i.desc : D.fmt(i.fecha))}</span></div><div class="row" style="gap:4px"><span class="mono">${i.moneda === 'USD' ? 'US$ ' + (Number(i.monto) || 0).toLocaleString('es-AR', { maximumFractionDigits: 0 }) : M.f(i.monto)}</span><button class="mini-btn" data-act="del-inv" data-id="${i.id}">${ICONS.trash}</button></div></div>`).join('') + `<div class="list-item" style="border-top:1px solid var(--line)"><b>Total invertido</b><b class="mono">${M.f(tot)}</b></div>`; })()}
      <div class="divider"></div>
      <div class="card-head"><h3>Ingresos extra</h3><button class="btn sm" data-act="new-ing">${ICONS.plus} Ingreso</button></div>
      ${(() => { const list = state.ingresos.filter(i => D.ym(i.fecha) === ym); return list.length ? list.map(i => `<div class="list-item"><div><b style="font-weight:500">${esc(i.desc || 'Ingreso')}</b><span class="sub small muted">${D.fmt(i.fecha)}</span></div><div class="row" style="gap:4px"><span class="mono">${M.f(M.toARS(i.monto, i.moneda))}</span><button class="mini-btn" data-act="del-ing" data-id="${i.id}">${ICONS.trash}</button></div></div>`).join('') : `<p class="small muted">Sueldo base: <b class="mono">${M.f(ing.base)}</b>. Aguinaldo, freelance o ventas van acá.</p>`; })()}
    </div>
  </div>`;
  return html;
}

/* ---------- TENDENCIAS ---------- */
function viewTendencias() {
  const n = ui.trendRange || 6; const ym = ui.mes;
  const months = D.range(D.addMonths(ym, -(n - 1)), n);
  const cons = months.map(m => E.consumo(m));
  const labels = months.map(m => D.monthName(m, true));
  const gruposUsados = GRUPOS.filter(g => cons.some(c => c.byGrupo[g.id]));
  let html = `<div class="row between" style="margin-bottom:14px"><div class="seg">${[3, 6, 12].map(k => `<button class="${n === k ? 'on' : ''}" data-range="${k}">${k} meses</button>`).join('')}</div><span class="small muted">Hasta ${D.monthName(ym)}</span></div>`;
  html += `<div class="card"><div class="card-head"><h2>Evolución por grupo</h2><span class="hint">Consumo por fecha de compra</span></div>
    ${ChartQ.reg(w => Charts.stacked({ w, h: 260, labels, highlight: n - 1, series: gruposUsados.map(g => ({ name: g.nombre, color: L.slotColor(g.slot), values: cons.map(c => c.byGrupo[g.id] || 0) })), line: state.settings.ingreso ? { name: 'Ingreso', color: 'var(--ink-2)', values: months.map(m => E.ingreso(m).total) } : null }), 260)}
    ${Charts.legend(gruposUsados.map(g => ({ name: g.nombre, color: L.slotColor(g.slot) })))}
  </div>`;
  // necesidad + medio
  const necSeries = [1, 2, 3].map(k => ({ name: NECESIDAD[k], color: k === 1 ? 'var(--seq4)' : k === 2 ? 'var(--seq2)' : 'var(--s8)', values: cons.map(c => c.byNec[k]) }));
  const innecPct = cons.map(c => c.total ? c.byNec[3] / c.total : null);
  html += `<div class="grid g-2 section">
    <div class="card"><div class="card-head"><h2>Necesario vs innecesario</h2><span class="hint">Según cómo lo marcaste</span></div>
      ${ChartQ.reg(w => Charts.stacked({ w, h: 220, labels, series: necSeries }), 220)}${Charts.legend(necSeries.map(s => ({ name: s.name, color: s.color })))}
      <div class="row between small" style="margin-top:8px"><span class="muted">Innecesario, % del total:</span><span class="mono">${innecPct.map((p, i) => `${labels[i].split(' ')[0]} ${p == null ? '—' : M.pct(p)}`).join(' · ')}</span></div>
    </div>
    <div class="card"><div class="card-head"><h2>Total, compras, fijos y cuotas</h2></div>
      ${ChartQ.reg(w => Charts.line({ w, h: 220, labels, series: [{ name: 'Total', color: 'var(--accent)', values: cons.map(c => c.total || null), strong: true, area: true }, { name: 'Compras', color: 'var(--s2)', values: cons.map(c => c.count ? c.compras : null) }, { name: 'Fijos', color: 'var(--s1)', values: cons.map(c => c.count ? c.fijo : null) }, { name: 'Cuotas', color: 'var(--s4)', values: cons.map(c => c.count ? c.cuotas : null) }], refY: state.settings.ingreso || null, refLabel: 'Ingreso' }), 220)}
      ${Charts.legend([{ name: 'Total', color: 'var(--accent)', kind: 'line' }, { name: 'Compras', color: 'var(--s2)', kind: 'line' }, { name: 'Fijos', color: 'var(--s1)', kind: 'line' }, { name: 'Cuotas', color: 'var(--s4)', kind: 'line' }])}
    </div>
  </div>`;
  // tabla categorías mes vs anterior vs prom
  const cur = cons[n - 1], prev = cons[n - 2] || { byCat: {} };
  const catRows = state.categorias.map(cat => ({ cat, v: cur.byCat[cat.id] || 0, p: prev.byCat[cat.id] || 0, avg: E.promedioCat(cat.id, ym, 3) })).filter(r => r.v || r.p || r.avg).sort((a, b) => b.v - a.v);
  // top comercios
  const all = cons.flatMap(c => c.movs).filter(m => !m.recId);
  const byDesc = {}; for (const m of all) { if (m.cuotaRow) continue; const k = norm(m.desc); if (!byDesc[k]) byDesc[k] = { desc: m.desc, n: 0, total: 0, cat: m.catId }; byDesc[k].n++; byDesc[k].total += M.toARS(m.monto, m.moneda); }
  const top = Object.values(byDesc).sort((a, b) => b.total - a.total).slice(0, 10);
  html += `<div class="grid g-2 section">
    <div class="card"><div class="card-head"><h2>Categorías: mes a mes</h2></div>
      <div class="table-wrap"><table><thead><tr><th>Categoría</th><th class="r">${labels[n - 1]}</th><th class="r">${labels[n - 2] || 'Ant.'}</th><th class="r">Prom. 3m</th><th class="r">Δ vs prom.</th></tr></thead><tbody>
      ${catRows.map(r => { const d = r.avg ? (r.v - r.avg) / r.avg : null; return `<tr><td><span class="row nowrap" style="gap:6px;flex-wrap:nowrap"><i class="swatch" style="background:${L.catColor(r.cat.id)}"></i>${esc(r.cat.nombre)}</span></td><td class="amount r">${M.f(r.v)}</td><td class="amount r muted">${M.f(r.p)}</td><td class="amount r muted">${M.f(r.avg)}</td><td class="r">${d == null ? '—' : `<span class="pill ${d > 0.25 ? 'crit' : d > 0.1 ? 'warn' : d < -0.1 ? 'good' : 'neutral'}">${d > 0 ? '+' : ''}${M.pct(d)}</span>`}</td></tr>`; }).join('')}
      </tbody></table></div></div>
    <div class="card"><div class="card-head"><h2>Dónde gastás más</h2><span class="hint">Top comercios, ${n} meses, sin fijos (compras a valor total)</span></div>
      <div class="table-wrap"><table><thead><tr><th>Comercio</th><th class="r">Veces</th><th class="r">Total</th><th class="r">Promedio</th></tr></thead><tbody>
      ${top.map(t => `<tr><td><b style="font-weight:500">${esc(t.desc)}</b><span class="sub">${L.cat(t.cat).nombre}</span></td><td class="mono r">${t.n}</td><td class="amount r">${M.f(t.total)}</td><td class="amount r muted">${M.f(t.total / t.n)}</td></tr>`).join('') || '<tr><td colspan="4" class="empty">Sin datos</td></tr>'}
      </tbody></table></div></div>
  </div>`;
  // heat + weekday
  const wd = [0, 0, 0, 0, 0, 0, 0], wn = [0, 0, 0, 0, 0, 0, 0];
  for (const m of all) { if (m.cuotaRow) continue; const d = (D.dow(m.fecha) + 6) % 7; wd[d] += E.rowAmount(m); wn[d]++; }
  const wdMax = Math.max(...wd, 1);
  const medios = Object.entries(cur.byMedio).map(([k, v]) => ({ name: k === 'tarjeta' ? 'Tarjeta' : MEDIOS[k] || k, value: v })).sort((a, b) => b.value - a.value);
  html += `<div class="grid g-3 section">
    <div class="card"><div class="card-head"><h2>Calendario</h2><span class="hint">${D.monthName(ym)}</span></div>${Charts.heat(ym, cur.byDay)}</div>
    <div class="card"><div class="card-head"><h2>Por día de la semana</h2><span class="hint">Total en ${n} meses</span></div>
      ${['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'].map((d, i) => `<div class="meter-row"><div class="l"><span>${d}</span></div><div class="v"><b class="mono">${M.f(wd[i])}</b> <span class="muted">· ${wn[i]}</span></div><div class="meter"><i style="width:${wd[i] / wdMax * 100}%;background:var(--s1)"></i></div></div>`).join('')}
    </div>
    <div class="card"><div class="card-head"><h2>Medio de pago</h2><span class="hint">${D.monthName(ym, true)}</span></div>
      ${medios.length ? medios.map((m, i) => `<div class="meter-row"><div class="l"><span>${esc(m.name)}</span></div><div class="v"><b class="mono">${M.f(m.value)}</b> <span class="muted">${M.pct(m.value / cur.total)}</span></div><div class="meter"><i style="width:${m.value / cur.total * 100}%;background:var(--s7)"></i></div></div>`).join('') : '<div class="empty">Sin datos</div>'}
      ${state.tarjetas.length > 1 ? `<div class="divider"></div>${state.tarjetas.map(t => { const v = sum(cur.movs.filter(m => m.tarjetaId === t.id).map(m => M.toARS(m.monto, m.moneda))); return `<div class="row between small"><span>${esc(t.nombre)}</span><b class="mono">${M.f(v)}</b></div>`; }).join('')}` : ''}
    </div>
  </div>`;
  return html;
}

    </div>
  </div>`;
  html += `<div class="grid g-2 section">

      <div class="table-wrap"><table><thead><tr><th>Nombre</th><th>Grupo</th><th>Tipo</th><th></th></tr></thead><tbody>${state.categorias.map(c => { const used = state.movimientos.some(m => m.catId === c.id) || state.recurrentes.some(r => r.catId === c.id); return `<tr><td><span class="row nowrap" style="gap:6px;flex-wrap:nowrap"><i class="swatch" style="background:${L.catColor(c.id)}"></i>${esc(c.nombre)}</span></td><td class="small">${esc(L.grupo(c.grupo).nombre)}</td><td class="small">${c.tipo}</td><td class="r" style="white-space:nowrap"><button class="mini-btn" data-act="edit-cat" data-id="${c.id}">${ICONS.edit}</button>${!used && c.id !== 'otros' ? `<button class="mini-btn" data-act="del-cat" data-id="${c.id}">${ICONS.trash}</button>` : ''}</td></tr>`; }).join('')}</tbody></table></div>

        <div class="list-item"><div><b style="font-weight:500">Exportar respaldo</b><span class="sub small muted">Descarga todo en JSON (${state.movimientos.length} movimientos)</span></div><button class="btn sm" data-act="export">${ICONS.download} Exportar</button></div>
        <div class="list-item"><div><b style="font-weight:500">Importar respaldo</b><span class="sub small muted">Reemplaza los datos actuales por un JSON exportado</span></div><label class="btn sm">${ICONS.upload} Importar<input type="file" accept="application/json" id="import-file" class="hidden"></label></div>
        <div class="list-item"><div><b style="font-weight:500">Importar movimientos desde CSV</b><span class="sub small muted">Columnas: fecha, descripción, monto, categoría (opcional), cuotas (opcional)</span></div><label class="btn sm">${ICONS.upload} CSV<input type="file" accept=".csv,text/csv" id="import-csv" class="hidden"></label></div>
        <div class="list-item"><div><b style="font-weight:500">Datos de ejemplo</b><span class="sub small muted">Carga 5 meses inventados para ver cómo funciona todo</span></div><button class="btn sm" data-act="demo">Cargar</button></div>
        <div class="list-item"><div><b style="font-weight:500">Borrar todo</b><span class="sub small muted">Elimina movimientos, fijos, tarjetas y ajustes</span></div><button class="btn sm danger" data-act="reset">Borrar</button></div>
      </div>
      <div class="divider"></div>
      <p class="small muted">${(() => { const b = BUILD; const v = /^\d{12}/.test(b) ? `${b.slice(6, 8)}/${b.slice(4, 6)}/${b.slice(0, 4)} ${b.slice(8, 10)}:${b.slice(10, 12)} UTC` : '—'; const u = state.updatedAt ? new Date(state.updatedAt).toLocaleString('es-AR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—'; return `App actualizada al ${v} · tus datos modificados por última vez el ${u}`; })()}</p>
      <p class="small muted">Estado: ${Persist.status === 'ok' ? 'guardado en la nube (esta página se actualiza sola en todos tus dispositivos).' : Persist.status === 'local' ? 'guardado solo en este dispositivo. Exportá un respaldo cada tanto.' : Persist.status === 'err' ? 'error al guardar: ' + esc(Persist.lastError) : 'sincronizando…'}</p>
    </div>
  </div>`;
  return html;
}


/* ===================== FLUJO — modal & forms ===================== */

const Modal = {
  onSubmit: null,
  open({ title, body, submit = 'Guardar', extra = '', onSubmit, wide = false }) {
    Modal.onSubmit = onSubmit; $('#modal').onchange = null; $('#modal').oninput = null;
    $('#modal').innerHTML = `<div class="grabber"></div><div class="m-head"><h2>${esc(title)}</h2><button class="icon-btn" data-act="close" style="border:0" aria-label="Cerrar">${ICONS.x}</button></div><div class="m-body">${body}</div><div class="m-foot">${extra}<div class="right"><button class="btn" data-act="close">Cancelar</button>${submit ? `<button class="btn primary" data-act="submit">${submit}</button>` : ''}</div></div>`;
    $('#modal').style.width = wide ? 'min(820px,100%)' : '';
    $('#overlay').classList.add('open');
    const first = $('#modal .m-body [autofocus]'); if (first) { try { first.focus({ preventScroll: true }); } catch (e) { first.focus(); } }
  },
  close() { $('#overlay').classList.remove('open'); Modal.onSubmit = null; },
  submit() { if (Modal.onSubmit && Modal.onSubmit() !== false) Modal.close(); },
  val(id) { const el = $('#' + id); return el ? el.value : ''; },
  choice(id) { const el = $(`#${id} button.on`); return el ? el.dataset.v : ''; },
};
const F = {
  field: (label, inner, help = '', cls = '') => `<div class="field ${cls}"><label>${label}</label>${inner}${help ? `<span class="help">${help}</span>` : ''}</div>`,
  input: (id, val = '', attrs = '') => `<input class="input" id="${id}" value="${esc(val)}" ${attrs}>`,
  select: (id, opts, cur) => `<select class="input" id="${id}">${opts.map(o => `<option value="${o[0]}" ${String(cur) === String(o[0]) ? 'selected' : ''}>${esc(o[1])}</option>`).join('')}</select>`,
  choice: (id, opts, cur, cls = '') => `<div class="choice" id="${id}">${opts.map(o => `<button type="button" data-v="${o[0]}" class="${String(cur) === String(o[0]) ? 'on ' + (o[2] || '') : ''}" data-cls="${o[2] || ''}">${esc(o[1])}</button>`).join('')}</div>`,
  catOpts: () => state.categorias.map(c => [c.id, c.nombre]),
  medioOpts: () => [...state.tarjetas.map(t => ['t:' + t.id, t.nombre]), ['debito', 'Débito'], ['efectivo', 'Efectivo'], ['transferencia', 'Transf. / MP']],
  medioVal: (m) => m.medio === 'tarjeta' ? 't:' + (m.tarjetaId || (state.tarjetas[0] || {}).id) : (m.medio || 'debito'),
  parseMedio: (v) => v.startsWith('t:') ? { medio: 'tarjeta', tarjetaId: v.slice(2) } : { medio: v, tarjetaId: undefined },
};

/* choice buttons toggle */
document.addEventListener('click', e => { const b = e.target.closest('.choice button'); if (!b) return; const box = b.parentElement; box.querySelectorAll('button').forEach(x => { x.className = ''; }); b.className = 'on ' + (b.dataset.cls || ''); box.dispatchEvent(new CustomEvent('change', { bubbles: true })); });

/* ---------- movimiento ---------- */
function formMov(m = null, opts = {}) {
  const isNew = !m || opts.dup; const base = m ? { ...m } : { fecha: ui.mes === D.thisMonth() ? D.today() : D.dateIn(ui.mes, Math.min(Number(D.today().slice(8, 10)), D.daysIn(ui.mes))), moneda: 'ARS', cuotas: 1, necesidad: 2, medio: state.tarjetas.length ? 'tarjeta' : 'debito', tarjetaId: (state.tarjetas[0] || {}).id, catId: 'otros' };
  if (opts.dup) { delete base.id; base.fecha = D.today(); }
  const virtual = m && m.virtual;
  const freq = {}; for (const x of state.movimientos) { if (x.fecha >= D.addDays(D.today(), -120)) freq[x.catId] = (freq[x.catId] || 0) + 1; }
  const topCats = state.categorias.slice().sort((p, q) => (freq[q.id] || 0) - (freq[p.id] || 0)).slice(0, 8);
  if (!topCats.find(c => c.id === base.catId)) topCats.unshift(L.cat(base.catId));
  const descs = [...new Set(state.movimientos.slice().sort((p, q) => q.fecha.localeCompare(p.fecha)).map(x => x.desc))].slice(0, 60);
  const tipoBar = isNew && !virtual ? `<div class="seg full" style="width:fit-content;margin:0 auto 4px"><button class="on" type="button">Gasto</button><button type="button" data-act="switch-inv">Inversión</button></div>` : '';
  const body = `<div class="form-grid">
    ${tipoBar}
    <div class="full"><div class="big-amount"><span class="cur" id="f-cursym">${base.moneda === 'USD' ? 'US$' : '$'}</span><input id="f-monto" inputmode="decimal" autocomplete="off" value="${base.monto != null ? (base.moneda === 'USD' ? String(base.monto).replace('.', ',') : fmtARS.format(base.monto)) : ''}" placeholder="0" ${isNew && !virtual ? 'autofocus' : ''}></div><div class="row" style="justify-content:center;gap:6px">${F.choice('f-moneda', [['ARS', 'Pesos'], ['USD', 'Dólares']], base.moneda)}</div></div>
    ${F.field('Descripción', `<input class="input" id="f-desc" list="f-desc-list" value="${esc(base.desc || '')}" placeholder="Carrefour, Netflix, nafta…" autocomplete="off" ${!isNew || virtual ? 'autofocus' : ''}><datalist id="f-desc-list">${descs.map(d => `<option value="${esc(d)}">`).join('')}</datalist><div class="suggest" id="f-sug"></div>`, '', 'full')}
    ${F.field('Categoría', `<div class="chips" id="f-catchips">${topCats.map(c => `<button type="button" data-act="pick-cat" data-id="${c.id}" class="${c.id === base.catId ? 'on' : ''}"><i style="background:${L.catColor(c.id)}"></i>${esc(c.nombre)}</button>`).join('')}</div>${F.select('f-cat', F.catOpts(), base.catId)}`, '', 'full')}
    ${F.field('Fecha', `<div class="row" style="flex-wrap:nowrap;gap:6px"><button type="button" class="btn sm" data-act="set-date" data-id="hoy">Hoy</button><button type="button" class="btn sm" data-act="set-date" data-id="ayer">Ayer</button>${F.input('f-fecha', base.fecha, 'type="date"')}</div>`, '', 'full')}
    ${F.field('Medio de pago', F.choice('f-medio', F.medioOpts(), F.medioVal(base)), '', 'full')}
    ${F.field('Cuotas', `<div class="row" style="gap:6px;flex-wrap:nowrap">${F.choice('f-cuotas', [[1, 'Un pago'], [3, '3'], [6, '6'], [12, '12']], [1, 3, 6, 12].includes(Number(base.cuotas) || 1) ? (base.cuotas || 1) : '')}<input class="input sm mono" id="f-cuotas-n" inputmode="numeric" placeholder="otra" style="width:70px" value="${[1, 3, 6, 12].includes(Number(base.cuotas) || 1) ? '' : base.cuotas}"></div>`, '<span id="f-pago-hint"></span>', 'full')}
    ${F.field('¿Hacía falta?', F.choice('f-nec', [[1, 'Necesario'], [2, 'Útil'], [3, 'Innecesario', 'n3']], base.necesidad || 2), '', 'full')}
    ${F.field('Notas', F.input('f-notas', base.notas || '', 'placeholder="opcional"'), '', 'full')}
    <details class="full" ${base.primerPago ? 'open' : ''}><summary class="small muted" style="cursor:pointer">Ajustes avanzados</summary><div class="form-grid" style="margin-top:8px">${F.field('Primer resumen (mes de pago)', F.input('f-primer', base.primerPago || '', 'type="month"'), 'Dejalo vacío para calcularlo por el cierre de la tarjeta')}</div></details>
  </div>`;
  Modal.open({ title: virtual ? `Confirmar ${base.desc} de ${D.monthName(base.mesRec, true)}` : isNew ? 'Nuevo gasto' : 'Editar gasto', body, submit: isNew || virtual ? 'Guardar gasto' : 'Guardar cambios',
    extra: !isNew && !virtual ? `<button class="btn danger" data-act="del-from-modal" data-id="${m.id}">Borrar</button>` : '',
    onSubmit: () => {
      const desc = Modal.val('f-desc').trim(); const monto = M.parse(Modal.val('f-monto'));
      if (!desc) { toast('Falta la descripción'); return false; } if (!monto) { toast('Falta el monto'); return false; }
      const medio = F.parseMedio(Modal.choice('f-medio') || 'debito');
      const cuotasN = Number(Modal.val('f-cuotas-n')) || Number(Modal.choice('f-cuotas')) || 1;
      const rec = { id: isNew ? uid() : m.id, desc, monto, moneda: Modal.choice('f-moneda') || 'ARS', fecha: Modal.val('f-fecha') || D.today(), catId: Modal.val('f-cat'), ...medio, cuotas: medio.medio === 'tarjeta' ? clamp(cuotasN, 1, 60) : 1, necesidad: Number(Modal.choice('f-nec')) || 2, notas: Modal.val('f-notas').trim() || undefined, primerPago: Modal.val('f-primer') || undefined };
      if (virtual) { rec.recId = m.recId; rec.mesRec = m.mesRec; } else if (m && m.recId && !opts.dup) { rec.recId = m.recId; rec.mesRec = m.mesRec; }
      if (isNew || virtual) state.movimientos.push(rec); else Object.assign(m, rec);
      if (!rec.recId) Smart.learn(rec);
      Persist.save(); toast(isNew ? 'Gasto guardado' : 'Cambios guardados'); render();

    const cuotasBox = $('#f-cuotas').parentElement.parentElement; cuotasBox.style.opacity = medio.medio === 'tarjeta' ? 1 : .45;
    if (medio.medio === 'tarjeta' && L.tarjeta(medio.tarjetaId) && fecha) { const cy = E.cycle(L.tarjeta(medio.tarjetaId), fecha); const n = Number(Modal.val('f-cuotas-n')) || Number(Modal.choice('f-cuotas')) || 1; const cuota = M.parse(Modal.val('f-monto')) / n; const over = Modal.val('f-primer'); const first = over || cy.mesPago; hint.textContent = `Cae en el resumen que vence ${over ? 'en ' + D.monthName(first, true) : D.fmt(cy.vencimiento, { year: true })}${n > 1 ? ` · ${n} cuotas de ${M.f(M.toARS(cuota, Modal.choice('f-moneda') || 'ARS'))} hasta ${D.monthName(D.addMonths(first, n - 1), true)}` : ''}`; }
    else hint.textContent = medio.medio === 'tarjeta' ? '' : 'Sale de la cuenta el mismo día';
    $('#f-cursym').textContent = (Modal.choice('f-moneda') || 'ARS') === 'USD' ? 'US$' : '$';
    const cid = $('#f-cat').value; $$('#f-catchips button').forEach(b => b.classList.toggle('on', b.dataset.id === cid));

  $('#f-cat').addEventListener('change', () => { $('#f-cat').dataset.touched = '1'; });
  $('#f-monto').addEventListener('blur', () => { const el = $('#f-monto'); const v = M.parse(el.value); if (!v) return; el.value = (Modal.choice('f-moneda') || 'ARS') === 'USD' ? String(v).replace('.', ',') : fmtARS.format(v); });
  $('#f-cuotas-n').addEventListener('input', () => { if ($('#f-cuotas-n').value) $$('#f-cuotas button').forEach(b => b.className = ''); });
  $('#f-cuotas').addEventListener('change', () => { $('#f-cuotas-n').value = ''; });
  // suggestions while typing
  let sugTimer;
  $('#f-desc').addEventListener('input', () => { clearTimeout(sugTimer); sugTimer = setTimeout(() => {
    const s = Smart.suggest($('#f-desc').value); const box = $('#f-sug'); if (!s) { box.innerHTML = ''; return; }
    const c = L.cat(s.catId);
    const auto = !$('#f-cat').dataset.touched && isNew;
    if (auto) { $('#f-cat').value = s.catId; const nb = $(`#f-nec button[data-v="${s.necesidad || 2}"]`); if (nb) nb.click(); upd(); }
    box.innerHTML = `<button type="button" id="f-apply">${auto ? '✓ ' : ''}${s.src === 'historial' ? `Como otras ${s.n} veces: ` : 'Sugerido: '}${esc(c.nombre)} · ${NECESIDAD[s.necesidad] || 'Útil'}${s.medio ? ' · ' + (s.medio === 'tarjeta' ? (L.tarjeta(s.tarjetaId) || {}).nombre || 'tarjeta' : MEDIOS[s.medio]) : ''}${s.monto && !$('#f-monto').value ? ' · ' + M.orig(s) : ''}</button>`;
    $('#f-apply').onclick = () => { $('#f-cat').value = s.catId; const nb = $(`#f-nec button[data-v="${s.necesidad || 2}"]`); if (nb) nb.click(); if (s.medio) { const mv = s.medio === 'tarjeta' ? 't:' + s.tarjetaId : s.medio; const mb = $(`#f-medio button[data-v="${mv}"]`); if (mb) mb.click(); } if (s.monto && !$('#f-monto').value) { $('#f-monto').value = s.moneda === 'USD' ? String(s.monto).replace('.', ',') : fmtARS.format(s.monto); const cb = $(`#f-moneda button[data-v="${s.moneda || 'ARS'}"]`); if (cb) cb.click(); } box.innerHTML = ''; upd(); };
  }, 180); });

/* ---------- recurrente ---------- */
function formRec(r = null, fromMov = null) {
  const base = r ? { ...r } : fromMov ? { desc: fromMov.desc, monto: fromMov.monto, moneda: fromMov.moneda, catId: fromMov.catId, medio: fromMov.medio, tarjetaId: fromMov.tarjetaId, dia: Number(fromMov.fecha.slice(8, 10)), necesidad: fromMov.necesidad, desde: D.thisMonth() } : { moneda: 'ARS', medio: state.tarjetas.length ? 'tarjeta' : 'debito', tarjetaId: (state.tarjetas[0] || {}).id, catId: 'subs', dia: 1, necesidad: 1, desde: D.thisMonth() };

    ${F.field('Concepto', F.input('r-desc', base.desc || '', 'placeholder="Seguro del auto, Claude, alquiler…" autofocus'), '', 'full')}
    ${F.field('Monto por mes', `<div class="amount-input"><span class="cur">${base.moneda === 'USD' ? 'US$' : '$'}</span><input class="input" id="r-monto" inputmode="decimal" value="${base.monto != null ? (base.moneda === 'USD' ? String(base.monto).replace('.', ',') : fmtARS.format(base.monto)) : ''}"></div>`)}
    ${F.field('Moneda', F.choice('r-moneda', [['ARS', 'Pesos'], ['USD', 'Dólares']], base.moneda || 'ARS'))}
    ${F.field('Categoría', F.select('r-cat', F.catOpts(), base.catId))}
    ${F.field('Día del mes', F.input('r-dia', base.dia || 1, 'inputmode="numeric"'))}
    ${F.field('Medio de pago', F.choice('r-medio', F.medioOpts(), F.medioVal(base)), '', 'full')}
    ${F.field('¿Hacía falta?', F.choice('r-nec', [[1, 'Necesario'], [2, 'Útil'], [3, 'Innecesario', 'n3']], base.necesidad || 1))}
    ${F.field('Activo', `<label class="switch"><input type="checkbox" id="r-activo" ${base.activo === false ? '' : 'checked'}><span>Se repite todos los meses</span></label>`)}
    ${F.field('Desde', F.input('r-desde', base.desde || '', 'type="month"'))}
    ${F.field('Hasta (opcional)', F.input('r-hasta', base.hasta || '', 'type="month"'), 'Para cuotas fijas de un préstamo, por ejemplo')}
  </div>`;
  Modal.open({ title: r ? 'Editar gasto fijo' : 'Nuevo gasto fijo', body, onSubmit: () => {
    const desc = Modal.val('r-desc').trim(); const monto = M.parse(Modal.val('r-monto')); if (!desc || !monto) { toast('Completá concepto y monto'); return false; }
    const rec = { id: r ? r.id : uid(), desc, monto, moneda: Modal.choice('r-moneda') || 'ARS', catId: Modal.val('r-cat'), dia: clamp(Number(Modal.val('r-dia')) || 1, 1, 31), ...F.parseMedio(Modal.choice('r-medio') || 'debito'), necesidad: Number(Modal.choice('r-nec')) || 1, activo: $('#r-activo').checked, desde: Modal.val('r-desde') || undefined, hasta: Modal.val('r-hasta') || undefined };
    if (r) Object.assign(r, rec); else state.recurrentes.push(rec);

    }
    Persist.save(); toast('Gasto fijo guardado'); render();
  } });
}

  async export() {
    const json = JSON.stringify(state, null, 1); const filename = `gastos-${D.today()}.json`;
    let dl = null; try { if (window.claude && window.claude.use) dl = await window.claude.use('downloads'); } catch (e) {}
    if (dl) { try { await dl.save({ filename, data: json }); toast('Respaldo guardado'); return; } catch (e) { if (e && e.code === 'unavailable') dl = null; else { toast('No se guardó el respaldo'); return; } } }
    if (!window.claude && navigator.canShare) { try { const file = new File([json], filename, { type: 'application/json' }); if (navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'Respaldo Gestor de gastos' }); state.settings.lastBackup = D.today(); Persist.save(); toast('Respaldo compartido'); return; } } catch (e) { if (e && e.name === 'AbortError') return; } }
    if (!window.claude) { const blob = new Blob([json], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); state.settings.lastBackup = D.today(); Persist.save(); return; }
    Modal.open({ title: 'Respaldo', body: `<p class="small muted" style="margin-bottom:8px">Copiá este texto y guardalo en un archivo .json:</p><textarea class="input textarea" style="min-height:300px" readonly>${esc(json)}</textarea>`, submit: '' });
  },
  'copiar-resumen'() { const txt = Insights.resumenTexto(ui.mes); const done = () => toast('Resumen copiado. Pegalo en el chat.'); if (navigator.clipboard) navigator.clipboard.writeText(txt).then(done, () => Actions.mostrarTexto(txt)); else Actions.mostrarTexto(txt); },
  mostrarTexto(txt) { Modal.open({ title: 'Resumen para Claude', body: `<textarea class="input textarea" style="min-height:300px" readonly>${esc(txt)}</textarea>`, submit: '' }); },
};

/* ---------- global events ---------- */
document.addEventListener('click', e => {
  const go_ = e.target.closest('[data-go]'); if (go_) { e.preventDefault(); go(go_.dataset.go); return; }
  const mes = e.target.closest('[data-mes]'); if (mes) { const n = Number(mes.dataset.mes); ui.mes = n === 0 ? D.thisMonth() : D.addMonths(ui.mes, n); lastView = null; render(); return; }
  const cur = e.target.closest('[data-cur]'); if (cur) { ui.cur = cur.dataset.cur; render(); return; }
  const th = e.target.closest('th[data-sort]'); if (th) { const k = th.dataset.sort; if (ui.sort.key === k) ui.sort.dir *= -1; else ui.sort = { key: k, dir: k === 'monto' || k === 'fecha' ? -1 : 1 }; render(); return; }
  const rg = e.target.closest('[data-range]'); if (rg) { ui.trendRange = Number(rg.dataset.range); render(); return; }
  if (e.target.closest('#fab')) { formMov(); return; }
  if (e.target.id === 'overlay') { Modal.close(); return; }
  const act = e.target.closest('[data-act]'); if (act) { e.preventDefault(); const fn = Actions[act.dataset.act]; if (fn) fn(act.dataset.id); return; }
  const tr = e.target.closest('tr[data-id]'); if (tr && !e.target.closest('button,select,input,a,label')) { const id = tr.dataset.id; if (id.startsWith('v:')) Actions.confirmar(id); else Actions.edit(id.split('#')[0]); return; }
  const trr = e.target.closest('tr[data-rec]'); if (trr && !e.target.closest('button,select,input,a,label')) { Actions['edit-rec'](trr.dataset.rec); return; }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.filter) { ui.filtros[t.dataset.filter] = t.value; render(); const again = $(`[data-filter="${t.dataset.filter}"]`); if (again && t.dataset.filter === 'q') { again.focus(); again.setSelectionRange(again.value.length, again.value.length); } return; }
  if (t.dataset.setting) { const k = t.dataset.setting; const v = ['ingreso', 'tc', 'presupuesto'].includes(k) ? M.parse(t.value) : ['diaCobro', 'alertaCuotasPct'].includes(k) ? Number(t.value) || 0 : t.value.trim(); state.settings[k] = v; Persist.save(); if (k !== 'nombre') render(); return; }
  if (t.dataset.budget) { const c = state.categorias.find(c => c.id === t.dataset.budget); if (c) { c.presupuesto = M.parse(t.value); Persist.save(); render(); } return; }
  if (t.dataset.pago) { const [tarjetaId, mes] = t.dataset.pago.split('|'); let p = state.pagos.find(p => p.tarjetaId === tarjetaId && p.mes === mes); if (!p) { p = { tarjetaId, mes }; state.pagos.push(p); } p.cuentaId = t.value; Persist.save(); render(); return; }
  if (t.dataset.pagado) { const [tarjetaId, mes] = t.dataset.pagado.split('|'); let p = state.pagos.find(p => p.tarjetaId === tarjetaId && p.mes === mes); if (!p) { p = { tarjetaId, mes }; state.pagos.push(p); } p.pagado = t.checked; Persist.save(); render(); return; }
  if (t.id === 'res-card' || t.id === 'res-mes') { ui.resCard = $('#res-card').value; ui.resMes = $('#res-mes').value; $('#res-detalle').innerHTML = renderResumenDetalle(ui.resCard, ui.resMes); return; }
  if (t.id === 'import-file') { const f = t.files[0]; if (!f) return; f.text().then(txt => { try { const j = JSON.parse(txt); if (!j || !j.v) throw new Error(); confirmar(`Importar ${j.movimientos?.length || 0} movimientos y reemplazar los datos actuales?`, () => { state = Persist.migrate(j); Persist.save(); toast('Datos importados'); go('resumen'); }, 'Importar'); } catch (e) { toast('El archivo no es un respaldo válido'); } }); return; }
  if (t.id === 'import-csv') { const f = t.files[0]; if (!f) return; f.text().then(importarCSV); return; }
});
document.addEventListener('input', e => { const t = e.target; if (t.dataset.filter === 'q') { clearTimeout(window._qT); window._qT = setTimeout(() => { ui.filtros.q = t.value; const pos = t.selectionStart; render(); const again = $('[data-filter="q"]'); if (again) { again.focus(); again.setSelectionRange(pos, pos); } }, 250); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#overlay').classList.contains('open')) { Modal.close(); return; }
  if ($('#overlay').classList.contains('open')) { if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA' && !e.target.closest('.choice')) { e.preventDefault(); Modal.submit(); } return; }
  if (['INPUT', 'SELECT', 'TEXTAREA'].includes(e.target.tagName)) return;
  if (e.key === 'n' || e.key === 'N') formMov();
});
let rzT, lastW = window.innerWidth; window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => { if (window.innerWidth === lastW) return; lastW = window.innerWidth; if (!$('#overlay').classList.contains('open')) render(); }, 250); });
window.addEventListener('beforeunload', () => { if (Persist.dirty) { Persist.local(); } });
document.addEventListener('visibilitychange', () => { if (document.hidden && Persist.dirty) { clearTimeout(Persist.timer); Persist.flush(); } else if (!document.hidden && Gist.cfg() && !Persist.dirty) { Gist.refrescar().then(ch => { if (ch && !$('#overlay').classList.contains('open')) { render(); toast('Datos actualizados'); } }); } });

function importarCSV(txt) {
  const lines = txt.split(/\r?\n/).filter(l => l.trim()); if (lines.length < 2) { toast('CSV vacío'); return; }
  const sep = lines[0].includes(';') ? ';' : ','; const head = lines[0].split(sep).map(h => norm(h));
  const idx = (names) => head.findIndex(h => names.some(n => h.includes(n)));
  const iF = idx(['fecha', 'date']), iD = idx(['desc', 'concepto', 'detalle']), iM = idx(['monto', 'importe', 'amount', 'total']), iC = idx(['categ']), iQ = idx(['cuota']);
  if (iF < 0 || iM < 0) { toast('Necesito al menos columnas fecha y monto'); return; }
  let n = 0;
  for (const l of lines.slice(1)) {
    const c = l.split(sep); let fecha = c[iF]?.trim(); if (!fecha) continue;
    if (/^\d{1,2}\/\d{1,2}\/\d{2,4}$/.test(fecha)) { const [d, m, y] = fecha.split('/'); fecha = `${y.length === 2 ? '20' + y : y}-${pad2(m)}-${pad2(d)}`; }
    if (!/^\d{4}-\d{2}-\d{2}$/.test(fecha)) continue;
    const monto = Math.abs(M.parse(c[iM])); if (!monto) continue;
    const desc = (iD >= 0 ? c[iD] : 'Importado').trim(); const s = Smart.suggest(desc);
    let catId = s ? s.catId : 'otros'; if (iC >= 0 && c[iC]) { const found = state.categorias.find(k => norm(k.nombre) === norm(c[iC]) || k.id === norm(c[iC])); if (found) catId = found.id; }
    state.movimientos.push({ id: uid(), fecha, desc, monto, moneda: 'ARS', catId, medio: state.tarjetas.length ? 'tarjeta' : 'debito', tarjetaId: (state.tarjetas[0] || {}).id, necesidad: s ? s.necesidad : 2, cuotas: iQ >= 0 ? Number(c[iQ]) || 1 : 1 }); n++;
  }
  Persist.save(); toast(`${n} movimientos importados`); go('movimientos');
}

/* ---------- boot ---------- */
(async function boot() {
  applyTheme();
  try { const u = JSON.parse(sessionStorage.getItem('flujo.ui') || 'null'); if (u) { ui.view = u.view || ui.view; ui.mes = u.mes || ui.mes; ui.cur = u.cur || ui.cur; } } catch (e) {}
  renderNav(); $('#view').innerHTML = '<div class="empty">Cargando…</div>';
  await Persist.init();
  render();
  if (!window.claude && state.settings.tcFecha !== D.today()) TC.actualizar(true).then(ok => { if (ok) render(); });
  if (Gist.cfg()) Gist.refrescar(true).then(ch => { if (ch) { lastView = null; render(); toast('Datos actualizados desde tus otros dispositivos'); } });
})();
